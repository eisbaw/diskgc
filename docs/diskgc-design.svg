<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 1460" width="1200" height="1460">
  <title>diskgc: profiles, index and reclaim</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      text { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; fill: #1f2937; }
      .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; }
      .h1 { font-size: 26px; font-weight: 700; }
      .sub { font-size: 14px; fill: #4b5563; }
      .section { font-size: 13px; font-weight: 700; fill: #6b7280; letter-spacing: 1.5px; }
      .h2 { font-size: 16px; font-weight: 700; }
      .h3 { font-size: 14px; font-weight: 700; }
      .body { font-size: 12.5px; }
      .small { font-size: 12px; fill: #4b5563; }
      .cmd { font-size: 13px; font-weight: 600; }
      .code { font-size: 12px; fill: #374151; }
      .edge { stroke: #6b7280; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="1460" fill="#ffffff"/>

  <text x="40" y="48" class="h1">diskgc: profiles, index and reclaim</text>
  <text x="40" y="74" class="sub">Profiles say what cruft is and how to remove it; tiers say when. A background tally keeps an index, so freeing space never waits for a survey.</text>

  <!-- ===================== INTERFACE ===================== -->
  <text x="40" y="112" class="section">INTERFACE</text>

  <rect x="40" y="126" width="360" height="190" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="60" y="152" class="h2">Background service</text>
  <text x="60" y="176" class="mono cmd" style="fill:#1d4ed8">diskgc watch --min-free 30G</text>
  <text x="60" y="194" class="mono cmd" style="fill:#1d4ed8">  --target-free 60G PATH</text>
  <text x="60" y="222" class="body">• every 10 s: statvfs; below min → reclaim to target</text>
  <text x="60" y="242" class="body">• background tally keeps the index fresh (~5% disk)</text>
  <text x="60" y="262" class="body">• writes an index snapshot for ensure / survey</text>
  <text x="60" y="282" class="body">• --tally-only: index only (CI runners between jobs)</text>
  <text x="60" y="302" class="small">one supervised process per filesystem, as the owner</text>

  <rect x="420" y="126" width="360" height="190" rx="10" fill="#eefaf2" stroke="#2f9a5a" stroke-width="1.5"/>
  <text x="440" y="152" class="h2">CI / agent util</text>
  <text x="440" y="176" class="mono cmd" style="fill:#15803d">diskgc ensure --min-free 50G</text>
  <text x="440" y="194" class="mono cmd" style="fill:#15803d">  [--target-free 80G] [--select E] PATH</text>
  <text x="440" y="222" class="body">• warm index if a snapshot is fresh, else a sync</text>
  <text x="440" y="240" class="body">  tally within --tally-budget (--no-index forces it)</text>
  <text x="440" y="262" class="body">0 met · 1 exhausted · 2 usage · 3 tier failed</text>
  <text x="440" y="282" class="body">75 lock busy · 124 deadline · 130/143 signal</text>
  <text x="440" y="302" class="small">--json: one object on stdout; logs on stderr</text>

  <rect x="800" y="126" width="360" height="190" rx="10" fill="#f6f6f8" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="820" y="152" class="h2">Read-only</text>
  <text x="820" y="176" class="mono cmd">diskgc survey PATH...</text>
  <text x="820" y="196" class="body">what each profile matches, sizes, ages, in use,</text>
  <text x="820" y="214" class="body">plus unmatched entries grouped by name family</text>
  <text x="820" y="240" class="mono cmd">diskgc profiles list | show | test</text>
  <text x="820" y="264" class="mono cmd">diskgc check</text>
  <text x="930" y="264" class="body">static validation</text>
  <text x="820" y="288" class="mono cmd">--dry-run</text>
  <text x="910" y="288" class="body">the plan, from the index</text>

  <!-- ===================== PROFILES ===================== -->
  <text x="40" y="354" class="section">PROFILES: WHAT CRUFT IS AND HOW TO REMOVE IT</text>

  <rect x="40" y="368" width="360" height="226" rx="10" fill="#fbf7ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="60" y="394" class="h3">A profile (built-in YAML, or yours)</text>
  <text x="60" y="420" class="mono code">name:  pytest-tmp</text>
  <text x="60" y="440" class="mono code">find:  roots /tmp, /var/tmp</text>
  <text x="60" y="458" class="mono code">       paths pytest-of-*,</text>
  <text x="60" y="476" class="mono code">             nix-shell.*/pytest-of-*</text>
  <text x="60" y="496" class="mono code">where: idle_for · has / has_not</text>
  <text x="60" y="516" class="mono code">action: delete | command | kind</text>
  <text x="60" y="536" class="mono code">kind:  fs | cargo-target | docker-*</text>
  <text x="60" y="554" class="mono code">       | nix-store</text>
  <text x="60" y="576" class="small">examples (match / no_match) run as tests</text>

  <rect x="420" y="368" width="360" height="226" rx="10" fill="#fbf7ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="440" y="394" class="h3">Composing them in a tier</text>
  <text x="440" y="420" class="mono code">select: (pytest-tmp || nix-shell-rc)</text>
  <text x="440" y="438" class="mono code">        &amp;&amp; idle-3d &amp;&amp; !claude-code-tmp</text>
  <text x="440" y="466" class="body">• each term: one source &amp;&amp; filters, !filter, !profile</text>
  <text x="440" y="486" class="body">• || is a union; one kind and one action per select</text>
  <text x="440" y="506" class="body">• ! and protect: exclude by overlap, only narrow</text>
  <text x="440" y="526" class="body">• positive only: nothing no profile found is deleted</text>
  <text x="440" y="546" class="body">• roots fixed, or roots: required (from tier / --roots)</text>
  <text x="440" y="576" class="small">built-ins may get more precise, never broader</text>

  <rect x="800" y="368" width="360" height="226" rx="10" fill="#fbf7ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="820" y="394" class="h3">Built-in library (v1 targets)</text>
  <text x="820" y="418" class="body"><tspan font-weight="700">test</tspan>  pytest-tmp, pytest-cache</text>
  <text x="820" y="436" class="body"><tspan font-weight="700">nix</tspan>  nix-shell-rc, nix-shell-tmpdir, nix-garbage</text>
  <text x="820" y="454" class="body"><tspan font-weight="700">rust</tspan>  cargo-target</text>
  <text x="820" y="472" class="body"><tspan font-weight="700">containers</tspan>  docker-build-cache, -dangling</text>
  <text x="820" y="490" class="body"><tspan font-weight="700">ai agents</tspan>  claude-code-tmp</text>
  <text x="820" y="508" class="body"><tspan font-weight="700">python/js</tspan>  uv, pnpm, yarn, jest, playwright</text>
  <text x="820" y="526" class="body"><tspan font-weight="700">c/c++/jvm</tspan>  sccache, cmake-build, gradle</text>
  <text x="820" y="544" class="body"><tspan font-weight="700">embedded</tspan>  zephyr-tmp, west-build, renode</text>
  <text x="820" y="562" class="body"><tspan font-weight="700">filters</tspan>  idle-1h … idle-30d</text>
  <text x="820" y="582" class="small">each ships once verified on a real system</text>

  <!-- ===================== GATHER, THEN ACT ===================== -->
  <text x="40" y="632" class="section">GATHER, THEN ACT</text>

  <rect x="40" y="646" width="250" height="186" rx="10" fill="#eef7fb" stroke="#0e7490" stroke-width="1.5"/>
  <text x="58" y="672" class="h3">1  Tally (background)</text>
  <text x="58" y="696" class="body">mini-batches; sleep 19 × work</text>
  <text x="58" y="714" class="body">(~5% of the disk's time)</text>
  <text x="58" y="734" class="body">idle I/O priority, nice 19</text>
  <text x="58" y="754" class="body">pauses while a reclaim runs</text>
  <text x="58" y="774" class="body">discovery · re-check · re-tally</text>
  <text x="58" y="798" class="small">no watch? a sync tally runs first,</text>
  <text x="58" y="816" class="small">bounded by --tally-budget</text>

  <rect x="320" y="646" width="270" height="186" rx="10" fill="#eef7fb" stroke="#0e7490" stroke-width="1.5"/>
  <text x="338" y="672" class="h3">2  Index</text>
  <text x="338" y="696" class="body">one unit per candidate; small ones</text>
  <text x="338" y="714" class="body">bucketed by name family</text>
  <text x="338" y="734" class="body">identity: mount, inode, birth time</text>
  <text x="338" y="754" class="body">size estimate, newest change, flags</text>
  <text x="338" y="774" class="body">per-mount path trie (overlap queries)</text>
  <text x="338" y="798" class="small">≤ 100k units; snapshot file (0600)</text>
  <text x="338" y="816" class="small">for ensure and survey</text>

  <rect x="620" y="646" width="250" height="186" rx="10" fill="#eef7fb" stroke="#0e7490" stroke-width="1.5"/>
  <text x="638" y="672" class="h3">3  Priority queue</text>
  <text x="638" y="696" class="body">derived per tier from the index</text>
  <text x="638" y="716" class="body">group → tier → order</text>
  <text x="638" y="740" class="body">order: oldest (default)</text>
  <text x="638" y="760" class="body">or best-fit: smallest unit that</text>
  <text x="638" y="778" class="body">covers the need, else largest</text>
  <text x="638" y="808" class="small">rebuilt when tiers change</text>

  <rect x="900" y="646" width="260" height="186" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5"/>
  <text x="918" y="672" class="h3">4  Reclaim walk</text>
  <text x="918" y="696" class="body">pop unit; re-check it (statx)</text>
  <text x="918" y="716" class="body">re-evaluate its selection now</text>
  <text x="918" y="736" class="body">safety checks at deletion time</text>
  <text x="918" y="756" class="body">act; re-read statvfs</text>
  <text x="918" y="776" class="body">stop as soon as goal is met</text>
  <text x="918" y="800" class="small">then one discovery pass for what</text>
  <text x="918" y="818" class="small">the index has not seen yet</text>

  <path d="M290 739 H316" class="edge" marker-end="url(#arrow)"/>
  <path d="M590 739 H616" class="edge" marker-end="url(#arrow)"/>
  <path d="M870 739 H896" class="edge" marker-end="url(#arrow)"/>

  <rect x="40" y="848" width="1120" height="38" rx="8" fill="#fff7e6" stroke="#c98a12"/>
  <text x="600" y="872" class="body" text-anchor="middle" font-weight="700">The index is a cache, never an authority: a stale or missing index costs speed, never safety.</text>

  <!-- ===================== CONFIG ===================== -->
  <text x="40" y="924" class="section">CONFIG: GROUPS ESCALATE, TIERS SELECT PROFILES</text>

  <rect x="40" y="938" width="740" height="262" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <circle cx="64" cy="962" r="5" fill="#2f9a5a"/>
  <text x="76" y="967" class="h3">group stale · ranking: random (tiers shuffled within the group)</text>
  <text x="64" y="992" class="mono code">test-and-shell-cruft  (pytest-tmp || nix-shell-rc) &amp;&amp; idle-3d</text>
  <text x="64" y="1012" class="mono code">cargo-stale           cargo-target &amp;&amp; idle-7d   roots: /home/mark/src</text>
  <text x="64" y="1032" class="mono code">docker-cache-stale    docker-build-cache &amp;&amp; idle-7d</text>
  <text x="64" y="1052" class="mono code">nix-dead              nix-garbage</text>
  <circle cx="64" cy="1084" r="5" fill="#d97706"/>
  <text x="76" y="1089" class="h3">group pressure · ordered (costs rebuild or download time)</text>
  <text x="64" y="1114" class="mono code">docker-dangling       docker-dangling</text>
  <text x="64" y="1134" class="mono code">tmp-old               tmp-entry &amp;&amp; idle-2d</text>
  <text x="64" y="1154" class="mono code">cargo-recent          cargo-target &amp;&amp; idle-1h   roots: /home/mark/src</text>
  <text x="64" y="1186" class="mono code">protect: [claude-code-tmp]</text>
  <text x="300" y="1186" class="small">(never deleted by any tier, by overlap)</text>

  <rect x="800" y="938" width="360" height="262" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="820" y="964" class="h3">Hysteresis</text>
  <text x="900" y="992" class="small" text-anchor="middle">min-free</text>
  <text x="1010" y="992" class="small" text-anchor="middle">target-free</text>
  <rect x="820" y="998" width="80" height="18" fill="#f3b4b4"/>
  <rect x="900" y="998" width="110" height="18" fill="#f6dc9a"/>
  <rect x="1010" y="998" width="130" height="18" fill="#bfe5c9"/>
  <rect x="820" y="998" width="320" height="18" fill="none" stroke="#9ca3af"/>
  <text x="860" y="1032" class="small" text-anchor="middle">reclaim</text>
  <text x="955" y="1032" class="small" text-anchor="middle">hold</text>
  <text x="1075" y="1032" class="small" text-anchor="middle">idle</text>
  <text x="820" y="1062" class="body">• watch: below min → reclaim to target</text>
  <text x="820" y="1082" class="body">• ensure: target defaults to min-free</text>
  <text x="820" y="1102" class="body">• idle-* filters: recent stuff not eligible</text>
  <text x="820" y="1122" class="body">• back-off when everything left is in use</text>
  <text x="820" y="1142" class="body">• stop as soon as the goal is met</text>
  <text x="820" y="1180" class="small">thresholds are CLI flags, not config</text>

  <!-- ===================== SAFETY ===================== -->
  <text x="40" y="1238" class="section">SAFETY: CODE, ALWAYS ON, NO PROFILE CAN SWITCH IT OFF</text>

  <rect x="40" y="1252" width="740" height="180" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5"/>
  <text x="60" y="1278" class="h3">Every filesystem candidate, whichever profile found it</text>
  <text x="60" y="1302" class="body">• own files only (owners: list required with --allow-root); mounts read first, never crossed</text>
  <text x="60" y="1322" class="body">• in use = open fd, cwd, mmap or TMPDIR-style env path, matched by device and inode</text>
  <text x="60" y="1342" class="body">• skipped: flock'd dirs, sockets/FIFOs, .diskgc-keep or special-action content inside</text>
  <text x="60" y="1362" class="body">• right before deleting: flock the candidate, re-walk it, re-scan /proc; no symlinks followed</text>
  <text x="60" y="1382" class="body">• cargo-target: take every known lock file, delete only inside locked profile dirs,</text>
  <text x="60" y="1400" class="body">  never touch a lock file; /proc covers binaries still running after Cargo unlocked</text>
  <text x="60" y="1422" class="small">success is judged by statvfs, not by tallies</text>

  <rect x="800" y="1252" width="360" height="180" rx="10" fill="#fdf0f0" stroke="#d9534f" stroke-width="1.5"/>
  <text x="820" y="1278" class="h3">Never touched</text>
  <text x="820" y="1302" class="body">• anything no source profile found</text>
  <text x="820" y="1322" class="body">• Docker volumes and containers</text>
  <text x="820" y="1342" class="body">• Nix GC roots, profiles, generations</text>
  <text x="820" y="1362" class="body">• Cargo lock files; target/doc, tmp, criterion</text>
  <text x="820" y="1382" class="body">• anything in use, other users' files</text>
  <text x="820" y="1402" class="body">• other mounts, symlink targets</text>
  <text x="820" y="1422" class="small">command actions: trusted, author-scoped</text>
</svg>
