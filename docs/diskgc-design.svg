<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1190" width="1200" height="1190">
  <title>diskgc: interface and reclamation</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      text { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; fill: #1f2937; }
      .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; }
      .h1 { font-size: 26px; font-weight: 700; }
      .sub { font-size: 14px; fill: #4b5563; }
      .section { font-size: 13px; font-weight: 700; fill: #6b7280; letter-spacing: 1.5px; }
      .h2 { font-size: 17px; font-weight: 700; }
      .h3 { font-size: 14px; font-weight: 700; }
      .body { font-size: 13px; }
      .muted { font-size: 13px; fill: #6b7280; }
      .small { font-size: 12px; fill: #4b5563; }
      .cmd { font-size: 14px; font-weight: 600; }
      .code { font-size: 12.5px; fill: #374151; }
      .edge { stroke: #6b7280; stroke-width: 1.6; fill: none; }
      .node { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1200" height="1190" fill="#ffffff"/>

  <text x="40" y="48" class="h1">diskgc: interface and reclamation</text>
  <text x="40" y="74" class="sub">One cleanup core, tiers from config.yaml. A service calls it when available space drops; CI and agents call it on demand.</text>

  <!-- ============ INTERFACE ============ -->
  <text x="40" y="112" class="section">INTERFACE</text>

  <!-- Background service -->
  <rect x="40" y="126" width="540" height="236" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="64" y="154" class="h2">Background service</text>
  <text x="64" y="178" class="mono cmd" fill="#1d4ed8" style="fill:#1d4ed8">diskgc watch --min-free 30G --target-free 60G PATH</text>
  <text x="64" y="200" class="muted">systemd unit per filesystem, runs as the owner (not root)</text>

  <!-- free-space gauge: left = 0 free, right = plenty free -->
  <text x="212" y="222" class="small" text-anchor="middle">min-free 30G</text>
  <text x="359" y="222" class="small" text-anchor="middle">target-free 60G</text>
  <rect x="64" y="228" width="148" height="18" fill="#f3b4b4"/>
  <rect x="212" y="228" width="147" height="18" fill="#f6dc9a"/>
  <rect x="359" y="228" width="197" height="18" fill="#bfe5c9"/>
  <rect x="64" y="228" width="492" height="18" fill="none" stroke="#9ca3af"/>
  <text x="138" y="262" class="small" text-anchor="middle">reclaim</text>
  <text x="285" y="262" class="small" text-anchor="middle">hold (hysteresis)</text>
  <text x="457" y="262" class="small" text-anchor="middle">idle</text>
  <text x="556" y="262" class="small" text-anchor="end">available →</text>

  <text x="64" y="292" class="mono body" font-weight="600">every 10 s</text>
  <text x="190" y="292" class="body">read available space (statvfs, one syscall)</text>
  <text x="64" y="316" class="mono body" font-weight="600">below min</text>
  <text x="190" y="316" class="body">reclaim until target-free; back off if stuck</text>
  <text x="64" y="340" class="mono body" font-weight="600">otherwise</text>
  <text x="190" y="340" class="body">do nothing</text>

  <!-- CI / agent util -->
  <rect x="620" y="126" width="540" height="236" rx="10" fill="#eefaf2" stroke="#2f9a5a" stroke-width="1.5"/>
  <text x="644" y="154" class="h2">CI / agent util</text>
  <text x="644" y="178" class="mono cmd" style="fill:#15803d">diskgc ensure --min-free 50G [--target-free 80G] PATH</text>
  <text x="644" y="200" class="muted">CI pre-job hook; agents before each task. [--json] [--dry-run]</text>

  <text x="644" y="234" class="mono body" font-weight="600">exit 0</text>
  <text x="714" y="234" class="body">at least 50G available on the filesystem of PATH</text>
  <text x="644" y="258" class="mono body" font-weight="600">exit 1</text>
  <text x="714" y="258" class="body">exhausted: the rest is in use, kept or too recent;</text>
  <text x="714" y="276" class="body">report lists what was skipped and why</text>
  <text x="644" y="300" class="mono body" font-weight="600">exit 2</text>
  <text x="714" y="300" class="body">usage/config error, nothing deleted (3: tier failed)</text>
  <text x="644" y="340" class="muted">75: lock busy past --timeout, still short · 124: deadline · 130/143</text>

  <!-- arrows into the core -->
  <path d="M310 362 V384 H540 V398" class="edge" marker-end="url(#arrow)"/>
  <text x="322" y="378" class="small">min = min-free, goal = target-free</text>
  <path d="M890 362 V384 H660 V398" class="edge" marker-end="url(#arrow)"/>
  <text x="878" y="378" class="small" text-anchor="end">goal = --target-free (default: --min-free)</text>

  <!-- core -->
  <rect x="380" y="400" width="440" height="72" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5"/>
  <text x="600" y="430" class="mono" font-size="15" font-weight="700" text-anchor="middle">reclaim(min, goal, filesystem, deadline)</text>
  <text x="600" y="454" class="body" text-anchor="middle">min-free met? return. else flock /run/diskgc/lock, re-check</text>

  <!-- ============ RECLAMATION ============ -->
  <text x="40" y="526" class="section">RECLAMATION: EXAMPLE config.yaml, GROUPS IN LIST ORDER, STOP WHEN GOAL IS MET</text>

  <!-- Pass 1 -->
  <circle cx="48" cy="547" r="5" fill="#2f9a5a"/>
  <text x="60" y="552" class="h3">group: stale · ranking: random (tiers shuffled within the group)</text>

  <rect x="40" y="564" width="700" height="56" rx="8" fill="#f3faf5" stroke="#9fd3b2"/>
  <circle cx="68" cy="592" r="14" fill="#2f9a5a"/><text x="68" y="597" font-size="14" font-weight="700" text-anchor="middle" style="fill:#fff">?</text>
  <text x="96" y="587" class="h3">cargo · idle_for: 7d</text>
  <text x="724" y="587" class="small" text-anchor="end">rebuild only if revisited</text>
  <text x="96" y="608" class="mono code">delete inside locked profile dirs, keep lock files</text>

  <rect x="40" y="628" width="700" height="56" rx="8" fill="#f3faf5" stroke="#9fd3b2"/>
  <circle cx="68" cy="656" r="14" fill="#2f9a5a"/><text x="68" y="661" font-size="14" font-weight="700" text-anchor="middle" style="fill:#fff">?</text>
  <text x="96" y="651" class="h3">docker-build-cache · unused_for: 7d</text>
  <text x="724" y="651" class="small" text-anchor="end">layers rebuilt on demand</text>
  <text x="96" y="672" class="mono code">docker builder prune --force --filter until=168h</text>

  <rect x="40" y="692" width="700" height="56" rx="8" fill="#f3faf5" stroke="#9fd3b2"/>
  <circle cx="68" cy="720" r="14" fill="#2f9a5a"/><text x="68" y="725" font-size="14" font-weight="700" text-anchor="middle" style="fill:#fff">?</text>
  <text x="96" y="715" class="h3">nix-gc</text>
  <text x="724" y="715" class="small" text-anchor="end">mostly re-downloadable</text>
  <text x="96" y="736" class="mono code">nix-store --gc --max-freed &lt;goal − available&gt;</text>

  <!-- Pass 2 -->
  <circle cx="48" cy="777" r="5" fill="#d97706"/>
  <text x="60" y="782" class="h3">group: pressure · ranking: ordered (costs rebuild or download time)</text>

  <rect x="40" y="794" width="700" height="56" rx="8" fill="#fff8ee" stroke="#f0c98a"/>
  <circle cx="68" cy="822" r="14" fill="#d97706"/><text x="68" y="827" font-size="14" font-weight="700" text-anchor="middle" style="fill:#fff">4</text>
  <text x="96" y="817" class="h3">docker-images · select: dangling</text>
  <text x="724" y="817" class="small" text-anchor="end">untagged, nothing lost</text>
  <text x="96" y="838" class="mono code">docker image prune --force</text>

  <rect x="40" y="858" width="700" height="56" rx="8" fill="#fff8ee" stroke="#f0c98a"/>
  <circle cx="68" cy="886" r="14" fill="#d97706"/><text x="68" y="891" font-size="14" font-weight="700" text-anchor="middle" style="fill:#fff">5</text>
  <text x="96" y="881" class="h3">cargo · idle_for: 1h</text>
  <text x="724" y="881" class="small" text-anchor="end">minutes of rebuild</text>
  <text x="96" y="902" class="mono code">delete inside locked profile dirs, keep lock files</text>

  <rect x="40" y="922" width="700" height="56" rx="8" fill="#fff8ee" stroke="#f0c98a"/>
  <circle cx="68" cy="950" r="14" fill="#d97706"/><text x="68" y="955" font-size="14" font-weight="700" text-anchor="middle" style="fill:#fff">6</text>
  <text x="96" y="945" class="h3">generic · path: /home/mark/.cache/pip (escape hatch)</text>
  <text x="724" y="945" class="small" text-anchor="end">trusted command, no in-use check</text>
  <text x="96" y="966" class="mono code">command: [pip, cache, purge]  (argv, cwd = path)</text>

  <!-- Per-candidate loop -->
  <text x="800" y="552" class="h3">For each tier, each candidate</text>

  <rect x="800" y="564" width="320" height="40" rx="6" class="node"/>
  <text x="960" y="589" class="body" text-anchor="middle">groups in order; tiers ordered or shuffled</text>
  <path d="M960 604 V618" class="edge" marker-end="url(#arrow)"/>

  <rect x="800" y="620" width="320" height="40" rx="6" class="node"/>
  <text x="960" y="645" class="body" text-anchor="middle">candidates on this filesystem, oldest first</text>
  <path d="M960 660 V674" class="edge" marker-end="url(#arrow)"/>

  <rect x="800" y="676" width="320" height="40" rx="6" fill="#fff7e6" stroke="#c98a12" stroke-width="1.2"/>
  <text x="960" y="701" class="body" text-anchor="middle">safety gate: in use → skip, add to report</text>
  <path d="M960 716 V730" class="edge" marker-end="url(#arrow)"/>

  <rect x="800" y="732" width="320" height="40" rx="6" class="node"/>
  <text x="960" y="757" class="body" text-anchor="middle">delete (cargo: in place, locks held)</text>
  <path d="M960 772 V786" class="edge" marker-end="url(#arrow)"/>

  <rect x="800" y="788" width="320" height="40" rx="6" class="node"/>
  <text x="960" y="813" class="body" text-anchor="middle">syncfs, re-read available space</text>
  <path d="M960 828 V842" class="edge" marker-end="url(#arrow)"/>

  <rect x="800" y="844" width="320" height="40" rx="6" class="node"/>
  <text x="960" y="869" class="body" text-anchor="middle">goal met?</text>

  <!-- no: loop back -->
  <path d="M1120 864 H1145 V640 H1124" class="edge" marker-end="url(#arrow)"/>
  <text x="1160" y="752" class="small" text-anchor="middle" transform="rotate(90 1160 752)">no: next candidate / tier</text>

  <!-- yes -->
  <path d="M960 884 V902" class="edge" marker-end="url(#arrow)"/>
  <text x="970" y="898" class="small">yes</text>
  <rect x="800" y="904" width="320" height="36" rx="6" fill="#eefaf2" stroke="#2f9a5a" stroke-width="1.2"/>
  <text x="960" y="927" class="body" text-anchor="middle">done (ensure exits 0)</text>

  <rect x="800" y="952" width="320" height="52" rx="6" fill="#fdf0f0" stroke="#d9534f" stroke-width="1.2"/>
  <text x="960" y="973" class="body" text-anchor="middle">exhausted, below min-free: ensure exits 1</text>
  <text x="960" y="992" class="small" text-anchor="middle">between min and target: exit 0, target_met false</text>

  <!-- Cargo safety gate -->
  <rect x="40" y="1028" width="700" height="132" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5"/>
  <text x="64" y="1056" class="h3">Cargo tier: when and how a target/ is deleted</text>
  <text x="64" y="1082" class="body">• CACHEDIR.TAG + profile dirs with .cargo-lock; no .diskgc-keep; built &gt; idle_for ago</text>
  <text x="64" y="1102" class="body">• all .cargo-lock taken without waiting, then re-listed; no process exe/cwd inside</text>
  <text x="64" y="1122" class="body">• only inside locked profile dirs: .fingerprint/ first, then all but .cargo-lock</text>
  <text x="64" y="1142" class="body">• lock files never move: waiting and new builds share one lock, so they just wait</text>

  <!-- Never touched -->
  <rect x="780" y="1028" width="380" height="132" rx="10" fill="#fdf0f0" stroke="#d9534f" stroke-width="1.5"/>
  <text x="804" y="1056" class="h3">Never touched</text>
  <text x="804" y="1082" class="body">• Docker volumes and containers; Nix roots, generations</text>
  <text x="804" y="1102" class="body">• anything matched by no tier, or marked .diskgc-keep</text>
  <text x="804" y="1122" class="body">• lock files; target/doc, tmp, criterion; busy targets</text>
  <text x="804" y="1142" class="body">• symlink targets, other mounts, other filesystems</text>
</svg>
