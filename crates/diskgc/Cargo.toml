[package]
name = "diskgc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "diskgc"
path = "src/main.rs"

[dependencies]
diskgc-core.workspace = true
diskgc-linux.workspace = true
getrandom.workspace = true

[features]
# Builds this version's release row of crates/diskgc-core/src/releases.json:
# its commands and its narrowed catalog. On its own this retains
# diskgc-linux's sandbox gate; the release-candidate derivation enables both.
release-catalog = []

[dev-dependencies]
# Test-only: reads the binary's --json output back.
serde_json.workspace = true
# Test-only: runs the binary with a tmpfs over /proc, in a user and a mount
# namespace of its own (TASK-291).
rustix = { workspace = true, features = ["mount", "thread"] }
