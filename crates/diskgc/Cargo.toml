[package]
name = "diskgc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "diskgc"
path = "src/main.rs"

[dependencies]
diskgc-core.workspace = true
diskgc-linux.workspace = true
getrandom.workspace = true

[features]
# Narrows the catalog. On its own this retains diskgc-linux's sandbox gate;
# the test-only release-01-candidate derivation enables both required features.
proposed-release-01-catalog = []

[dev-dependencies]
# Test-only: reads the binary's --json output back.
serde_json.workspace = true
