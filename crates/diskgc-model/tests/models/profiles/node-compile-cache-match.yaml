# The exact cache entry is eligible; a similar path or missing marker is preserved.
profile_vector: 1
profile: node-compile-cache
path: /tmp

min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/node-compile-cache: {.: {mtime: 2026-08-01T00:00:00Z}, payload: {size: 8K, mtime: 2026-08-01T00:00:00Z}}
    /tmp/node-compile-cache-old: {.: {mtime: 2026-08-01T00:00:00Z}, payload: {size: 8K, mtime: 2026-08-01T00:00:00Z}}
expect:
  plan:
    - {candidate: /tmp/node-compile-cache}
  reclaim_exit: 1
  actions: [/tmp/node-compile-cache]
  removed: [/tmp/node-compile-cache]
  skipped: []
  preserved:
    - /tmp/node-compile-cache-old/payload
