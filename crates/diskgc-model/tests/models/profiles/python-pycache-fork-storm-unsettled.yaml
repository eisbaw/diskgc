# TASK-64 G (docs/safety.md, In use: "Every process, and only once
# settled"): a fork storm that outlasts the checker's one retry. Python 42
# forks a child after each of the first 32 process listings, so the first
# candidate's scan and its retry both reach the 16-growth-listing bound:
# unsettled twice, in_use_unknown (TASK-190). The second candidate must
# not reuse that unsettled scan (even inside the 500 ms blocked-reuse
# window): it scans again, the storm is over, and it is deleted. No
# process uses either cache. Mutations that turn this red: reusing an unsettled scan
# (Checker::reusable_at), letting an unsettled scan clear (Scan::blocked).
