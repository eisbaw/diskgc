# TASK-64 G (docs/safety.md, In use: "Every process, and only once
# settled"): a fork storm that outlasts the checker's one retry. Python 42
# forks a child after each of the first 32 process listings, so the first
# candidate's scan and its retry both reach the 16-growth-listing bound:
# unsettled twice. Until TASK-364 that kept it in_use_unknown (TASK-190);
# now the plan and the reclaim wait the storm out (one 2 s back-off, In
# use: Busy host), scan again, find it over, and judge both caches
# eligible; the reclaim deletes both. No process uses either cache. An
# unsettled scan never clears (Scan::blocked: pinned by inuse.rs
# a_process_list_that_keeps_growing_leaves_the_scan_unsettled); the waits
# are pinned by busy_host.rs.
profile_vector: 1
profile: python-pycache
path: /home/tester/project
roots: [/home/tester/project]
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/python: {}
    /home/tester/project/run.log: {size: 1K}
    /home/tester/project/a/__pycache__:
      .: {mtime: 2026-10-10T00:00:00Z}
