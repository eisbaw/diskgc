# GNU Autoconf 2.73's generated config.status records ac_pwd and srcdir.
# A copied build, missing source, checkout, fresh output and in-source build
# cannot be reclaimed by the built-in.
profile_vector: 1
profile: autotools-build-anchored
path: /home/tester/project
roots: [/home/tester/project]
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /home/tester/project/app/configure.ac: {content: "AC_INIT([app],[1])\n"}
    /home/tester/project/app/output:
      .: {mtime: 2026-10-01T00:00:00Z}
      config.status: {content: "# Generated by configure.\nac_pwd='/home/tester/project/app/output'\nsrcdir='..'\n", mtime: 2026-10-01T00:00:00Z}
      config.log: {content: "Invocation command line was ../configure\n", mtime: 2026-10-01T00:00:00Z}
      Makefile: {content: "all:\n\t@true\n", mtime: 2026-10-01T00:00:00Z}
      object.o: {size: 8K, mtime: 2026-10-01T00:00:00Z}
    /home/tester/project/missing/output:
      .: {mtime: 2026-10-01T00:00:00Z}
      config.status: {content: "ac_pwd='/home/tester/project/missing/output'\nsrcdir='..'\n", mtime: 2026-10-01T00:00:00Z}
      config.log: {mtime: 2026-10-01T00:00:00Z}
      Makefile: {mtime: 2026-10-01T00:00:00Z}
      precious: {size: 8K, mtime: 2026-10-01T00:00:00Z}
    /home/tester/project/copied/configure.ac: {content: "AC_INIT([copied],[1])\n"}
    /home/tester/project/copied/output:
      .: {mtime: 2026-10-01T00:00:00Z}
      config.status: {content: "ac_pwd='/home/tester/project/original/output'\nsrcdir='..'\n", mtime: 2026-10-01T00:00:00Z}
      config.log: {mtime: 2026-10-01T00:00:00Z}
      Makefile: {mtime: 2026-10-01T00:00:00Z}
      precious: {size: 8K, mtime: 2026-10-01T00:00:00Z}
    /home/tester/project/checkout/configure.ac: {content: "AC_INIT([checkout],[1])\n"}
    /home/tester/project/checkout/output:
      .: {mtime: 2026-10-01T00:00:00Z}
      config.status: {content: "ac_pwd='/home/tester/project/checkout/output'\nsrcdir='..'\n", mtime: 2026-10-01T00:00:00Z}
      config.log: {mtime: 2026-10-01T00:00:00Z}
      Makefile: {mtime: 2026-10-01T00:00:00Z}
      .git: {.: {mtime: 2026-10-01T00:00:00Z}, HEAD: {mtime: 2026-10-01T00:00:00Z}}
    /home/tester/project/fresh/configure.ac: {content: "AC_INIT([fresh],[1])\n"}
    /home/tester/project/fresh/output:
      config.status: {content: "ac_pwd='/home/tester/project/fresh/output'\nsrcdir='..'\n"}
      config.log: {}
      Makefile: {}
    /home/tester/project/insource:
      configure.ac: {content: "AC_INIT([insource],[1])\n"}
      config.status: {content: "ac_pwd='/home/tester/project/insource'\nsrcdir='.'\n"}
      config.log: {}
      Makefile: {}
expect:
  plan:
    - {candidate: /home/tester/project/app/output, source: /home/tester/project/app}
    - {candidate: /home/tester/project/checkout/output, reason: contains_checkout, source: /home/tester/project/checkout}
    - {candidate: /home/tester/project/fresh/output, reason: not_idle, source: /home/tester/project/fresh}
  reclaim_exit: 1
  actions: [/home/tester/project/app/output]
  removed: [/home/tester/project/app/output]
  skipped:
    - {candidate: /home/tester/project/checkout/output, reason: contains_checkout}
    - {candidate: /home/tester/project/fresh/output, reason: not_idle}
  preserved:
    - /home/tester/project/app/configure.ac
    - /home/tester/project/missing/output/precious
    - /home/tester/project/copied/output/precious
    - /home/tester/project/checkout/output/.git/HEAD
    - /home/tester/project/fresh/output/config.status
    - /home/tester/project/insource/configure.ac
