# The exact cache entry is eligible; a similar path or missing marker is preserved.
profile_vector: 1
profile: xdg-cache-entry
path: /home/tester/.cache
roots: [/home/tester/.cache]
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /home/tester/.cache/nix-index: {size: 8K, mtime: 2026-08-01T00:00:00Z}
    /home/tester/.cache/huggingface: {.: {mtime: 2026-08-01T00:00:00Z}, payload: {size: 8K, mtime: 2026-08-01T00:00:00Z}}
expect:
  plan:
    - {candidate: /home/tester/.cache/nix-index}
  reclaim_exit: 1
  actions: [/home/tester/.cache/nix-index]
  removed: [/home/tester/.cache/nix-index]
  skipped: []
  preserved:
    - /home/tester/.cache/huggingface/payload
