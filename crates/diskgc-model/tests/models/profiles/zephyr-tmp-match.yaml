# `zephyr-tmp-probe`: user profile with the matching set of a built-in withdrawn in TASK-122.
# The exact cache entry is eligible; a similar path or missing marker is preserved.
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
profile: zephyr-tmp-probe
path: /tmp

min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-scratch: {.: {mtime: 2026-08-01T00:00:00Z}, payload: {size: 8K, mtime: 2026-08-01T00:00:00Z}}
    /tmp/zephyr: {.: {mtime: 2026-08-01T00:00:00Z}, payload: {size: 8K, mtime: 2026-08-01T00:00:00Z}}
expect:
  plan:
    - {candidate: /tmp/zephyr-scratch}
  reclaim_exit: 1
  actions: [/tmp/zephyr-scratch]
  removed: [/tmp/zephyr-scratch]
  skipped: []
  preserved:
    - /tmp/zephyr/payload
