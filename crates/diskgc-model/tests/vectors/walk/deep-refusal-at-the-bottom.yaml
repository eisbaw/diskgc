# The same 40-level chain with a socket at the bottom: the walk reaches the
# deepest level before refusing, and nothing of the chain is unlinked.
profile_vector: 1
profile: zephyr-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-deep/d01/d02/d03/d04/d05/d06/d07/d08/d09/d10/d11/d12/d13/d14/d15/d16/d17/d18/d19/d20/d21/d22/d23/d24/d25/d26/d27/d28/d29/d30/d31/d32/d33/d34/d35/d36/d37/d38/d39/d40:
      agent.sock: {type: socket}
    /tmp/zephyr-deep/a-first: {size: 4K}
expect:
  plan:
    - {candidate: /tmp/zephyr-deep, reason: contains_ipc}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/zephyr-deep, reason: contains_ipc}
  preserved:
    - /tmp/zephyr-deep/a-first
    - /tmp/zephyr-deep/d01/d02/d03/d04/d05/d06/d07/d08/d09/d10/d11/d12/d13/d14/d15/d16/d17/d18/d19/d20/d21/d22/d23/d24/d25/d26/d27/d28/d29/d30/d31/d32/d33/d34/d35/d36/d37/d38/d39/d40/agent.sock
