# Withdrawn built-in (TASK-122, mark-emulator for Mark, 2026-10-24): zephyr-tmp is replaced by a user probe profile with its matching set.
# A candidate file hard-linked from outside: deletion unlinks only the
# candidate's name; the outside name and its inode survive (an inode graph,
# not a path map).
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
profile: zephyr-tmp-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/keepers/original.bin: {size: 64M}
    /tmp/zephyr-linked: {alias.bin: {link: /tmp/keepers/original.bin}}
expect:
  plan:
    - {candidate: /tmp/zephyr-linked}
  reclaim_exit: 1
  actions: [/tmp/zephyr-linked]
  removed: [/tmp/zephyr-linked/alias.bin]
  skipped: []
  preserved: [/tmp/keepers/original.bin]
