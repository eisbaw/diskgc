# A supplied root that does not exist is a refusal of the whole run, not a
# skipped candidate (TASK-152, mark-emulator for Mark): exit 2 before any
# plan or deletion, naming the root and that it came from --roots (cause
# usage: a caller input). Before TASK-152 this vector planned `missing` for
# /home/tester/gone and reclaimed the cache under the other root, exit 1.
profile_vector: 1
profile: pytest-cache
path: /home
roots: [/home/tester/gone, /home/tester/here]
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /home/tester/here/.pytest_cache: {v: {size: 4K}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: usage, contains: "root /home/tester/gone (--roots) does not exist on this machine"}]
  reclaim_exit: 2
  errors: [{cause: usage, contains: "root /home/tester/gone (--roots) does not exist on this machine"}]
  actions: []
  removed: []
  skipped: []
  preserved: [/home/tester/here/.pytest_cache/v]
