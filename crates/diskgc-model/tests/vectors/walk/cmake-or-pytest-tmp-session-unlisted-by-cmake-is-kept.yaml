# TASK-367, Codex's fifth review: incomplete guarded coverage in
# `cmake-build-anchored || pytest-tmp`. The stamp (`.built`) is there from
# the start; the first listing of pytest-of-tester fails (EACCES), which
# is cmake's discovery's: cmake never finds the session, which is also a
# CMake build, so its guard is never asked, and pytest-tmp's discovery,
# listing it again, found and deleted it. The guard is the selection's
# (the sixth review): pytest-tmp's discovery asks it of the session, a
# build, whose climb finds the stamp, and leaves it out. pytest-1 holds no
# build: the guard does not judge it, so pytest-tmp takes it as it would
# without the guard (until the sixth review every candidate below the
# directory cmake could not list was refused).
profile_vector: 1
select: profile:cmake-build-anchored || profile:pytest-tmp
roots: [/tmp]
path: /tmp
min_free: 100%
no_index: true
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell.AB: {.: {mtime: 2026-10-01T00:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester: {.: {mtime: 2026-10-01T00:00:00Z}, .built: {mtime: 2026-10-01T00:00:00Z}, CMakeLists.txt: {mtime: 2026-10-01T00:00:00Z, content: "project(p)\n"}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-01T00:00:00Z}, CMakeCache.txt: {mtime: 2026-10-01T00:00:00Z, content: "CMAKE_HOME_DIRECTORY:INTERNAL=/tmp/nix-shell.AB/pytest-of-tester\n"}, CMakeFiles: {.: {mtime: 2026-10-01T00:00:00Z}}, a.o: {mtime: 2026-10-01T00:00:00Z, size: 8K}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-1: {.: {mtime: 2026-10-01T00:00:00Z}, test_a0: {.: {mtime: 2026-10-01T00:00:00Z}, f: {mtime: 2026-10-01T00:00:00Z}}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
  events:
    - {at: {op: read_dir, path: /tmp/nix-shell.AB/pytest-of-tester, nth: 1, when: before}, fail: EACCES}
expect:
  # cmake's discovery could not list pytest-of-tester: its own refusal.
  plan:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester, reason: unreadable}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-1}
  reclaim_exit: 1
  actions: [/tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  removed: [/tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  skipped:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester, reason: unreadable}
  preserved: [/tmp/nix-shell.AB/pytest-of-tester/pytest-0/a.o]
