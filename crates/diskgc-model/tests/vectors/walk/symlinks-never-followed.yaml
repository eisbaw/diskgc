# No symlink is followed (PRD, Safety boundaries): a symlink inside a
# candidate is unlinked as a link and its target survives; a link loop is
# just two links; a symlink with a matching name (chromium-tmp matches any
# type) is never a candidate (docs/reference.md, find.type), so neither it
# nor its target directory is touched.
profile_vector: 1
profile: chromium-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /home/tester/precious: {thesis.tex: {size: 4K}}
    /tmp/.org.chromium.Chromium.inner:
      to-home: {symlink: /home/tester/precious}
      to-file: {symlink: /home/tester/precious/thesis.tex}
      loop-a: {symlink: loop-b}
      loop-b: {symlink: loop-a}
    /tmp/.org.chromium.Chromium.itself: {symlink: /home/tester/precious}
expect:
  plan:
    - {candidate: /tmp/.org.chromium.Chromium.inner}
  reclaim_exit: 1
  actions: [/tmp/.org.chromium.Chromium.inner]
  removed: [/tmp/.org.chromium.Chromium.inner]
  skipped: []
  preserved: [/home/tester/precious, /home/tester/precious/thesis.tex, /tmp/.org.chromium.Chromium.itself]
