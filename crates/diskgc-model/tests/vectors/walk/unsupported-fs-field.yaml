# Withdrawn built-in (TASK-122, mark-emulator for Mark, 2026-10-24): zephyr-tmp is replaced by a user probe profile with its matching set.
# A filesystem that does not report a field a check needs (here the inode
# number) cannot be judged: unsupported_fs, never a guess.
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
profile: zephyr-tmp-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1, statx_missing: [uid]}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-x: {data: {size: 4K}}
expect:
  plan:
    - {candidate: /tmp/zephyr-x, reason: unsupported_fs}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/zephyr-x, reason: unsupported_fs}
  preserved: [/tmp/zephyr-x/data]
