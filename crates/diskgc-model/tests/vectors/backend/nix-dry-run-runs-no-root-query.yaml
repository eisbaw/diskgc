# TASK-36, safety.md nix-store: a dry run binds (steps 1-6, read-only
# queries) and stops there: its plan shows /nix/store eligible with
# estimated_bytes null, and it runs no `--query --roots` (Nix's root
# discovery unlinks stale gcroots/auto registrations) and no GC.
profile_vector: 1
profile: nix-garbage
path: /nix/store
min_free: 9G
host:
  host_model: 1
  clock: "2026-10-15T03:00:00Z"
  home: /home/tester
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run:
      .: {uid: 0, gid: 0, mode: "0755"}
      diskgc: {.: {uid: 0, gid: 0, mode: "0755"}, lock: {uid: 0, gid: 0}}
      current-system: {uid: 0, gid: 0, symlink: /nix/store/zzzz-nixos-system}
    /home/tester: {.: {}}
    /nix:
      .: {uid: 0, gid: 0, mode: "0755"}
      store:
        .: {uid: 0, gid: 30000, mode: "1775"}
        aaaa-nix-2.34.8:
          .: {uid: 0, gid: 0, mode: "0555"}
          bin:
            .: {uid: 0, gid: 0, mode: "0555"}
            nix: {uid: 0, gid: 0, mode: "0555", size: 4M, content: "\u007fELF\u0002\u0001\u0001"}
            nix-store: {uid: 0, gid: 0, symlink: nix}
        bbbb-system-1: {.: {uid: 0, gid: 0, mode: "0555"}, init: {uid: 0, gid: 0, mode: "0444", size: 100M}}
        cccc-system-2: {.: {uid: 0, gid: 0, mode: "0555"}, init: {uid: 0, gid: 0, mode: "0444", size: 100M}}
        eeee-user-env: {.: {uid: 0, gid: 0, mode: "0555"}, bin: {uid: 0, gid: 0, mode: "0444", size: 10M}}
        ffff-rooted: {.: {uid: 0, gid: 0, mode: "0555"}, lib: {uid: 0, gid: 0, mode: "0444", size: 50M}}
        dddd-dead: {.: {uid: 0, gid: 0, mode: "0555"}, big: {uid: 0, gid: 0, mode: "0444", size: 2G}}
        zzzz-nixos-system:
          .: {uid: 0, gid: 0, mode: "0555"}
          sw:
            .: {uid: 0, gid: 0, mode: "0555"}
            bin: {.: {uid: 0, gid: 0, mode: "0555"}, nix-store: {uid: 0, gid: 0, symlink: /nix/store/aaaa-nix-2.34.8/bin/nix-store}}
      var:
        .: {uid: 0, gid: 0, mode: "0755"}
        nix:
          .: {uid: 0, gid: 0, mode: "0755"}
          daemon-socket: {.: {uid: 0, gid: 0, mode: "0755"}, socket: {uid: 0, gid: 0, type: socket, mode: "0666"}}
          gcroots: {.: {uid: 0, gid: 0, mode: "0755"}, direct: {uid: 0, gid: 0, symlink: /nix/store/ffff-rooted}}
          profiles:
            .: {uid: 0, gid: 0, mode: "0755"}
            system: {uid: 0, gid: 0, symlink: system-2-link}
            system-1-link: {uid: 0, gid: 0, symlink: /nix/store/bbbb-system-1}
            system-2-link: {uid: 0, gid: 0, symlink: /nix/store/cccc-system-2}
            per-user:
              .: {uid: 0, gid: 0, mode: "0755"}
              tester:
                .: {mode: "0755"}
                profile: {symlink: profile-1-link}
                profile-1-link: {symlink: /nix/store/eeee-user-env}
  nix:
    version_line: "nix-store (Nix) 2.34.8\n"
    config_store: "daemon\n"
    store_info: '{"trusted":false,"url":"unix:///proc/self/fd/3","version":"2.34.8"}'
    probe: serving
    roots: |
      /nix/var/nix/gcroots/direct -> /nix/store/ffff-rooted
      /nix/var/nix/profiles/per-user/tester/profile-1-link -> /nix/store/eeee-user-env
      /nix/var/nix/profiles/system-1-link -> /nix/store/bbbb-system-1
      /nix/var/nix/profiles/system-2-link -> /nix/store/cccc-system-2
    gc: {removes: [/nix/store/dddd-dead]}
expect:
  plan:
    - {candidate: /nix/store}
  dry_run_report: {plan: [{estimated_bytes: null}], status: dry_run}
  reclaim_exit: 0
  actions: [/nix/store]
  removed: [/nix/store/dddd-dead]
  skipped: []
  preserved:
    - /nix/store/aaaa-nix-2.34.8/bin/nix
    - /nix/store/bbbb-system-1/init
    - /nix/store/cccc-system-2/init
    - /nix/store/eeee-user-env/bin
    - /nix/store/ffff-rooted/lib
    - /nix/var/nix/profiles/system-1-link
    - /nix/var/nix/profiles/system-2-link
    - /nix/var/nix/profiles/per-user/tester/profile-1-link
    - /nix/var/nix/gcroots/direct
  dry_run_nix_commands:
    - {argv: [/nix/store/aaaa-nix-2.34.8/bin/nix-store, "--option", plugin-files, "", "--version"], env: [HOME=/home/tester, NIX_USER_CONF_FILES=]}
    - {argv: [/nix/store/aaaa-nix-2.34.8/bin/nix, "--option", plugin-files, "", "--extra-experimental-features", nix-command, config, show, store]}
    - {argv: [/nix/store/aaaa-nix-2.34.8/bin/nix, "--option", plugin-files, "", "--extra-experimental-features", nix-command, store, info, "--json", "--store", "unix:///proc/self/fd/N"], env: [HOME=/home/tester, NIX_USER_CONF_FILES=]}
