# TASK-93: like the Docker kinds, a Podman tier leaves liveness to Podman
# (it keeps every image a container uses) and does not rely on diskgc's
# own in-use check, so it is not refused under hidepid or in a PID
# namespace of its own.
profile_vector: 1
profile: podman-unreferenced
path: /home/tester
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  pid_namespace: nested
  proc_hidepid: true
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /usr/bin/podman: {mode: "0755"}
    /run/diskgc/lock: {uid: 0, gid: 0}
    /home/tester/.local/share/containers/storage: {storage.lock: {}, overlay-layers: {.: {}}}
  podman:
    info: '{"host":{"serviceIsRemote":false,"security":{"rootless":true}},"store":{"graphRoot":"/home/tester/.local/share/containers/storage","runRoot":"/run/user/1000/containers","graphDriverName":"overlay","configFile":"/home/tester/.config/containers/storage.conf","graphOptions":{}},"version":{"Version":"5.8.7"}}'
expect:
  plan:
    - {candidate: /home/tester/.local/share/containers/storage}
  reclaim_exit: 1
  actions: [/home/tester/.local/share/containers/storage]
  removed: []
  skipped: []
  preserved: [/home/tester/.local/share/containers/storage/storage.lock]
  commands:
    - {cwd: /, argv: [/usr/bin/podman, --remote=false, image, prune, --force, --all]}
