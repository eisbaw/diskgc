    - /nix/store/bbbb-system-1/init
    - /nix/store/cccc-system-2/init
    - /nix/store/eeee-user-env/bin
    - /nix/store/ffff-rooted/lib
    - /nix/var/nix/profiles/system-1-link
    - /nix/var/nix/profiles/system-2-link
    - /nix/var/nix/profiles/per-user/tester/profile-1-link
    - /nix/var/nix/gcroots/direct
