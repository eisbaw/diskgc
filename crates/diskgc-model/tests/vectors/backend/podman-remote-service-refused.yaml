# TASK-93: a `podman` whose local query still reports a remote service
# (podman-remote installed as podman) is skipped `remote_backend`: diskgc
# prunes only the local store it measured.
profile_vector: 1
profile: podman-dangling
path: /home/tester
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /usr/bin/podman: {mode: "0755"}
    /run/diskgc/lock: {uid: 0, gid: 0}
    /home/tester/.local/share/containers/storage: {storage.lock: {}, overlay-layers: {.: {}}}
  podman:
    info: '{"host":{"serviceIsRemote":true,"security":{"rootless":true}},"store":{"graphRoot":"/home/tester/.local/share/containers/storage","runRoot":"/run/user/1000/containers","graphDriverName":"overlay","configFile":"/home/tester/.config/containers/storage.conf","graphOptions":{}},"version":{"Version":"5.8.7"}}'
expect:
  plan:
    - {candidate: null, reason: remote_backend}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: null, reason: remote_backend}
  preserved: [/home/tester/.local/share/containers/storage/storage.lock]
  commands: []
