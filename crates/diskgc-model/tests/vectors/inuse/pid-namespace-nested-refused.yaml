# TASK-263: diskgc in a PID namespace other than the initial one (a
# container, PrivatePIDs=) cannot see the processes outside it, which may
# use the candidate: ensure refuses at start, its dry run too (exit 2,
# safety), naming the rule. Before, the scan saw only its own namespace and
# the unused-looking candidate was deleted.
profile_vector: 1
user_profiles:
  - {"name": "scratch-probe", "find": {"roots": ["/tmp"], "paths": ["scratch-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/scratch-a"]}}
profile: scratch-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  pid_namespace: nested
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/scratch-a: {data: {size: 4K}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: safety, contains: "diskgc is not in the initial PID namespace, so the in-use check cannot see every process"}]
  reclaim_exit: 2
  errors: [{cause: safety, contains: "diskgc is not in the initial PID namespace"}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/scratch-a/data]
