# `zephyr-tmp-probe`: user profile with the matching set of a built-in withdrawn in TASK-122.
# A process of the user that cannot be read could be using anything: it
# blocks every candidate as in_use with evidence `unreadable` (fail
# closed). A modelled process without fds reads as Failed on LinuxHost's
# terms, so it is unreadable too (TASK-64 gotcha).
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
profile: zephyr-tmp-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/tool: {}
    /tmp/zephyr-a: {data: {size: 4K}}
  processes:
    - {pid: 301, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], proc: denied}
expect:
  plan:
    - {candidate: /tmp/zephyr-a, reason: in_use}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/zephyr-a, reason: in_use, process_blockers: [{pid: 301, evidence: unreadable}]}
  preserved: [/tmp/zephyr-a/data]
