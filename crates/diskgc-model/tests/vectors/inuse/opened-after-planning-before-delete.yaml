# The index never decides safety: a process opens a file inside the
# candidate after the dry run planned it eligible (here: just before
# reclaim takes the candidate lock), and the deletion-time scan refuses it.
profile_vector: 1
profile: zephyr-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/tool: {}
    /tmp/zephyr-late: {data: {size: 4K}}
  processes:
    - {pid: 601, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: /usr/bin/tool}]}
  events:
    - at: {op: flock, path: /tmp/zephyr-late, nth: 1, when: before}
      open: {pid: 601, path: /tmp/zephyr-late/data}
expect:
  plan:
    - {candidate: /tmp/zephyr-late}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/zephyr-late, reason: in_use, process_blockers: [{pid: 601, evidence: fd}]}
  preserved: [/tmp/zephyr-late/data]
