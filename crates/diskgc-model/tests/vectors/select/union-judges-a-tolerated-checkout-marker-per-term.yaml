# TASK-360: a union walks its candidate with checkouts allowed, then each
# admitted term that refuses checkouts judges the markers the walk
# recorded with its own `empty_checkout_markers`. `uv-cache` tolerates the
# empty `sdists-v10/.git` every uv cache holds; `uv-copy`, a user profile
# with the same matcher and command but no such list (user profiles cannot
# say it), does not: refuse wins among the admitted terms, so the cache is
# `contains_checkout` and no cleaner runs. The same cache selected by
# `uv-cache` in both terms of a union is reclaimed
# (union-of-one-source-tolerates-its-checkout-marker.yaml).
profile_vector: 1
user_profiles:
  - name: uv-copy
    find: {roots: required, paths: [.cache/uv], type: dir}
    action: {command: [uv, cache, clean, --cache-dir, "{path}"], cwd: parent}
    examples: {match: [/home/a/.cache/uv]}
select: profile:uv-cache || profile:uv-copy
roots: [/home/a]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/uv: {mode: "0755"}
    "/home/a/.cache/uv": {"archive-v0": {"payload": {"size": "8K"}}, "sdists-v10": {".git": {}}}
expect:
  plan:
    - {candidate: "/home/a/.cache/uv", reason: contains_checkout}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: "/home/a/.cache/uv", reason: contains_checkout}
  preserved: ["/home/a/.cache/uv/archive-v0/payload", "/home/a/.cache/uv/sdists-v10/.git"]
  commands: []
