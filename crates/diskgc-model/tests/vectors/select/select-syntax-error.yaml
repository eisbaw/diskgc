# Withdrawn built-in (TASK-122, mark-emulator for Mark, 2026-10-24): renode-tmp, zephyr-tmp is replaced by a user probe profile with its matching set.
# A malformed --select is a parse error (exit 2, cause parse) before the
# machine is touched; a mixed && / || without grouping is one.
profile_vector: 1
user_profiles:
  - {"name": "renode-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["renode-*", "nix-shell.*/renode-*", "tmp.*/renode-*", "nix-shell-*-*/renode-*", "nix-develop-*-*/renode-*", "zephyr-*-run.*/renode-*", "claude-{uid}/renode-*", "nix-shell.*/nix-shell.*/renode-*", "nix-shell.*/tmp.*/renode-*", "tmp.*/nix-shell.*/renode-*", "claude-{uid}/nix-shell.*/renode-*", "claude-{uid}/tmp.*/renode-*", "claude-{uid}/nix-shell.*/nix-shell.*/renode-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/renode-1045514-crash"]}}
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
select: profile:zephyr-tmp-probe || profile:renode-tmp-probe && filter:idle-3d
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-a: {f: {size: 4K}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: parse}]
  reclaim_exit: 2
  errors: [{cause: parse}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/zephyr-a/f]
