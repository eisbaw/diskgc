# `zephyr-tmp-probe`: user profile with the matching set of a built-in withdrawn in TASK-122.
# A last use in the future says nothing about age: the candidate passes
# neither `filter:idle-3d` nor its complement (docs/reference.md,
# Predicates) and is skipped as future_time.
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
select: profile:zephyr-tmp-probe && filter:idle-3d
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-future:
      .: {mtime: 2026-09-01T00:00:00Z}
      f: {mtime: 2027-01-01T00:00:00Z}
expect:
  plan:
    - {candidate: /tmp/zephyr-future, reason: future_time}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/zephyr-future, reason: future_time}
  preserved: [/tmp/zephyr-future/f]
