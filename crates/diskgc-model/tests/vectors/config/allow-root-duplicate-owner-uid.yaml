# Withdrawn built-in (TASK-122, mark-emulator for Mark, 2026-10-24): zephyr-tmp is replaced by a user probe profile with its matching set.
# Two owners: entries that resolve to the same uid hide a policy error:
# exit 2.
profile_vector: 1
allow_root: true
users: {tester: 2001}
config: |
  version: 1
  profiles:
    - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
  owners: [tester, {uid: 2001}]
  groups:
    - name: g
      tiers:
        - {name: t, select: profile:zephyr-tmp-probe}
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  own_uid: 0
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-a: {f: {size: 4K}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: config, contains: duplicate}]
  reclaim_exit: 2
  errors: [{cause: config, contains: duplicate}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/zephyr-a/f]
