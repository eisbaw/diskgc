# `zephyr-tmp-probe`: user profile with the matching set of a built-in withdrawn in TASK-122.
# TASK-44 review (mped S2, Codex B2): root under --allow-root whose own
# capability set cannot be read (its /proc status read fails, EIO) stops at
# start as a failure of the host (exit 3, cause host) in both modes, and
# deletes nothing; a set that was read and lacks CAP_SYS_PTRACE is exit 2
# (allow-root-refused-without-cap-sys-ptrace.yaml).
profile_vector: 1
allow_root: true
config: |
  version: 1
  profiles:
    - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
  owners: [tester]
  groups:
    - name: g
      tiers:
        - {name: t, select: profile:zephyr-tmp-probe}
path: /tmp
min_free: 100%
host:
  host_model: 1
  users: {tester: 1000}
  clock: 2026-10-15T03:00:00Z
  own_uid: 0
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-tester: {f: {size: 4K}}
  events:
    - {at: {op: proc_status, nth: 1, when: before}, fail: EIO}
expect:
  plan: []
  dry_run_exit: 3
  dry_run_errors: [{cause: host, contains: "could not read its own capability set"}]
  reclaim_exit: 3
  errors: [{cause: host, contains: "could not read its own capability set"}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/zephyr-tester/f]
