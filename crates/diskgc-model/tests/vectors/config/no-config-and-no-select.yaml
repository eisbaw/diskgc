# ensure without --select needs a configuration: exit 2, nothing touched;
# the refusal names the paths the search tried.
profile_vector: 1
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-a: {f: {size: 4K}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: config, contains: "no configuration file found (tried /etc/diskgc/config.yaml); ensure without --select needs one"}]
  reclaim_exit: 2
  errors: [{cause: config, contains: "no configuration file found (tried /etc/diskgc/config.yaml); ensure without --select needs one"}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/zephyr-a/f]
