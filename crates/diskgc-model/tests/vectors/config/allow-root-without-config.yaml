# --allow-root requires a configuration with an owners: list; without a
# configuration file it is exit 2.
profile_vector: 1
profile: zephyr-tmp
allow_root: true
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  own_uid: 0
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-a: {f: {size: 4K}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: config, contains: owners}]
  reclaim_exit: 2
  errors: [{cause: config, contains: owners}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/zephyr-a/f]
