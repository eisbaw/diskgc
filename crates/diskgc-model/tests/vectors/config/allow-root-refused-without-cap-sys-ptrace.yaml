# `zephyr-tmp-probe`: user profile with the matching set of a built-in withdrawn in TASK-122.
# TASK-44 AC #4: root under --allow-root whose effective set lacks
# CAP_SYS_PTRACE (bit 19) is refused at start (exit 2, safety) in both
# modes: every other capability is there, a valid owners: policy too.
# allow-root-starts-with-cap-sys-ptrace-alone.yaml is the other side.
profile_vector: 1
allow_root: true
config: |
  version: 1
  profiles:
    - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
  owners: [tester]
  groups:
    - name: g
      tiers:
        - {name: t, select: profile:zephyr-tmp-probe}
path: /tmp
min_free: 100%
host:
  host_model: 1
  users: {tester: 1000}
  clock: 2026-10-15T03:00:00Z
  own_uid: 0
  own_cap_effective: 0x1fffff7ffff
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-tester: {f: {size: 4K}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: safety, contains: "--allow-root needs CAP_SYS_PTRACE"}]
  reclaim_exit: 2
  errors: [{cause: safety, contains: "--allow-root needs CAP_SYS_PTRACE"}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/zephyr-tester/f]
