# profile_policies can turn the checkout guard back on for a built-in
# that allows checkouts (cargo-target): a target holding a .git is then
# contains_checkout.
profile_vector: 1
config: |
  version: 1
  profile_policies:
    - {profile: cargo-target, checkouts: refuse}
  groups:
    - name: g
      tiers:
        - {name: cargo, select: profile:cargo-target, roots: [/home/tester/src]}
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /home/tester/src/app/Cargo.toml: {}
    /home/tester/src/app/target:
      CACHEDIR.TAG: {cachedir_tag: true}
      debug:
        .cargo-lock: {}
        build: {dep-1: {out: {vendored: {.git: {HEAD: {}}}}}}
expect:
  plan:
    - {candidate: /home/tester/src/app/target, reason: contains_checkout}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /home/tester/src/app/target, reason: contains_checkout}
  preserved: [/home/tester/src/app/target/debug/build/dep-1/out/vendored/.git/HEAD]
