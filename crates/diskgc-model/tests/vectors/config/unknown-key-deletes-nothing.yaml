# An invalid config exits 2 and deletes nothing (PRD, What good looks
# like): unknown keys are errors, never ignored.
profile_vector: 1
config: |
  version: 1
  grups: []
  groups:
    - name: g
      tiers:
        - {name: t, select: profile:zephyr-tmp}
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-a: {f: {size: 4K}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: config, contains: grups}]
  reclaim_exit: 2
  errors: [{cause: config, contains: grups}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/zephyr-a/f]
