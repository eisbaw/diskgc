# TASK-152: a protect root that does not exist is refused even under
# --select (which replaces the tiers, not protect): a typo there would
# leave the tree it meant to protect unprotected. Exit 2, cause config,
# naming the protect entry's line; nothing deleted.
profile_vector: 1
config: |
  version: 1
  protect:
    - {profile: cargo-target, roots: [/home/tester/src/importnat]}
profile: cargo-target
roots: [/home/tester/src]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /home/tester/src/important/Cargo.toml: {}
    /home/tester/src/important/target:
      CACHEDIR.TAG: {cachedir_tag: true}
      debug: {.cargo-lock: {}, deps: {app: {size: 1M}}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: config, contains: "root /home/tester/src/importnat (config "}]
  reclaim_exit: 2
  errors: [{cause: config, contains: "line 3, protect `cargo-target`)"}]
  actions: []
  removed: []
  skipped: []
  preserved: [/home/tester/src/important/target/debug/deps/app]
