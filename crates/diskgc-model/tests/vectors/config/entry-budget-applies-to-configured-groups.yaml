# Withdrawn built-in (TASK-122, mark-emulator for Mark, 2026-10-24): renode-tmp, zephyr-tmp is replaced by a user probe profile with its matching set.
# The walk's entry budget is run-wide: with configured groups (no
# --select) every tier walks under it, the later group's too. Test-only
# `entry_budget` seam, as walk/too-many-entries.yaml.
profile_vector: 1
entry_budget: 5
config: |
  version: 1
  profiles:
    - {"name": "renode-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["renode-*", "nix-shell.*/renode-*", "tmp.*/renode-*", "nix-shell-*-*/renode-*", "nix-develop-*-*/renode-*", "zephyr-*-run.*/renode-*", "claude-{uid}/renode-*", "nix-shell.*/nix-shell.*/renode-*", "nix-shell.*/tmp.*/renode-*", "tmp.*/nix-shell.*/renode-*", "claude-{uid}/nix-shell.*/renode-*", "claude-{uid}/tmp.*/renode-*", "claude-{uid}/nix-shell.*/nix-shell.*/renode-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/renode-1045514-crash"]}}
    - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
  groups:
    - name: stale
      tiers:
        - {name: renode, select: profile:renode-tmp-probe}
    - name: pressure
      tiers:
        - {name: zephyr, select: profile:zephyr-tmp-probe}
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/renode-big: {a: {}, b: {}, c: {}, d: {}, e: {}}
    /tmp/zephyr-big: {a: {}, b: {}, c: {}, d: {}, e: {}}
    /tmp/zephyr-small: {a: {}}
expect:
  plan:
    - {candidate: /tmp/renode-big, reason: too_many_entries}
    - {candidate: /tmp/zephyr-big, reason: too_many_entries}
    - {candidate: /tmp/zephyr-small}
  reclaim_exit: 1
  actions: [/tmp/zephyr-small]
  removed: [/tmp/zephyr-small]
  skipped:
    - {candidate: /tmp/renode-big, reason: too_many_entries}
    - {candidate: /tmp/zephyr-big, reason: too_many_entries}
  preserved: [/tmp/renode-big/e, /tmp/zephyr-big/e]
