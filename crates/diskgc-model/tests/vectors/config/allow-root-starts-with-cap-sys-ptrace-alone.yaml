# `zephyr-tmp-probe`: user profile with the matching set of a built-in withdrawn in TASK-122.
# TASK-44 AC #4, the other side of allow-root-refused-without-cap-sys-ptrace:
# an effective set of CAP_SYS_PTRACE alone (0x80000) passes the start check,
# and the run plans and reclaims as root with an owners: policy.
profile_vector: 1
allow_root: true
config: |
  version: 1
  profiles:
    - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
  owners: [tester]
  groups:
    - name: g
      tiers:
        - {name: t, select: profile:zephyr-tmp-probe}
path: /tmp
min_free: 100%
host:
  host_model: 1
  users: {tester: 1000}
  clock: 2026-10-15T03:00:00Z
  own_uid: 0
  own_cap_effective: 0x80000
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-tester: {f: {size: 4K}}
expect:
  plan:
    - {candidate: /tmp/zephyr-tester}
  reclaim_exit: 1
  actions: [/tmp/zephyr-tester]
  removed: [/tmp/zephyr-tester]
  skipped: []
  preserved: []
