# Withdrawn built-in (TASK-122, mark-emulator for Mark, 2026-10-24): zephyr-tmp is replaced by a user probe profile with its matching set.
# Command actions never run as root: selecting one under --allow-root is
# refused before planning (exit 2, safety).
profile_vector: 1
allow_root: true
users: {tester: 1000}
config: |
  version: 1
  profiles:
    - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
  owners: [tester]
  groups:
    - name: g
      tiers:
        - {name: t, select: profile:zephyr-tmp-probe}
select: profile:pip-cache
roots: [/home/tester]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  own_uid: 0
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/pip: {mode: "0755"}
    /home/tester/.cache/pip: {http: {size: 4K}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: safety, contains: command}]
  reclaim_exit: 2
  errors: [{cause: safety, contains: command}]
  actions: []
  removed: []
  skipped: []
  preserved: [/home/tester/.cache/pip/http]
  commands: []
