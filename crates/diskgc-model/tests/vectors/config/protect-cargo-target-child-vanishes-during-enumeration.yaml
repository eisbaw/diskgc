# TASK-268 review (Codex 1, one event): while `protect` enumerates its
# Cargo targets, `debug/zold` is unlinked between the listing of `debug/`
# and its statx. The inspection of /proj/target then failed `changed`, and
# discovery dropped the WHOLE target as if it had vanished: the cached
# match set was empty, and the candidate inside the protected target,
# /proj/target/debug/deps/cruft (old, so no time of it makes the checks
# enumerate again), was deleted. A target whose tag is still there is
# inspected again (a bounded number of times): here the second inspection
# succeeds, the match stands, and the candidate is `protected`.
profile_vector: 1
config: |
  version: 1
  profiles:
    - name: deps-cruft
      find: {roots: [/proj/target/debug/deps], paths: [cruft], type: dir}
      action: delete
      examples: {match: [/proj/target/debug/deps/cruft]}
  protect:
    - {profile: cargo-target, roots: [/proj]}
  groups:
    - name: g
      tiers:
        - {name: t, select: profile:deps-cruft}
path: /proj
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /proj, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /proj/Cargo.toml: {}
    /proj/target/CACHEDIR.TAG: {cachedir_tag: true}
    /proj/target/debug/.cargo-lock: {mtime: 2026-10-01T00:00:00Z}
    /proj/target/debug/zold: {size: 1K, mtime: 2026-10-01T00:00:00Z}
    /proj/target/debug/deps/cruft: {.: {mtime: 2026-10-01T00:00:00Z}, blob: {size: 4K, mtime: 2026-10-01T00:00:00Z}}
  events:
    - {at: {op: statx, path: /proj/target/debug/zold, nth: 1, when: before}, remove: /proj/target/debug/zold}
expect:
  plan: [{candidate: /proj/target/debug/deps/cruft, reason: protected}]
  reclaim_exit: 1
  actions: []
  removed: []
  skipped: [{candidate: /proj/target/debug/deps/cruft, reason: protected}]
  preserved: [/proj/target/debug/deps/cruft/blob]
