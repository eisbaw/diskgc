# Withdrawn built-in (TASK-122, mark-emulator for Mark, 2026-10-24): zephyr-tmp is replaced by a user probe profile with its matching set.
# Every tier's run-time environment check (a command's program resolved
# on the command path) finishes before the first deletion (PRD, What bad
# looks like: a tier's run-time checks run only after other tiers
# deleted). The program disappears right after the first unlink: a
# preflight made in time saw it, so the pressure tier's command still
# runs; one made after the deletion would exclude the tier.
profile_vector: 1
config: |
  version: 1
  profiles:
    - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
  groups:
    - name: stale
      tiers:
        - {name: zephyr, select: profile:zephyr-tmp-probe}
    - name: pressure
      tiers:
        - {name: pip, select: profile:pip-cache, roots: [/home/tester]}
path: /
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/pip: {mode: "0755"}
    /tmp/zephyr-a: {f: {size: 4K}}
    /home/tester/.cache/pip: {http: {size: 4K}}
  events:
    - at: {op: unlinkat, path: /tmp/zephyr-a/f, nth: 1, when: after}
      remove: /usr/bin/pip
expect:
  plan:
    - {candidate: /tmp/zephyr-a}
    - {candidate: /home/tester/.cache/pip}
  reclaim_exit: 1
  actions: [/tmp/zephyr-a, /home/tester/.cache/pip]
  removed: [/tmp/zephyr-a]
  skipped: []
  preserved: [/home/tester/.cache/pip/http]
  commands:
    - {cwd: /home/tester/.cache/pip, argv: [/usr/bin/pip, --cache-dir, /home/tester/.cache/pip, cache, purge]}
