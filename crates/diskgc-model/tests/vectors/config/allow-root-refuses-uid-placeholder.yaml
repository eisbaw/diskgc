# `claude-code-tmp-probe`, `zephyr-tmp-probe`: user profiles, each with the matching set of a built-in withdrawn in TASK-122.
# Under --allow-root `{uid}` would expand to root's 0, not an owner:
# claude-code-tmp-probe (roots /tmp/claude-{uid}) is refused before planning.
profile_vector: 1
allow_root: true
config: |
  version: 1
  profiles:
    - {"name": "claude-code-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["claude-{uid}/-*/*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/claude-1000/-home-mark-src-app/7cc7f78e-2a90-4962-9538-3cc833eda22a"]}}
    - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
  owners: [tester]
  groups:
    - name: g
      tiers:
        - {name: t, select: profile:zephyr-tmp-probe}
select: profile:claude-code-tmp-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  users: {tester: 1000}
  clock: 2026-10-15T03:00:00Z
  own_uid: 0
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/claude-0/-proj/1: {f: {uid: 0}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: safety, contains: "{uid}"}]
  reclaim_exit: 2
  errors: [{cause: safety, contains: "{uid}"}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/claude-0/-proj/1/f]
