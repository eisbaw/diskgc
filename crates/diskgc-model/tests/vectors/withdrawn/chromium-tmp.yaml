# `chromium-tmp-probe`: user profile with the matching set of a built-in withdrawn in TASK-122.
# chromium-tmp-probe below its fixed root, one candidate per role.
profile_vector: 1
user_profiles:
  - {"name": "chromium-tmp-probe", "find": {"roots": ["/tmp"], "paths": [".org.chromium.Chromium.*", "org.chromium.Chromium.*"], "type": "any"}, "action": "delete", "examples": {"match": ["/tmp/.org.chromium.Chromium.aB3dEf"]}}
  - {"name": "pin", "find": {"roots": ["/tmp"], "paths": ["org.chromium.Chromium.cc"], "type": "any"}, "action": "delete", "examples": {"match": ["/tmp/org.chromium.Chromium.cc"]}}
select: "profile:chromium-tmp-probe && !profile:pin"
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/pip: {mode: "0755"}
    /usr/bin/uv: {mode: "0755"}
    /usr/bin/env: {mode: "0755"}
    /usr/bin/go: {mode: "0755"}
    /usr/bin/npm: {mode: "0755"}
    /usr/bin/pnpm: {mode: "0755"}
    /usr/bin/yarn: {mode: "0755"}
    /usr/bin/ccache: {mode: "0755"}
    /usr/bin/jest: {mode: "0755"}
    /usr/bin/pio: {mode: "0755"}
    /usr/bin/tool: {mode: "0755"}
    "/tmp/.org.chromium.Chromium.aa": {"payload": {"size": "8K"}}
    "/tmp/.org.chromium.Chromium.bb": {"payload": {"size": "8K"}}
    "/tmp/org.chromium.Chromium.cc": {"payload": {"size": "8K"}}
    "/tmp/org.chromium.Chromium.dd": {"payload": {"size": "8K"}, ".diskgc-keep": {}}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: "/tmp/.org.chromium.Chromium.bb/payload"}]}
expect:
  plan:
    - {candidate: "/tmp/.org.chromium.Chromium.aa"}
    - {candidate: "/tmp/.org.chromium.Chromium.bb", reason: in_use}
    - {candidate: "/tmp/org.chromium.Chromium.cc", reason: excluded}
    - {candidate: "/tmp/org.chromium.Chromium.dd", reason: kept}
  reclaim_exit: 1
  actions: ["/tmp/.org.chromium.Chromium.aa"]
  removed: ["/tmp/.org.chromium.Chromium.aa"]
  skipped:
    - {candidate: "/tmp/.org.chromium.Chromium.bb", reason: in_use, process_blockers: [{pid: 901, evidence: fd}]}
    - {candidate: "/tmp/org.chromium.Chromium.cc", reason: excluded}
    - {candidate: "/tmp/org.chromium.Chromium.dd", reason: kept}
  preserved: ["/tmp/.org.chromium.Chromium.bb/payload", "/tmp/org.chromium.Chromium.cc/payload", "/tmp/org.chromium.Chromium.dd/payload"]
