# `claude-code-tmp-probe`: user profile with the matching set of a built-in withdrawn in TASK-122.
# claude-code-tmp-probe below its fixed root, one candidate per role.
profile_vector: 1
config: |
  version: 1
  profiles:
    - {"name": "claude-code-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["claude-{uid}/-*/*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/claude-1000/-home-mark-src-app/7cc7f78e-2a90-4962-9538-3cc833eda22a"]}}
    - {"name": "pin", "find": {"roots": ["/tmp"], "paths": ["claude-1000/-home-b/s3"], "type": "any"}, "action": "delete", "examples": {"match": ["/tmp/claude-1000/-home-b/s3"]}}
  protect: [pin]
  groups:
    - name: g
      tiers:
        - {"name": "t", "select": "profile:claude-code-tmp-probe"}
select: "profile:claude-code-tmp-probe"
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/pip: {mode: "0755"}
    /usr/bin/uv: {mode: "0755"}
    /usr/bin/env: {mode: "0755"}
    /usr/bin/go: {mode: "0755"}
    /usr/bin/npm: {mode: "0755"}
    /usr/bin/pnpm: {mode: "0755"}
    /usr/bin/yarn: {mode: "0755"}
    /usr/bin/ccache: {mode: "0755"}
    /usr/bin/jest: {mode: "0755"}
    /usr/bin/pio: {mode: "0755"}
    /usr/bin/tool: {mode: "0755"}
    "/tmp/claude-1000/-home-a/s1": {"payload": {"size": "8K"}}
    "/tmp/claude-1000/-home-a/s2": {"payload": {"size": "8K"}}
    "/tmp/claude-1000/-home-b/s3": {"payload": {"size": "8K"}}
    "/tmp/claude-1000/-home-b/s4": {"payload": {"size": "8K"}, ".diskgc-keep": {}}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: "/tmp/claude-1000/-home-a/s2/payload"}]}
expect:
  plan:
    - {candidate: "/tmp/claude-1000/-home-a/s1"}
    - {candidate: "/tmp/claude-1000/-home-a/s2", reason: in_use}
    - {candidate: "/tmp/claude-1000/-home-b/s3", reason: protected}
    - {candidate: "/tmp/claude-1000/-home-b/s4", reason: keep_marker}
  reclaim_exit: 1
  actions: ["/tmp/claude-1000/-home-a/s1"]
  removed: ["/tmp/claude-1000/-home-a/s1"]
  skipped:
    - {candidate: "/tmp/claude-1000/-home-a/s2", reason: in_use, process_blockers: [{pid: 901, evidence: fd}]}
    - {candidate: "/tmp/claude-1000/-home-b/s3", reason: protected}
    - {candidate: "/tmp/claude-1000/-home-b/s4", reason: keep_marker}
  preserved: ["/tmp/claude-1000/-home-a/s2/payload", "/tmp/claude-1000/-home-b/s3/payload", "/tmp/claude-1000/-home-b/s4/payload"]
