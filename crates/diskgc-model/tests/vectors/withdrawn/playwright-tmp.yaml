# Withdrawn built-in (TASK-122, mark-emulator for Mark, 2026-10-24): playwright-tmp is replaced by a user probe profile with its matching set.
# playwright-tmp-probe below its fixed root, one candidate per role.
profile_vector: 1
user_profiles:
  - {"name": "playwright-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["playwright*", "nix-shell.*/playwright*", "tmp.*/playwright*", "nix-shell-*-*/playwright*", "nix-develop-*-*/playwright*", "zephyr-*-run.*/playwright*", "claude-{uid}/playwright*", "nix-shell.*/nix-shell.*/playwright*", "nix-shell.*/tmp.*/playwright*", "tmp.*/nix-shell.*/playwright*", "claude-{uid}/nix-shell.*/playwright*", "claude-{uid}/tmp.*/playwright*", "claude-{uid}/nix-shell.*/nix-shell.*/playwright*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/playwright-artifacts-0a3aQN"]}}
  - {"name": "pin", "find": {"roots": ["/tmp"], "paths": ["nix-shell.X/playwright-3"], "type": "any"}, "action": "delete", "examples": {"match": ["/tmp/nix-shell.X/playwright-3"]}}
select: "profile:playwright-tmp-probe && !profile:pin"
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/pip: {mode: "0755"}
    /usr/bin/uv: {mode: "0755"}
    /usr/bin/env: {mode: "0755"}
    /usr/bin/go: {mode: "0755"}
    /usr/bin/npm: {mode: "0755"}
    /usr/bin/pnpm: {mode: "0755"}
    /usr/bin/yarn: {mode: "0755"}
    /usr/bin/ccache: {mode: "0755"}
    /usr/bin/jest: {mode: "0755"}
    /usr/bin/pio: {mode: "0755"}
    /usr/bin/tool: {mode: "0755"}
    "/tmp/playwright-artifacts-1": {"payload": {"size": "8K"}}
    "/tmp/playwright_chromiumdev_profile-2": {"payload": {"size": "8K"}}
    "/tmp/nix-shell.X/playwright-3": {"payload": {"size": "8K"}}
    "/tmp/playwright-4": {"payload": {"size": "8K"}, ".git": {"HEAD": {}}}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: "/tmp/playwright_chromiumdev_profile-2/payload"}]}
expect:
  plan:
    - {candidate: "/tmp/playwright-artifacts-1"}
    - {candidate: "/tmp/playwright_chromiumdev_profile-2", reason: in_use}
    - {candidate: "/tmp/nix-shell.X/playwright-3", reason: excluded}
    - {candidate: "/tmp/playwright-4", reason: contains_checkout}
  reclaim_exit: 1
  actions: ["/tmp/playwright-artifacts-1"]
  removed: ["/tmp/playwright-artifacts-1"]
  skipped:
    - {candidate: "/tmp/playwright_chromiumdev_profile-2", reason: in_use, process_blockers: [{pid: 901, evidence: fd}]}
    - {candidate: "/tmp/nix-shell.X/playwright-3", reason: excluded}
    - {candidate: "/tmp/playwright-4", reason: contains_checkout}
  preserved: ["/tmp/playwright_chromiumdev_profile-2/payload", "/tmp/nix-shell.X/playwright-3/payload", "/tmp/playwright-4/payload"]
