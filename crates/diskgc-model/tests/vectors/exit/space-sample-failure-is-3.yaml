# Withdrawn built-in (TASK-122, mark-emulator for Mark, 2026-10-24): zephyr-tmp is replaced by a user probe profile with its matching set.
# The first space sample fails (EIO): an error of the run, exit 3, with
# nothing deleted; never a guess that the goal is met.
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
profile: zephyr-tmp-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-a: {f: {size: 4K}}
  events:
    - at: {op: statvfs, nth: 1, when: before}
      fail: EIO
expect:
  plan: []
  dry_run_exit: 3
  dry_run_errors: [{cause: host}]
  reclaim_exit: 3
  errors: [{cause: host}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/zephyr-a/f]
