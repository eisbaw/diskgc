# `renode-tmp-probe`, `zephyr-tmp-probe`: user profiles, each with the matching set of a built-in withdrawn in TASK-122.
# Groups run in list order: the stale group's candidate is enough, so the
# pressure tier never runs and its candidate survives (PRD, What bad looks
# like: a pressure tier running while an earlier tier had candidates).
profile_vector: 1
config: |
  version: 1
  profiles:
    - {"name": "renode-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["renode-*", "nix-shell.*/renode-*", "tmp.*/renode-*", "nix-shell-*-*/renode-*", "nix-develop-*-*/renode-*", "zephyr-*-run.*/renode-*", "claude-{uid}/renode-*", "nix-shell.*/nix-shell.*/renode-*", "nix-shell.*/tmp.*/renode-*", "tmp.*/nix-shell.*/renode-*", "claude-{uid}/nix-shell.*/renode-*", "claude-{uid}/tmp.*/renode-*", "claude-{uid}/nix-shell.*/nix-shell.*/renode-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/renode-1045514-crash"]}}
    - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
  groups:
    - name: stale
      tiers:
        - {name: renode, select: profile:renode-tmp-probe}
    - name: pressure
      tiers:
        - {name: zephyr, select: profile:zephyr-tmp-probe}
path: /tmp
min_free: 2G
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 8G, other_used: 2G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-older:
      .: {mtime: 2026-01-01T00:00:00Z}
      blob: {size: 3G, mtime: 2026-01-01T00:00:00Z}
    /tmp/renode-1:
      .: {mtime: 2026-10-14T00:00:00Z}
      blob: {size: 3G, mtime: 2026-10-14T00:00:00Z}
expect:
  plan:
    - {candidate: /tmp/renode-1}
    - {candidate: /tmp/zephyr-older}
  reclaim_exit: 0
  actions: [/tmp/renode-1]
  removed: [/tmp/renode-1]
  skipped: []
  preserved: [/tmp/zephyr-older/blob]
