# `zephyr-tmp-probe`: user profile with the matching set of a built-in withdrawn in TASK-122.
# Reclaim takes a lock (docs/safety.md, Host lock). Without the host lock
# file (/run/diskgc/lock, provisioned by the tmpfiles drop-in) a non-root
# run falls back to its per-user lock (TASK-277), but this host has no
# place for one either: no /run/user/1000 and no home. That is the
# environment's, not an unsafe object: the reclaim runs without a lock
# (with one warning) and deletes as it would under one. The goal (100 %)
# cannot be met: exit 1. The dry run takes no lock and plans the same.
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
profile: zephyr-tmp-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc: {.: {uid: 0, gid: 0}}
    /tmp/zephyr-a: {f: {size: 4K}}
expect:
  plan:
    - {candidate: /tmp/zephyr-a}
  reclaim_exit: 1
  actions: [/tmp/zephyr-a]
  removed: [/tmp/zephyr-a]
  skipped: []
  preserved: []
