# The deadline passes during reclaim (a clock jump while deleting the
# first candidate, as a suspend would): no new candidate is started and
# the exit is 124 below --min-free.
profile_vector: 1
profile: zephyr-tmp
path: /tmp
min_free: 100%
timeout: 1m
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-a: {f: {size: 4K}}
    /tmp/zephyr-b: {f: {size: 4K}}
  events:
    - at: {op: unlinkat, path: /tmp/zephyr-a/f, nth: 1, when: after}
      advance: 2m
expect:
  plan:
    - {candidate: /tmp/zephyr-a}
    - {candidate: /tmp/zephyr-b}
  reclaim_exit: 124
  report: {status: deadline}
  actions: [/tmp/zephyr-a]
  removed: [/tmp/zephyr-a/f]
  skipped: []
  preserved: [/tmp/zephyr-b/f]
