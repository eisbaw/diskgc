# zephyr-tmp was withdrawn from the built-ins by TASK-122 (no admissible
# liveness class): it is in neither catalog, so under the proposed 0.1
# catalog `--select profile:zephyr-tmp` is refused (exit 2) and the
# directory it used to match is untouched.
profile_vector: 1
catalog: proposed-release-01
profile: zephyr-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-a: {f: {size: 4K}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: parse, contains: zephyr-tmp}]
  reclaim_exit: 2
  errors: [{cause: parse, contains: zephyr-tmp}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/zephyr-a/f]
