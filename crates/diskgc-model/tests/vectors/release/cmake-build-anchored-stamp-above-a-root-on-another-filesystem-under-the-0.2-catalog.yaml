    - {candidate: /home/tester/src, reason: other_fs}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /home/tester/src, reason: other_fs}
  preserved: [/home/tester/src/pkg/out/old.o]
