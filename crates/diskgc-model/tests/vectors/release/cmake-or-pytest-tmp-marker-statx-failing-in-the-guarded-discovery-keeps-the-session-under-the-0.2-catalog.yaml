# Under the 0.2 release catalog (TASK-370). TASK-367, the sixth review's B1 (statx): in `cmake-build-anchored ||
# pytest-tmp`, with `.built` in pytest-of-tester from the start, cmake's
# discovery cannot `statx` the session's CMakeCache.txt once (EACCES, its
# `where`): cmake refuses pytest-0 (`unreadable`) and never joins the
# union's view of it, so before the fix nothing asked the guard and
# pytest-tmp deleted the session, a CMake build in OpenWrt's tree. The
# guard is the selection's: pytest-tmp's own discovery asks it of the
# session, which holds a build marker, and keeps it. pytest-1, no build,
# is pytest-tmp's to take (positive control).
profile_vector: 1
catalog: release-0.2
select: profile:cmake-build-anchored || profile:pytest-tmp
roots: [/tmp]
path: /tmp
min_free: 100%
no_index: true
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell.AB: {.: {mtime: 2026-10-01T00:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester: {.: {mtime: 2026-10-01T00:00:00Z}, .built: {mtime: 2026-10-01T00:00:00Z}, CMakeLists.txt: {mtime: 2026-10-01T00:00:00Z, content: "project(p)\n"}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-01T00:00:00Z}, CMakeCache.txt: {mtime: 2026-10-01T00:00:00Z, content: "CMAKE_HOME_DIRECTORY:INTERNAL=/tmp/nix-shell.AB/pytest-of-tester\n"}, CMakeFiles: {.: {mtime: 2026-10-01T00:00:00Z}}, a.o: {mtime: 2026-10-01T00:00:00Z, size: 8K}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-1: {.: {mtime: 2026-10-01T00:00:00Z}, test_a0: {.: {mtime: 2026-10-01T00:00:00Z}, f: {mtime: 2026-10-01T00:00:00Z}}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
  events:
    - {at: {op: statx, path: /tmp/nix-shell.AB/pytest-of-tester/pytest-0/CMakeCache.txt, nth: 1, when: before}, fail: EACCES}
expect:
  plan:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0/CMakeCache.txt, reason: unreadable}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-1}
  reclaim_exit: 1
  actions: [/tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  removed: [/tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  skipped:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0/CMakeCache.txt, reason: unreadable}
  preserved: [/tmp/nix-shell.AB/pytest-of-tester/pytest-0/a.o]
