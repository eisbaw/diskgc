# A configuration whose later group selects a development-only built-in
# (pytest-cache) loads under the development catalog but not under the
# proposed 0.1 catalog: exit 2 at load, so the first group's eligible
# Cargo target is untouched (no tier runs before the whole configuration
# is held to the catalog).
profile_vector: 1
catalog: proposed-release-01
config: |
  version: 1
  groups:
    - name: stale
      tiers:
        - {name: targets, select: "profile:cargo-target", roots: [/home/tester/src]}
    - name: pressure
      tiers:
        - {name: pytest, select: "profile:pytest-cache", roots: [/home/tester]}
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /home/tester/src/idle/Cargo.toml: {}
    /home/tester/src/idle/target:
      CACHEDIR.TAG: {cachedir_tag: true}
      debug: {.cargo-lock: {}, deps: {lib-1: {size: 1M}}}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: config, contains: "group `pressure` tier `pytest`: invalid selection `profile:pytest-cache`: `profile:pytest-cache`: `pytest-cache` is a built-in that diskgc 0.1 does not ship"}]
  reclaim_exit: 2
  errors: [{cause: config, contains: "group `pressure` tier `pytest`: invalid selection `profile:pytest-cache`: `profile:pytest-cache`: `pytest-cache` is a built-in that diskgc 0.1 does not ship"}]
  actions: []
  removed: []
  skipped: []
  preserved: [/home/tester/src/idle/target/debug/deps/lib-1]
