  # contract after its eligibility walk: 8 KiB of directories and a 4 KiB
  # .lock block. Each ended session is 1 MiB and two 4 KiB directories.
  dry_run_report:
    summary:
      - profile: pytest-tmp
        found: 3
        eligible: {count: 2, estimated_bytes: 2113536, unsized: 0}
        would_reclaim: {count: 2, estimated_bytes: 2113536, unsized: 0}
        kept:
          - {reason: in_use, count: 1, estimated_bytes: 12288, unsized: 0}
        not_judged: 0
