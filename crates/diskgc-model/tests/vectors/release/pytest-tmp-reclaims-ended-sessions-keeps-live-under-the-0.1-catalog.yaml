# The 0.1 catalog admits pytest-tmp (TASK-65, Mark 2026-10-24):
# `--select profile:pytest-tmp` under it judges sessions by the pytest
# contract as the development catalog does. Sessions under a finished
# nix-shell TMPDIR that no process names go (unused root, row 11,
# liveness/pytest-tmp-dead-shell-root-eligible.yaml); the session of a
# running pytest, whose .lock holds its pid and whose TMPDIR names the
# root, is kept (liveness/pytest-tmp-live-lock-refused.yaml).
profile_vector: 1
catalog: release-0.1
profile: pytest-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/python: {}
    /home/tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-05T03:00:00Z}, test_a0: {.: {mtime: 2026-10-05T03:00:00Z}, blob: {size: 1M, mtime: 2026-10-05T03:00:00Z}}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-1: {.: {mtime: 2026-10-05T03:00:00Z}, test_a0: {.: {mtime: 2026-10-05T03:00:00Z}, blob: {size: 1M, mtime: 2026-10-05T03:00:00Z}}}
    /tmp/nix-shell.CD: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.CD/pytest-of-tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.CD/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-05T03:00:00Z}, .lock: {content: "42", mtime: 2026-10-05T03:00:00Z}, test_live0: {.: {mtime: 2026-10-05T03:00:00Z}, ready: {mtime: 2026-10-05T03:00:00Z}}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}]}
    - {pid: 42, exe: /usr/bin/python, cwd: /home/tester, maps: [/usr/bin/python], environ: ["HOME=/home/tester", "TMPDIR=/tmp/nix-shell.CD"], fds: [{path: /usr/bin/python}]}
expect:
  plan:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-1}
    - {candidate: /tmp/nix-shell.CD/pytest-of-tester/pytest-0, reason: in_use}
  reclaim_exit: 1
  actions: [/tmp/nix-shell.AB/pytest-of-tester/pytest-0, /tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  removed: [/tmp/nix-shell.AB/pytest-of-tester/pytest-0, /tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  skipped:
    - {candidate: /tmp/nix-shell.CD/pytest-of-tester/pytest-0, reason: in_use, process_blockers: [{pid: 42, evidence: owner_pid}]}
  preserved:
    - /tmp/nix-shell.CD/pytest-of-tester/pytest-0/test_live0/ready
    - /tmp/nix-shell.CD/pytest-of-tester/pytest-0/.lock
