# The session's temp root is renamed away just before the contract's listing
# of pytest-of-tester, and a new directory takes its name right after: R
# reached again by path is no longer P's parent (P is not in it), so its use
# cannot be decided (producer_unknown), never compared with the stranger.
profile_vector: 1
profile: pytest-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell.AB: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-05T03:00:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
  events:
    - {at: {op: read_dir, path: /tmp/nix-shell.AB/pytest-of-tester, nth: 2, when: before}, rename: {from: /tmp/nix-shell.AB, to: /tmp/nix-shell.CD}}
    - {at: {op: read_dir, path: /tmp/nix-shell.AB/pytest-of-tester, nth: 2, when: after}, mkdir: /tmp/nix-shell.AB}
expect:
  plan:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0, reason: producer_unknown}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0, reason: producer_unknown, process_blockers: []}
  preserved: [/tmp/nix-shell.CD/pytest-of-tester/pytest-0]
