# Owner PID (TASK-112, docs/safety.md Producer liveness): no process carries
# the pid in an rc directory's name, so the recorded shell ended and the
# directory is reclaimed, for both name shapes; a neighbouring nix-
# shell.XXXXXX directory is not matched.
profile_vector: 1
profile: nix-shell-rc
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell-4242-17: {.: {mtime: 2026-10-01T00:00:00Z}, env-vars: {mtime: 2026-10-01T00:00:00Z}, rc: {mtime: 2026-10-01T00:00:00Z}}
    /tmp/nix-develop-4243-18: {.: {mtime: 2026-10-01T00:00:00Z}}
    /tmp/nix-shell.AB: {.: {mtime: 2026-10-01T00:00:00Z}, x: {mtime: 2026-10-01T00:00:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
expect:
  plan:
    - {candidate: /tmp/nix-develop-4243-18}
    - {candidate: /tmp/nix-shell-4242-17}
  reclaim_exit: 1
  actions: [/tmp/nix-develop-4243-18, /tmp/nix-shell-4242-17]
  removed: [/tmp/nix-develop-4243-18, /tmp/nix-shell-4242-17]
  skipped: []
  preserved: [/tmp/nix-shell.AB/x]
