    /tmp/nix-shell.AB/pytest-of-tester/pytest-3: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-4: {.: {mtime: 2026-10-05T03:00:00Z}}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: ["HOME=/home/tester", "TMPDIR=/tmp/nix-shell.AB"], fds: [{path: /usr/bin/bash}]}
  events:
    - {at: {op: read_dir, path: /tmp/nix-shell.AB/pytest-of-tester, nth: 2, when: before}, fail: EACCES}
    - {at: {op: read_dir, path: /tmp/nix-shell.AB/pytest-of-tester, nth: 3, when: before}, fail: EACCES}
    - {at: {op: read_dir, path: /tmp/nix-shell.AB/pytest-of-tester, nth: 4, when: before}, fail: EACCES}
    - {at: {op: read_dir, path: /tmp/nix-shell.AB/pytest-of-tester, nth: 5, when: before}, fail: EACCES}
    - {at: {op: read_dir, path: /tmp/nix-shell.AB/pytest-of-tester, nth: 6, when: before}, fail: EACCES}
expect:
  plan:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0, reason: unreadable}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-1, reason: unreadable}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-2, reason: unreadable}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-3, reason: unreadable}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-4, reason: unreadable}
