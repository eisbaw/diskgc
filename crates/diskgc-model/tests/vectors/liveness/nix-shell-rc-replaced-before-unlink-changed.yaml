# The owner is gone and the contract permits, but the directory is replaced
# by another inode before the delete's identity check: the replacement is
# never deleted (changed). The contract does not bypass Deletion's identity
# checks.
profile_vector: 1
profile: nix-shell-rc
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell-4242-17: {.: {mtime: 2026-10-01T00:00:00Z}, rc: {mtime: 2026-10-01T00:00:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
  events:
    - at: {op: statx, path: /tmp/nix-shell-4242-17/rc, nth: 3, when: before}
      replace: /tmp/nix-shell-4242-17/rc
expect:
  plan:
    - {candidate: /tmp/nix-shell-4242-17}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/nix-shell-4242-17, reason: changed}
  preserved: [/tmp/nix-shell-4242-17/rc]
