# The project is the nearest workspace root or version-control top level:
# w/packages/a holds its own .git, so the climb stops there and the
# package.json above it (not JSON) is never read; the member, 60 days old,
# loses its node_modules although w/src changed yesterday.
profile_vector: 1
profile: node-modules
roots: [/home/tester/w]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /home/tester/.bash_history: {size: 1K}
    /home/tester/w:
      .: {mtime: 2026-08-16T03:00:00Z}
      package.json: {content: "{ name: w", mtime: 2026-08-16T03:00:00Z}
      src:
        .: {mtime: 2026-08-16T03:00:00Z}
        x.js: {mtime: 2026-10-14T03:00:00Z, atime: 2026-08-16T03:00:00Z}
      packages:
        .: {mtime: 2026-08-16T03:00:00Z}
        a:
          .: {mtime: 2026-08-16T03:00:00Z}
          package.json: {content: "{\"name\": \"p\", \"version\": \"1.0.0\"}", mtime: 2026-08-16T03:00:00Z}
          index.js: {mtime: 2026-08-16T03:00:00Z}
          node_modules:
            .: {mtime: 2026-08-16T03:00:00Z}
            z.js: {mtime: 2026-08-16T03:00:00Z}
          ".git":
            .: {mtime: 2026-08-16T03:00:00Z}
            HEAD: {mtime: 2026-08-16T03:00:00Z}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /home/tester, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}, {path: /home/tester/.bash_history}]}
expect:
  plan:
    - {candidate: /home/tester/w/packages/a/node_modules}
  reclaim_exit: 1
  actions: [/home/tester/w/packages/a/node_modules]
  removed: [/home/tester/w/packages/a/node_modules]
  skipped: []
  preserved: [/home/tester/w/src/x.js, /home/tester/w/packages/a/index.js]
