# MUST 4 (Codex 1): `q/.venv/bin/python q/server.py` launched from outside
# the project without activation: the interpreter is the system's (the
# venv's bin/python is a symlink), pure-Python imports are cached, and no
# fd, mapping, cwd or environment value names q. Its command line does.
profile_vector: 1
profile: python-venv
roots: [/home/tester/q]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/python3: {}
    /home/tester/.bash_history: {size: 1K}
    /home/tester/q:
      .: {mtime: 2026-08-16T03:00:00Z}
      pyproject.toml: {mtime: 2026-08-16T03:00:00Z}
      pkg:
        .: {mtime: 2026-08-16T03:00:00Z}
        m.py: {mtime: 2026-08-16T03:00:00Z}
      ".venv":
        .: {mtime: 2026-08-16T03:00:00Z}
        pyvenv.cfg: {mtime: 2026-08-16T03:00:00Z}
        lib:
          .: {mtime: 2026-08-16T03:00:00Z}
          x.py: {size: 4K, mtime: 2026-08-16T03:00:00Z}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /home/tester, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}, {path: /home/tester/.bash_history}]}
    - {pid: 901, exe: /usr/bin/python3, cwd: /, cmdline: [/home/tester/q/.venv/bin/python, /home/tester/q/server.py], maps: [/usr/bin/python3], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/python3}]}
expect:
  plan:
    - {candidate: /home/tester/q/.venv, reason: in_use}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /home/tester/q/.venv, reason: in_use, process_blockers: [{pid: 901, evidence: command_line}]}
  preserved: [/home/tester/q/.venv/lib/x.py]
