# Tool-managed installs below a hidden directory under the root (npx's
# cache, an editor extension) are not the user's projects: the built-in
# excludes every candidate with a hidden directory between the root and it,
# so none is found, however idle; a project's own node_modules is.
profile_vector: 1
profile: node-modules
roots: [/home/tester]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/node: {}
    /home/tester/.bash_history: {size: 1K}
    /home/tester/p:
      .: {mtime: 2026-08-16T03:00:00Z}
      package.json: {content: "{\"name\": \"p\", \"version\": \"1.0.0\"}", mtime: 2026-08-16T03:00:00Z}
      src:
        .: {mtime: 2026-08-16T03:00:00Z}
        a.js: {mtime: 2026-08-16T03:00:00Z}
      node_modules:
        .: {mtime: 2026-08-16T03:00:00Z}
        x:
          .: {mtime: 2026-08-16T03:00:00Z}
          i.js: {size: 4K, mtime: 2026-08-16T03:00:00Z}
    /home/tester/.npm:
      .: {mtime: 2026-08-16T03:00:00Z}
      _npx:
        .: {mtime: 2026-08-16T03:00:00Z}
        f00d:
          .: {mtime: 2026-08-16T03:00:00Z}
          package.json: {content: "{\"name\": \"p\", \"version\": \"1.0.0\"}", mtime: 2026-08-16T03:00:00Z}
          node_modules:
            .: {mtime: 2026-08-16T03:00:00Z}
            z.js: {mtime: 2026-08-16T03:00:00Z}
    /home/tester/.cursor:
      .: {mtime: 2026-08-16T03:00:00Z}
      extensions:
        .: {mtime: 2026-08-16T03:00:00Z}
        ext-1.0:
          .: {mtime: 2026-08-16T03:00:00Z}
          package.json: {content: "{\"name\": \"p\", \"version\": \"1.0.0\"}", mtime: 2026-08-16T03:00:00Z}
          node_modules:
            .: {mtime: 2026-08-16T03:00:00Z}
            z.js: {mtime: 2026-08-16T03:00:00Z}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /home/tester, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}, {path: /home/tester/.bash_history}]}
expect:
  plan:
    - {candidate: /home/tester/p/node_modules}
  reclaim_exit: 1
  actions: [/home/tester/p/node_modules]
  removed: [/home/tester/p/node_modules]
  skipped: []
  preserved: [/home/tester/.npm/_npx/f00d/node_modules/z.js, /home/tester/.cursor/extensions/ext-1.0/node_modules/z.js]
