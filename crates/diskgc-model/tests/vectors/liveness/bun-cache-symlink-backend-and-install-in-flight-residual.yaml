# TASK-122 residuals of bun-cache (verified heuristic, admitted by
# mark-emulator for Mark, 2026-10-24): a project installed with the
# non-default --backend=symlink links into the cache, and a bun install in
# flight holds nothing there. The cache is deleted; the symlink is never
# followed and stays, dangling until the project is reinstalled.
profile_vector: 1
select: profile:bun-cache
roots: [/home/tester]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bun: {mode: "0755"}
    /home/tester/.bun/install/cache: {left-pad@1.3.0: {index.js: {size: 8K}}}
    /home/tester/src/app/node_modules: {left-pad: {symlink: /home/tester/.bun/install/cache/left-pad@1.3.0}}
  processes:
    - {pid: 4242, exe: /usr/bin/bun, cwd: /home/tester/src/app, maps: [/usr/bin/bun], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bun}]}
expect:
  plan:
    - {candidate: /home/tester/.bun/install/cache}
  reclaim_exit: 1
  actions: [/home/tester/.bun/install/cache]
  removed: [/home/tester/.bun/install/cache]
  skipped: []
  preserved: [/home/tester/src/app/node_modules/left-pad]
