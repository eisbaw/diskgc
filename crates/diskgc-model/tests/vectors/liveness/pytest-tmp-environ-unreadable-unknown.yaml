    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-3, reason: producer_unknown}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-4, reason: producer_unknown}
  reclaim_exit: 1
  actions: [/tmp/nix-shell.AB/pytest-of-tester/pytest-0, /tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  removed: [/tmp/nix-shell.AB/pytest-of-tester/pytest-0, /tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  skipped:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-2, reason: producer_unknown, process_blockers: [{pid: 900, evidence: unreadable}]}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-3, reason: producer_unknown, process_blockers: [{pid: 900, evidence: unreadable}]}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-4, reason: producer_unknown, process_blockers: [{pid: 900, evidence: unreadable}]}
  preserved:
