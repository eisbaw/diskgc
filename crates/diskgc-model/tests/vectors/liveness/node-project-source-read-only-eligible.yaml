# MUST 5 (PENDING Mark's confirmation; node-modules held, TASK-365): the project's own code was read
# yesterday (src/a.js atime), nothing changed and nothing in node_modules
# was read. Rule 2 counts reads only in the dependency directories, so this
# no longer keeps node_modules (a run that imports a dependency reads it;
# one that needs none leaves nothing to lose but a reinstall).
profile_vector: 1
profile: node-modules
roots: [/home/tester/p]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/node: {}
    /home/tester/.bash_history: {size: 1K}
    /home/tester/p:
      .: {mtime: 2026-08-16T03:00:00Z}
      package.json: {content: "{\"name\": \"p\", \"version\": \"1.0.0\"}", mtime: 2026-08-16T03:00:00Z}
      src:
        .: {mtime: 2026-08-16T03:00:00Z}
        a.js: {mtime: 2026-08-16T03:00:00Z, atime: 2026-10-14T03:00:00Z}
      node_modules:
        .: {mtime: 2026-08-16T03:00:00Z}
        x:
          .: {mtime: 2026-08-16T03:00:00Z}
          i.js: {size: 4K, mtime: 2026-08-16T03:00:00Z}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /home/tester, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}, {path: /home/tester/.bash_history}]}
expect:
  plan:
    - {candidate: /home/tester/p/node_modules}
  reclaim_exit: 1
  actions: [/home/tester/p/node_modules]
  removed: [/home/tester/p/node_modules]
  skipped: []
  preserved: [/home/tester/p/package.json, /home/tester/p/src/a.js]
