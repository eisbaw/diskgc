# MUST 2 (Codex 2): /home/tester/p/data binds a directory of another
# filesystem, also reachable at /fast/data. A process outside the project
# holds /fast/data/f: its device is one the project contains (through the
# mount under it), but it is on another filesystem than the project's, so
# it cannot be placed by the project's path within its filesystem: it
# retains, as for a mount outside diskgc's table.
profile_vector: 1
profile: node-modules
roots: [/home/tester/p]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
    - {id: 3, at: /fast, fs: ext4, dev: "254:3", size: 10G, parent: 1}
    - {id: 4, at: /home/tester/p/data, fs: ext4, dev: "254:3", size: 10G, parent: 2, bind_of: 3, bind_root: /data}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/node: {}
    /fast/data/f: {mtime: 2026-08-16T03:00:00Z}
    /home/tester/.bash_history: {size: 1K}
    /home/tester/p:
      .: {mtime: 2026-08-16T03:00:00Z}
      package.json: {content: "{\"name\": \"p\", \"version\": \"1.0.0\"}", mtime: 2026-08-16T03:00:00Z}
      src:
        .: {mtime: 2026-08-16T03:00:00Z}
        a.js: {mtime: 2026-08-16T03:00:00Z}
      node_modules:
        .: {mtime: 2026-08-16T03:00:00Z}
        x:
          .: {mtime: 2026-08-16T03:00:00Z}
          i.js: {size: 4K, mtime: 2026-08-16T03:00:00Z}
      data:
        .: {mtime: 2026-08-16T03:00:00Z}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /home/tester, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}, {path: /home/tester/.bash_history}]}
    - {pid: 901, exe: /usr/bin/node, cwd: /, maps: [/usr/bin/node], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/node}, {path: /fast/data/f}]}
