# pnpm's layout: node_modules holds symlinks and hard links into pnpm's
# store. The walk follows no symlink, and removing a hard link leaves the
# store's copy: only the project's view goes.
profile_vector: 1
profile: node-modules
roots: [/home/tester/p]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/node: {}
    /home/tester/.bash_history: {size: 1K}
    /home/tester/p:
      .: {mtime: 2026-08-16T03:00:00Z}
      package.json: {content: "{\"name\": \"p\", \"version\": \"1.0.0\"}", mtime: 2026-08-16T03:00:00Z}
      src:
        .: {mtime: 2026-08-16T03:00:00Z}
        a.js: {mtime: 2026-08-16T03:00:00Z}
      node_modules:
        .: {mtime: 2026-08-16T03:00:00Z}
        x:
          .: {mtime: 2026-08-16T03:00:00Z}
          i.js: {size: 4K, mtime: 2026-08-16T03:00:00Z}
        ".pnpm":
          .: {mtime: 2026-08-16T03:00:00Z}
          x@1:
            .: {mtime: 2026-08-16T03:00:00Z}
            node_modules:
              .: {mtime: 2026-08-16T03:00:00Z}
              x:
                .: {mtime: 2026-08-16T03:00:00Z}
                i.js: {link: /home/tester/.local/share/pnpm/store/ab/cd}
        y: {symlink: .pnpm/x@1/node_modules/x, mtime: 2026-08-16T03:00:00Z}
    /home/tester/.local:
      .: {mtime: 2026-08-16T03:00:00Z}
      share:
        .: {mtime: 2026-08-16T03:00:00Z}
        pnpm:
          .: {mtime: 2026-08-16T03:00:00Z}
          store:
            .: {mtime: 2026-08-16T03:00:00Z}
            ab:
              .: {mtime: 2026-08-16T03:00:00Z}
              cd: {size: 4K, mtime: 2026-08-16T03:00:00Z}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /home/tester, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}, {path: /home/tester/.bash_history}]}
expect:
  plan:
    - {candidate: /home/tester/p/node_modules}
  reclaim_exit: 1
  actions: [/home/tester/p/node_modules]
  removed: [/home/tester/p/node_modules]
  skipped: []
  preserved: [/home/tester/p/package.json, /home/tester/.local/share/pnpm/store/ab/cd]
