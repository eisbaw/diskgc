# TASK-122 residual of go-mod-cache (verified heuristic, admitted by
# mark-emulator for Mark, 2026-10-24): a go build between reading two
# module sources holds nothing in the module cache, which is deleted under
# it; the build can fail once and re-download on the next run.
profile_vector: 1
select: profile:go-mod-cache
roots: [/home/tester]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/go: {mode: "0755"}
    /home/tester/src/app/main.go: {size: 1K}
    /home/tester/go/pkg/mod: {example.com: {m@v1.0.0: {m.go: {size: 8K}}}}
  processes:
    - {pid: 4242, exe: /usr/bin/go, cwd: /home/tester/src/app, maps: [/usr/bin/go], environ: [HOME=/home/tester], fds: [{path: /home/tester/src/app/main.go}]}
expect:
  plan:
    - {candidate: /home/tester/go/pkg/mod}
  reclaim_exit: 1
  actions: [/home/tester/go/pkg/mod]
  removed: [/home/tester/go/pkg/mod]
  skipped: []
  preserved: [/home/tester/src/app/main.go]
