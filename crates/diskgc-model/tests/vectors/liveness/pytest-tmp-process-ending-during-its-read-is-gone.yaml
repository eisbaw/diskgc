# A process that ends during its own read (here just before its TMPDIR is
# looked up in its root) is gone, as the in-use scan takes it: the facts are
# read within the scan's rounds, so a child it forked before it ended is
# listed and read in a later round (pytest-tmp-child-forked-during-a-read-
# is-read); with none, nothing uses the root and the sessions go by rows 7
# and 11.
profile_vector: 1
profile: pytest-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/python: {}
    /tmp/other: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-1: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-2: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-3: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-4: {.: {mtime: 2026-10-05T03:00:00Z}}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: ["HOME=/home/tester", "TMPDIR=/tmp/nix-shell.AB"], fds: [{path: /usr/bin/bash}]}
  events:
    - {at: {op: proc_root_lookup, path: /tmp/nix-shell.AB, nth: 1, when: before}, exit: 900}
expect:
  plan:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-1}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-2}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-3}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-4}
  reclaim_exit: 1
  actions: [/tmp/nix-shell.AB/pytest-of-tester/pytest-0, /tmp/nix-shell.AB/pytest-of-tester/pytest-1, /tmp/nix-shell.AB/pytest-of-tester/pytest-2, /tmp/nix-shell.AB/pytest-of-tester/pytest-3, /tmp/nix-shell.AB/pytest-of-tester/pytest-4]
  removed: [/tmp/nix-shell.AB/pytest-of-tester/pytest-0, /tmp/nix-shell.AB/pytest-of-tester/pytest-1, /tmp/nix-shell.AB/pytest-of-tester/pytest-2, /tmp/nix-shell.AB/pytest-of-tester/pytest-3, /tmp/nix-shell.AB/pytest-of-tester/pytest-4]
  skipped: []
  preserved: []
