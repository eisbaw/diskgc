# A killed controller's xdist worker lives on (the execnet bootstrap, no
# PYTEST_XDIST_* in its initial environment) with TMPDIR the session's root: row 10.
profile_vector: 1
profile: pytest-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/python: {}
    /home/tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/other: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-14T03:00:00Z}, .lock: {content: "42", mtime: 2026-10-14T03:00:00Z}}
  processes:
    - {pid: 43, exe: /usr/bin/python, cwd: /, maps: [/usr/bin/python], environ: ["HOME=/home/tester", "TMPDIR=/tmp/nix-shell.AB"], fds: [{path: /usr/bin/python}], cmdline: ["python", "-u", "-c", "import sys;exec(eval(sys.stdin.readline()))"]}
expect:
  plan:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0, reason: in_use}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0, reason: in_use, process_blockers: [{pid: 43, evidence: temp_root}]}
  preserved:
    - /tmp/nix-shell.AB/pytest-of-tester/pytest-0
