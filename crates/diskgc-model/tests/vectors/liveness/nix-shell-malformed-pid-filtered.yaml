# Names that hold no valid pid are not instances of the contract (filtered,
# all preserved): a leading zero, a pid above PID_MAX_LIMIT, non-digits, an
# empty suffix.
profile_vector: 1
profile: nix-shell-probe
user_profiles:
  - name: nix-shell-probe
    find: {roots: [/tmp], paths: ["nix-shell-*-*", "nix-develop-*-*"], type: dir}
    where: {liveness_contract: nix-shell}
    min_idle_for: 1h
    action: delete
    examples: {match: [/tmp/nix-shell-4242-17, /tmp/nix-develop-4243-18]}
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell-0042-1: {.: {mtime: 2026-10-01T00:00:00Z}}
    /tmp/nix-shell-4194305-1: {.: {mtime: 2026-10-01T00:00:00Z}}
    /tmp/nix-shell-abc-1: {.: {mtime: 2026-10-01T00:00:00Z}}
    /tmp/nix-develop-42-: {.: {mtime: 2026-10-01T00:00:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
expect:
  plan:
    - {candidate: /tmp/nix-develop-42-, reason: filtered}
    - {candidate: /tmp/nix-shell-0042-1, reason: filtered}
    - {candidate: /tmp/nix-shell-4194305-1, reason: filtered}
    - {candidate: /tmp/nix-shell-abc-1, reason: filtered}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/nix-develop-42-, reason: filtered}
    - {candidate: /tmp/nix-shell-0042-1, reason: filtered}
    - {candidate: /tmp/nix-shell-4194305-1, reason: filtered}
    - {candidate: /tmp/nix-shell-abc-1, reason: filtered}
  preserved: [/tmp/nix-develop-42-, /tmp/nix-shell-0042-1, /tmp/nix-shell-4194305-1, /tmp/nix-shell-abc-1]
