# The TASK-65 counterexample with the built-in: a live tmp_path_retention_policy=none
# session with a test directory and no .lock; the pytest holds no fd in it. Its temp
# root /tmp is used by the live pytest (row 10).
profile_vector: 1
profile: pytest-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/python: {}
    /home/tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/other: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-05T03:00:00Z}, test_active0: {.: {mtime: 2026-10-05T03:00:00Z}}}
  processes:
    - {pid: 600, exe: /usr/bin/python, cwd: /, maps: [/usr/bin/python], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/python}], cmdline: ["python", "-m", "pytest"]}
expect:
  plan:
    - {candidate: /tmp/pytest-of-tester/pytest-0, reason: in_use}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/pytest-of-tester/pytest-0, reason: in_use, process_blockers: [{pid: 600, evidence: temp_root}]}
  preserved:
    - /tmp/pytest-of-tester/pytest-0
