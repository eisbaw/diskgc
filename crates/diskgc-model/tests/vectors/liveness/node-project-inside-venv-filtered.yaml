# A node_modules inside a Python virtual environment named venv (not
# hidden, so the profile's exclusion of hidden directories does not apply):
# q/venv/share/app holds its own package.json, but it lies inside another
# dependency directory (one holding pyvenv.cfg), so node-modules filters
# it.
profile_vector: 1
profile: node-modules
roots: [/home/tester/q]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /home/tester/.bash_history: {size: 1K}
    /home/tester/q:
      .: {mtime: 2026-08-16T03:00:00Z}
      pyproject.toml: {mtime: 2026-08-16T03:00:00Z}
      venv:
        .: {mtime: 2026-08-16T03:00:00Z}
        pyvenv.cfg: {mtime: 2026-08-16T03:00:00Z}
        share:
          .: {mtime: 2026-08-16T03:00:00Z}
          app:
            .: {mtime: 2026-08-16T03:00:00Z}
            package.json: {content: "{\"name\": \"p\", \"version\": \"1.0.0\"}", mtime: 2026-08-16T03:00:00Z}
            node_modules:
              .: {mtime: 2026-08-16T03:00:00Z}
              z.js: {mtime: 2026-08-16T03:00:00Z}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /home/tester, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}, {path: /home/tester/.bash_history}]}
expect:
  plan:
    - {candidate: /home/tester/q/venv/share/app/node_modules, reason: filtered}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /home/tester/q/venv/share/app/node_modules, reason: filtered}
  preserved: [/home/tester/q/venv/share/app/node_modules/z.js]
