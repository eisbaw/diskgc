# A vendored tree (r/third_party/tool, with its own setup.py and .venv, all
# 60 days old) inside a repository whose own code changed yesterday: the
# project is the nearest version-control top level, r, so the vendored
# tool's .venv is kept while the repository is in use.
profile_vector: 1
profile: python-venv
roots: [/home/tester/r]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /home/tester/.bash_history: {size: 1K}
    /home/tester/r:
      .: {mtime: 2026-08-16T03:00:00Z}
      ".git":
        .: {mtime: 2026-08-16T03:00:00Z}
        HEAD: {mtime: 2026-08-16T03:00:00Z}
      src:
        .: {mtime: 2026-08-16T03:00:00Z}
        main.py: {mtime: 2026-10-14T03:00:00Z, atime: 2026-08-16T03:00:00Z}
      third_party:
        .: {mtime: 2026-08-16T03:00:00Z}
        tool:
          .: {mtime: 2026-08-16T03:00:00Z}
          setup.py: {mtime: 2026-08-16T03:00:00Z}
          ".venv":
            .: {mtime: 2026-08-16T03:00:00Z}
            pyvenv.cfg: {mtime: 2026-08-16T03:00:00Z}
            lib:
              .: {mtime: 2026-08-16T03:00:00Z}
              x.py: {mtime: 2026-08-16T03:00:00Z}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /home/tester, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}, {path: /home/tester/.bash_history}]}
expect:
  plan:
    - {candidate: /home/tester/r/third_party/tool/.venv, reason: not_idle}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /home/tester/r/third_party/tool/.venv, reason: not_idle}
  preserved: [/home/tester/r/third_party/tool/.venv/lib/x.py]
