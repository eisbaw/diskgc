# Claude Code's temp root /tmp/claude-1000 is used by a process with that TMPDIR.
profile_vector: 1
profile: pytest-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/python: {}
    /home/tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/other: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/claude-1000: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/claude-1000/pytest-of-tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/claude-1000/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/claude-1000/pytest-of-tester/pytest-1: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/claude-1000/pytest-of-tester/pytest-2: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/claude-1000/pytest-of-tester/pytest-3: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/claude-1000/pytest-of-tester/pytest-4: {.: {mtime: 2026-10-05T03:00:00Z}}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: ["HOME=/home/tester", "TMPDIR=/tmp/claude-1000"], fds: [{path: /usr/bin/bash}]}
expect:
  plan:
    - {candidate: /tmp/claude-1000/pytest-of-tester/pytest-0}
    - {candidate: /tmp/claude-1000/pytest-of-tester/pytest-1}
    - {candidate: /tmp/claude-1000/pytest-of-tester/pytest-2, reason: in_use}
    - {candidate: /tmp/claude-1000/pytest-of-tester/pytest-3, reason: in_use}
    - {candidate: /tmp/claude-1000/pytest-of-tester/pytest-4, reason: in_use}
  reclaim_exit: 1
  actions: [/tmp/claude-1000/pytest-of-tester/pytest-0, /tmp/claude-1000/pytest-of-tester/pytest-1]
  removed: [/tmp/claude-1000/pytest-of-tester/pytest-0, /tmp/claude-1000/pytest-of-tester/pytest-1]
  skipped:
    - {candidate: /tmp/claude-1000/pytest-of-tester/pytest-2, reason: in_use, process_blockers: [{pid: 900, evidence: temp_root}]}
    - {candidate: /tmp/claude-1000/pytest-of-tester/pytest-3, reason: in_use, process_blockers: [{pid: 900, evidence: temp_root}]}
    - {candidate: /tmp/claude-1000/pytest-of-tester/pytest-4, reason: in_use, process_blockers: [{pid: 900, evidence: temp_root}]}
  preserved:
    - /tmp/claude-1000/pytest-of-tester/pytest-2
    - /tmp/claude-1000/pytest-of-tester/pytest-3
    - /tmp/claude-1000/pytest-of-tester/pytest-4
