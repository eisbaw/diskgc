# A pytest whose --basetemp names pytest-3 and whose TMPDIR is the root forks
# a child while it is being read and then ends: the scan lists again, reads
# the child, which inherited both, and keeps pytest-3 (row 6, command_line)
# and the other sessions above the rank (row 10); the old sessions below the
# rank go by row 7. Every read only adds, without a window after the last
# listing.
profile_vector: 1
profile: pytest-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/python: {}
    /tmp/other: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-1: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-2: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-3: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-4: {.: {mtime: 2026-10-05T03:00:00Z}}
  processes:
    - {pid: 900, exe: /usr/bin/python, cwd: /, maps: [/usr/bin/python], environ: ["HOME=/home/tester", "TMPDIR=/tmp/nix-shell.AB"], fds: [{path: /usr/bin/python}], cmdline: ["python", "-m", "pytest", "--basetemp=/tmp/nix-shell.AB/pytest-of-tester/pytest-3"]}
  events:
    - {at: {op: proc_cmdline, path: /proc/900/cmdline, nth: 1, when: before}, fork: {pid: 900, child: 901}}
    - {at: {op: proc_cmdline, path: /proc/900/cmdline, nth: 1, when: after}, exit: 900}
expect:
  plan:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-1}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-2, reason: in_use}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-3, reason: in_use}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-4, reason: in_use}
  reclaim_exit: 1
  actions: [/tmp/nix-shell.AB/pytest-of-tester/pytest-0, /tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  removed: [/tmp/nix-shell.AB/pytest-of-tester/pytest-0, /tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  skipped:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-2, reason: in_use, process_blockers: [{pid: 901, evidence: temp_root}]}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-3, reason: in_use, process_blockers: [{pid: 901, evidence: command_line}]}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-4, reason: in_use, process_blockers: [{pid: 901, evidence: temp_root}]}
  preserved:
    - /tmp/nix-shell.AB/pytest-of-tester/pytest-2
    - /tmp/nix-shell.AB/pytest-of-tester/pytest-3
    - /tmp/nix-shell.AB/pytest-of-tester/pytest-4
