# diskgc in a PID namespace other than the initial one cannot see sibling
# namespaces: no PID answer permits (Owner PID step 3). Only a development
# build inside a marked test container gets this far (`test_container`):
# anywhere else ensure refuses below the goal (TASK-263,
# inuse/pid-namespace-nested-refused.yaml), and the test-container
# exception is the in-use check's alone, never Owner PID's.
profile_vector: 1
profile: nix-shell-rc
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  pid_namespace: test_container
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell-4242-17: {.: {mtime: 2026-10-01T00:00:00Z}, env-vars: {mtime: 2026-10-01T00:00:00Z}, rc: {mtime: 2026-10-01T00:00:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
expect:
  plan:
    - {candidate: /tmp/nix-shell-4242-17, reason: producer_unknown}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/nix-shell-4242-17, reason: producer_unknown, process_blockers: []}
  preserved: [/tmp/nix-shell-4242-17/rc]
  report:
    skipped:
      - {detail: "liveness_contract nix-shell: whether owner pid 4242 ended cannot be decided: diskgc is not in the initial PID namespace"}
