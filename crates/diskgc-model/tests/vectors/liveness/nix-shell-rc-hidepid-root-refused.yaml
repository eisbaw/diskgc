# The nix-shell-rc built-in under --allow-root with a held /proc mounted
# with hidepid: root does not lift the rule. Whether its capabilities reach
# a hidden process depends on that process's user namespace (Owner PID step
# 4), and an LSM may keep one from it, which hidepid then hides instead of
# showing it unreadable: ensure refuses at start (TASK-263).
profile_vector: 1
allow_root: true
config: |
  version: 1
  owners: [tester]
  groups:
    - name: g
      tiers:
        - {name: t, select: profile:nix-shell-rc}
path: /tmp
min_free: 100%
host:
  host_model: 1
  users: {tester: 1000}
  clock: 2026-10-15T03:00:00Z
  own_uid: 0
  proc_hidepid: true
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell-4242-17: {.: {mtime: 2026-10-01T00:00:00Z}, env-vars: {mtime: 2026-10-01T00:00:00Z}, rc: {mtime: 2026-10-01T00:00:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
expect:
  plan: []
  dry_run_exit: 2
  dry_run_errors: [{cause: safety, contains: "the held /proc is mounted with hidepid, so the in-use check cannot see every process"}]
  reclaim_exit: 2
  errors: [{cause: safety, contains: "the held /proc is mounted with hidepid, so the in-use check cannot see every process"}]
  actions: []
  removed: []
  skipped: []
  preserved: [/tmp/nix-shell-4242-17/rc]
