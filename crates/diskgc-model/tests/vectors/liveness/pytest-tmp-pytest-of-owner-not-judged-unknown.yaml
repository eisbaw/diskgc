# A session of the user inside a pytest-of directory of another uid (2000):
# pytest makes no such session (it refuses a pytest-of directory its uid
# does not own), and that uid's processes are not read by this run, so the
# process set is unknown: producer_unknown, never eligible.
profile_vector: 1
profile: pytest-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell.AB: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-other: {.: {mtime: 2026-10-05T03:00:00Z, uid: 2000, mode: "0777"}}
    /tmp/nix-shell.AB/pytest-of-other/pytest-0: {.: {mtime: 2026-10-05T03:00:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
expect:
  plan:
    - {candidate: /tmp/nix-shell.AB/pytest-of-other/pytest-0, reason: producer_unknown}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/nix-shell.AB/pytest-of-other/pytest-0, reason: producer_unknown, process_blockers: []}
  preserved: [/tmp/nix-shell.AB/pytest-of-other/pytest-0]
