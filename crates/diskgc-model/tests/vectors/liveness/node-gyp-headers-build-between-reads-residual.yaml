# Residual of node-gyp-headers (TASK-40, verified heuristic, pending Mark's
# admission): a native-addon build between two compiler invocations holds
# nothing in the header directory, so it is deleted; the next compiler
# invocation fails once. The next node-gyp configure finds no installVersion
# and downloads the headers again (it needs the network, or --nodedir).
profile_vector: 1
select: profile:node-gyp-headers
roots: [/home/tester]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/make: {mode: "0755"}
    /home/tester/src/addon/build/Makefile: {size: 1K}
    /home/tester/.cache/node-gyp/22.12.0: {.: {mtime: 2026-09-01T00:00:00Z}, installVersion: {content: "11\n", mtime: 2026-09-01T00:00:00Z}, include: {.: {mtime: 2026-09-01T00:00:00Z}, node: {.: {mtime: 2026-09-01T00:00:00Z}, node.h: {size: 8K, mtime: 2026-09-01T00:00:00Z}}}}
  processes:
    - {pid: 4242, exe: /usr/bin/make, cwd: /home/tester/src/addon/build, maps: [/usr/bin/make], environ: [HOME=/home/tester], fds: [{path: /home/tester/src/addon/build/Makefile}]}
expect:
  plan:
    - {candidate: /home/tester/.cache/node-gyp/22.12.0}
  reclaim_exit: 1
  actions: [/home/tester/.cache/node-gyp/22.12.0]
  removed: [/home/tester/.cache/node-gyp/22.12.0]
  skipped: []
  preserved: [/home/tester/src/addon/build/Makefile]
