# A process takes the recorded pid after the scan's last listing (pid reuse:
# shell 500 forks pid 4242 just before the pidfd probe). The table does not
# carry it, but the probe of the number in diskgc's namespace finds it: only
# ESRCH lets "ended" stand, so the directory is retained.
profile_vector: 1
profile: nix-shell-probe
user_profiles:
  - name: nix-shell-probe
    find: {roots: [/tmp], paths: ["nix-shell-*-*", "nix-develop-*-*"], type: dir}
    where: {liveness_contract: nix-shell}
    min_idle_for: 1h
    action: delete
    examples: {match: [/tmp/nix-shell-4242-17, /tmp/nix-develop-4243-18]}
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell-4242-17: {.: {mtime: 2026-10-01T00:00:00Z}, env-vars: {mtime: 2026-10-01T00:00:00Z}, rc: {mtime: 2026-10-01T00:00:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
  events:
    - at: {op: pid_alive, path: /proc/4242, nth: 1, when: before}
      fork: {pid: 500, child: 4242}
expect:
  plan:
    - {candidate: /tmp/nix-shell-4242-17, reason: in_use}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/nix-shell-4242-17, reason: in_use, process_blockers: [{pid: 4242, evidence: owner_pid}]}
  preserved: [/tmp/nix-shell-4242-17/rc]
