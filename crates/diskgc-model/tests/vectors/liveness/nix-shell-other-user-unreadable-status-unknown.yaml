# Owner PID's process set is every user's processes: another user's process
# 78 whose NSpid cannot be read makes the answer unknown (a process can
# change its uids and keep its pid).
profile_vector: 1
profile: nix-shell-probe
user_profiles:
  - name: nix-shell-probe
    find: {roots: [/tmp], paths: ["nix-shell-*-*", "nix-develop-*-*"], type: dir}
    where: {liveness_contract: nix-shell}
    min_idle_for: 1h
    action: delete
    examples: {match: [/tmp/nix-shell-4242-17, /tmp/nix-develop-4243-18]}
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell-4242-17: {.: {mtime: 2026-10-01T00:00:00Z}, env-vars: {mtime: 2026-10-01T00:00:00Z}, rc: {mtime: 2026-10-01T00:00:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
    - {pid: 78, uid: 2000, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/other], fds: [{path: /usr/bin/bash}], proc: denied, nspid: unreadable}
expect:
  plan:
    - {candidate: /tmp/nix-shell-4242-17, reason: producer_unknown}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/nix-shell-4242-17, reason: producer_unknown, process_blockers: [{pid: 78, evidence: unreadable}]}
  preserved: [/tmp/nix-shell-4242-17/rc]
