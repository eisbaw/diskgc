# Below the 1h floor: the directory changed 10 minutes before the clock, so
# it is not_idle whatever the owner.
profile_vector: 1
profile: nix-shell-rc
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell-4242-17: {.: {mtime: 2026-10-15T02:50:00Z}, rc: {mtime: 2026-10-15T02:50:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
expect:
  plan:
    - {candidate: /tmp/nix-shell-4242-17, reason: not_idle}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/nix-shell-4242-17, reason: not_idle}
  preserved: [/tmp/nix-shell-4242-17/rc]
