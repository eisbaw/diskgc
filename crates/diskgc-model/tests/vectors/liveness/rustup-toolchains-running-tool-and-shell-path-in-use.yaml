# rustup-toolchains (TASK-94): a toolchain a visible process uses is in
# use: a program that maps a library from it (rust-analyzer started by an
# editor maps librustc_driver), and a shell whose initial PATH lists its
# bin directory (the environment rule splits PATH-like lists).
profile_vector: 1
select: profile:rustup-toolchains
roots: [/home/tester]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/tool: {mode: "0755"}
    /usr/bin/editor: {mode: "0755"}
    /home/tester/.rustup/settings.toml: {content: "version = \"12\"\n"}
    /home/tester/.rustup/toolchains:
      1.86.0-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, lib: {.: {mtime: 2026-09-01T00:00:00Z}, librustc_driver.so: {size: 8K, mtime: 2026-09-01T00:00:00Z}}}
      1.87.0-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      1.88.0-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
  processes:
    - {pid: 901, exe: /usr/bin/editor, cwd: /, maps: [/usr/bin/editor, /home/tester/.rustup/toolchains/1.86.0-x86_64-unknown-linux-gnu/lib/librustc_driver.so], environ: [HOME=/home/tester], fds: [{path: /usr/bin/editor}]}
    - {pid: 902, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester, "PATH=/home/tester/.rustup/toolchains/1.87.0-x86_64-unknown-linux-gnu/bin:/usr/bin"], fds: [{path: /usr/bin/tool}]}
expect:
  plan:
    - {candidate: /home/tester/.rustup/toolchains/1.86.0-x86_64-unknown-linux-gnu, reason: in_use}
    - {candidate: /home/tester/.rustup/toolchains/1.87.0-x86_64-unknown-linux-gnu, reason: in_use}
    - {candidate: /home/tester/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu}
  reclaim_exit: 1
  actions: [/home/tester/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu]
  removed: [/home/tester/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu]
  skipped:
    - {candidate: /home/tester/.rustup/toolchains/1.86.0-x86_64-unknown-linux-gnu, reason: in_use, process_blockers: [{pid: 901, evidence: map}]}
    - {candidate: /home/tester/.rustup/toolchains/1.87.0-x86_64-unknown-linux-gnu, reason: in_use, process_blockers: [{pid: 902, evidence: environment}]}
  preserved:
    - /home/tester/.rustup/toolchains/1.86.0-x86_64-unknown-linux-gnu/lib/librustc_driver.so
    - /home/tester/.rustup/toolchains/1.87.0-x86_64-unknown-linux-gnu/bin/rustc
