# rustup-toolchains (TASK-94) fails closed on a settings.toml it does not
# know: rustup documents the file's schema as private, so only version 12
# is read; any other version (and a missing or malformed file) keeps every
# toolchain, since the default and the overrides cannot be told.
profile_vector: 1
select: profile:rustup-toolchains
roots: [/home/tester]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/tool: {mode: "0755"}
    /home/tester/.rustup/settings.toml: {content: "version = \"13\"\ndefault_toolchain = \"stable-x86_64-unknown-linux-gnu\"\n"}
    /home/tester/.rustup/toolchains:
      1.87.0-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: /usr/bin/tool}]}
expect:
  plan:
    - {candidate: /home/tester/.rustup/toolchains/1.87.0-x86_64-unknown-linux-gnu, reason: pinned_toolchain}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /home/tester/.rustup/toolchains/1.87.0-x86_64-unknown-linux-gnu, reason: pinned_toolchain}
  preserved:
    - /home/tester/.rustup/toolchains/1.87.0-x86_64-unknown-linux-gnu/bin/rustc
