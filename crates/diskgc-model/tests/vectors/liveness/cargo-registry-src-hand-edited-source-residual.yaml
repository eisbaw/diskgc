# Residual of cargo-registry-src (TASK-40, verified heuristic, pending
# Mark's admission; it needs his decision): a dependency source the user
# edited by hand in the registry (a debug print, a [patch] path pointing
# there) is the user's own work, outside the rule's loss bound. Edited two
# hours ago, it is past the one-hour floor and deleted with its crate;
# Cargo extracts the pristine source again. Remedy: .diskgc-keep or
# protect.
profile_vector: 1
select: profile:cargo-registry-src
roots: [/home/tester]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /home/tester/src/app/Cargo.toml: {size: 1K}
    /home/tester/.cargo/registry/src/index.crates.io-0123456789abcdef/dep-1.0.0: {.: {mtime: 2026-09-01T00:00:00Z}, .cargo-ok: {content: "{\"v\":1}", mtime: 2026-09-01T00:00:00Z}, src: {.: {mtime: 2026-09-01T00:00:00Z}, lib.rs: {size: 8K, mtime: 2026-10-15T01:00:00Z}}}
expect:
  plan:
    - {candidate: /home/tester/.cargo/registry/src/index.crates.io-0123456789abcdef/dep-1.0.0}
  reclaim_exit: 1
  actions: [/home/tester/.cargo/registry/src/index.crates.io-0123456789abcdef/dep-1.0.0]
  removed: [/home/tester/.cargo/registry/src/index.crates.io-0123456789abcdef/dep-1.0.0]
  skipped: []
  preserved: [/home/tester/src/app/Cargo.toml]
