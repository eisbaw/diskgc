# elan-toolchains (TASK-94): a pin naming another repository's
# lean-toolchain (`leanprover-community/mathlib4:lean-toolchain`) is
# resolved by elan through the network, recursively, to a release diskgc
# cannot know: while one is seen, every elan toolchain is kept. The
# detail names the pin. Custom toolchains (a real `lean4-patched`
# directory, an old elan's `---stable`) are kept in any case.
profile_vector: 1
select: profile:elan-toolchains
roots: [/home/tester]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/tool: {mode: "0755"}
    /home/tester/.elan/settings.toml: {content: "version = \"12\"\n"}
    /home/tester/.elan/toolchains:
      lean4-patched: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, lean: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      leanprover--lean4---stable: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, lean: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      leanprover--lean4---v4.16.0: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, lean: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
    /home/tester/src/proof/lean-toolchain: {content: "leanprover-community/mathlib4:lean-toolchain\n"}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: /usr/bin/tool}]}
expect:
  plan:
    - {candidate: /home/tester/.elan/toolchains/lean4-patched, reason: pinned_toolchain}
    - {candidate: /home/tester/.elan/toolchains/leanprover--lean4---stable, reason: pinned_toolchain}
    - {candidate: /home/tester/.elan/toolchains/leanprover--lean4---v4.16.0, reason: pinned_toolchain}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /home/tester/.elan/toolchains/lean4-patched, reason: pinned_toolchain}
    - {candidate: /home/tester/.elan/toolchains/leanprover--lean4---stable, reason: pinned_toolchain}
    - {candidate: /home/tester/.elan/toolchains/leanprover--lean4---v4.16.0, reason: pinned_toolchain}
  preserved:
    - /home/tester/.elan/toolchains/lean4-patched/bin/lean
    - /home/tester/.elan/toolchains/leanprover--lean4---stable/bin/lean
    - /home/tester/.elan/toolchains/leanprover--lean4---v4.16.0/bin/lean
