# M counts pytest-05 (pytest's int() reads it) but not pytest-9x; neither is a
# session (row 1); the pytest-current symlink and garbage-x are no candidates.
profile_vector: 1
profile: pytest-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/python: {}
    /home/tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/other: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-1: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-2: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-3: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-4: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-05: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-9x: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/garbage-x: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-current: {symlink: pytest-4, mtime: 2026-10-05T03:00:00Z}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}]}
expect:
  plan:
    - {candidate: /tmp/pytest-of-tester/pytest-0}
    - {candidate: /tmp/pytest-of-tester/pytest-05, reason: filtered}
    - {candidate: /tmp/pytest-of-tester/pytest-1}
    - {candidate: /tmp/pytest-of-tester/pytest-2}
    - {candidate: /tmp/pytest-of-tester/pytest-3, reason: in_use}
    - {candidate: /tmp/pytest-of-tester/pytest-4, reason: in_use}
    - {candidate: /tmp/pytest-of-tester/pytest-9x, reason: filtered}
  reclaim_exit: 1
  actions: [/tmp/pytest-of-tester/pytest-0, /tmp/pytest-of-tester/pytest-1, /tmp/pytest-of-tester/pytest-2]
  removed: [/tmp/pytest-of-tester/pytest-0, /tmp/pytest-of-tester/pytest-1, /tmp/pytest-of-tester/pytest-2]
  skipped:
    - {candidate: /tmp/pytest-of-tester/pytest-05, reason: filtered}
    - {candidate: /tmp/pytest-of-tester/pytest-3, reason: in_use, process_blockers: [{pid: 500, evidence: temp_root}]}
    - {candidate: /tmp/pytest-of-tester/pytest-4, reason: in_use, process_blockers: [{pid: 500, evidence: temp_root}]}
    - {candidate: /tmp/pytest-of-tester/pytest-9x, reason: filtered}
  preserved:
    - /tmp/pytest-of-tester/pytest-05
    - /tmp/pytest-of-tester/pytest-3
    - /tmp/pytest-of-tester/pytest-4
    - /tmp/pytest-of-tester/pytest-9x
