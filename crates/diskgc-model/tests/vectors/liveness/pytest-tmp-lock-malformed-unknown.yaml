# Locks that are no pid marker: empty, a leading zero, two numbers, 17 bytes, not
# digits, a directory, a symlink (row 3).
profile_vector: 1
profile: pytest-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/python: {}
    /home/tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/other: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-05T03:00:00Z}, .lock: {content: "", mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-1: {.: {mtime: 2026-10-05T03:00:00Z}, .lock: {content: "0042", mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-2: {.: {mtime: 2026-10-05T03:00:00Z}, .lock: {content: "42 43", mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-3: {.: {mtime: 2026-10-05T03:00:00Z}, .lock: {content: "12345678901234567", mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-4: {.: {mtime: 2026-10-05T03:00:00Z}, .lock: {content: "abc", mtime: 2026-10-05T03:00:00Z}}
    /tmp/pytest-of-tester/pytest-5: {.: {mtime: 2026-10-05T03:00:00Z}, .lock: {.: {mtime: 2026-10-05T03:00:00Z}}}
    /tmp/pytest-of-tester/pytest-6: {.: {mtime: 2026-10-05T03:00:00Z}, .lock: {symlink: /tmp/x, mtime: 2026-10-05T03:00:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}]}
expect:
  plan:
    - {candidate: /tmp/pytest-of-tester/pytest-0, reason: producer_unknown}
    - {candidate: /tmp/pytest-of-tester/pytest-1, reason: producer_unknown}
    - {candidate: /tmp/pytest-of-tester/pytest-2, reason: producer_unknown}
    - {candidate: /tmp/pytest-of-tester/pytest-3, reason: producer_unknown}
    - {candidate: /tmp/pytest-of-tester/pytest-4, reason: producer_unknown}
    - {candidate: /tmp/pytest-of-tester/pytest-5, reason: producer_unknown}
    - {candidate: /tmp/pytest-of-tester/pytest-6, reason: producer_unknown}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/pytest-of-tester/pytest-0, reason: producer_unknown, process_blockers: []}
    - {candidate: /tmp/pytest-of-tester/pytest-1, reason: producer_unknown, process_blockers: []}
    - {candidate: /tmp/pytest-of-tester/pytest-2, reason: producer_unknown, process_blockers: []}
    - {candidate: /tmp/pytest-of-tester/pytest-3, reason: producer_unknown, process_blockers: []}
    - {candidate: /tmp/pytest-of-tester/pytest-4, reason: producer_unknown, process_blockers: []}
    - {candidate: /tmp/pytest-of-tester/pytest-5, reason: producer_unknown, process_blockers: []}
    - {candidate: /tmp/pytest-of-tester/pytest-6, reason: producer_unknown, process_blockers: []}
  preserved:
    - /tmp/pytest-of-tester/pytest-0
    - /tmp/pytest-of-tester/pytest-1
    - /tmp/pytest-of-tester/pytest-2
    - /tmp/pytest-of-tester/pytest-3
    - /tmp/pytest-of-tester/pytest-4
    - /tmp/pytest-of-tester/pytest-5
    - /tmp/pytest-of-tester/pytest-6
