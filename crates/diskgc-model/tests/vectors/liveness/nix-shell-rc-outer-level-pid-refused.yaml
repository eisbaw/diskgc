# A name recording the outer level of a namespaced process: every level
# counts.
profile_vector: 1
profile: nix-shell-rc
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-develop-3025375-1: {.: {mtime: 2026-10-01T00:00:00Z}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
    - {pid: 3025375, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}], nspid: [3025375, 9]}
expect:
  plan:
    - {candidate: /tmp/nix-develop-3025375-1, reason: in_use}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/nix-develop-3025375-1, reason: in_use, process_blockers: [{pid: 3025375, evidence: owner_pid}]}
  preserved: [/tmp/nix-develop-3025375-1]
