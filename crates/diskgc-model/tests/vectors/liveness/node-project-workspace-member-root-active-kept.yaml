# A workspace member's dependencies are judged by the whole workspace: the
# member packages/a is 60 days old, but the workspace root (package.json
# with workspaces) has src/x.js changed yesterday.
profile_vector: 1
profile: node-modules
roots: [/home/tester/w]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /home/tester/.bash_history: {size: 1K}
    /home/tester/w:
      .: {mtime: 2026-08-16T03:00:00Z}
      package.json: {content: "{\"name\": \"w\", \"private\": true, \"workspaces\": [\"packages/*\"]}", mtime: 2026-08-16T03:00:00Z}
      src:
        .: {mtime: 2026-08-16T03:00:00Z}
        x.js: {mtime: 2026-10-14T03:00:00Z, atime: 2026-08-16T03:00:00Z}
      packages:
        .: {mtime: 2026-08-16T03:00:00Z}
        a:
          .: {mtime: 2026-08-16T03:00:00Z}
          package.json: {content: "{\"name\": \"p\", \"version\": \"1.0.0\"}", mtime: 2026-08-16T03:00:00Z}
          index.js: {mtime: 2026-08-16T03:00:00Z}
          node_modules:
            .: {mtime: 2026-08-16T03:00:00Z}
            z.js: {mtime: 2026-08-16T03:00:00Z}
  processes:
    - {pid: 900, exe: /usr/bin/bash, cwd: /home/tester, maps: [/usr/bin/bash], environ: ["HOME=/home/tester"], fds: [{path: /usr/bin/bash}, {path: /home/tester/.bash_history}]}
expect:
  plan:
    - {candidate: /home/tester/w/packages/a/node_modules, reason: not_idle}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /home/tester/w/packages/a/node_modules, reason: not_idle}
  preserved: [/home/tester/w/packages/a/node_modules/z.js]
