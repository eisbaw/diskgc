# The execnet bootstrap is a pytest running: a young lockless session below the
# rank is not permitted by row 7; another process's relative TMPDIR leaves its
# root use undecidable (row 9) instead of row 11 permitting it.
profile_vector: 1
profile: pytest-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /usr/bin/python: {}
    /home/tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/other: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-14T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-1: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-2: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-3: {.: {mtime: 2026-10-05T03:00:00Z}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-4: {.: {mtime: 2026-10-05T03:00:00Z}}
  processes:
    - {pid: 43, exe: /usr/bin/python, cwd: /, maps: [/usr/bin/python], environ: ["HOME=/home/tester", "TMPDIR=/tmp/other"], fds: [{path: /usr/bin/python}], cmdline: ["python", "-u", "-c", "import sys;exec(eval(sys.stdin.readline()))"]}
    - {pid: 900, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: ["HOME=/home/tester", "TMPDIR=rel"], fds: [{path: /usr/bin/bash}]}
expect:
  plan:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0, reason: producer_unknown}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-1}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-2, reason: producer_unknown}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-3, reason: producer_unknown}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-4, reason: producer_unknown}
  reclaim_exit: 1
  actions: [/tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  removed: [/tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  skipped:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-0, reason: producer_unknown, process_blockers: [{pid: 900, evidence: unresolved_path}]}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-2, reason: producer_unknown, process_blockers: [{pid: 900, evidence: unresolved_path}]}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-3, reason: producer_unknown, process_blockers: [{pid: 900, evidence: unresolved_path}]}
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-4, reason: producer_unknown, process_blockers: [{pid: 900, evidence: unresolved_path}]}
  preserved:
    - /tmp/nix-shell.AB/pytest-of-tester/pytest-0
    - /tmp/nix-shell.AB/pytest-of-tester/pytest-2
    - /tmp/nix-shell.AB/pytest-of-tester/pytest-3
    - /tmp/nix-shell.AB/pytest-of-tester/pytest-4
