# A FUSE mount made in a candidate after planning: the walk under the lock
# reads the mount table again and refuses it (contains_mount); nothing on
# or below the mount is touched.
profile_vector: 1
profile: zephyr-tmp
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-a: {mnt: {.: {}}, f: {size: 4K}}
  events:
    - at: {op: flock, path: /tmp/zephyr-a, nth: 1, when: before}
      mount: {id: 9, at: /tmp/zephyr-a/mnt, fs: fuse.sshfs, dev: "0:77", size: 1G}
expect:
  plan:
    - {candidate: /tmp/zephyr-a}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/zephyr-a, reason: contains_mount}
  preserved: [/tmp/zephyr-a/f, /tmp/zephyr-a/mnt]
