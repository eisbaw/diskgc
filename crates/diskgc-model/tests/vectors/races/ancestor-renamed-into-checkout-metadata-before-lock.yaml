# TASK-165. The candidate's parent is renamed into a version-control
# checkout's metadata (.git) before the candidate lock. The checkout path
# rule (docs/safety.md, No source checkout) must judge the current path:
# changed, nothing removed.
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp/work"], "paths": ["p/zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/work/p/zephyr-scratch"]}}
profile: zephyr-tmp-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/work/p/zephyr-a: {f: {size: 4K}}
    /tmp/work/repo/.git/HEAD: {}
  events:
    - at: {op: flock, path: /tmp/work/p/zephyr-a, nth: 1, when: before}
      rename: {from: /tmp/work/p, to: /tmp/work/repo/.git/p}
expect:
  plan:
    - {candidate: /tmp/work/p/zephyr-a}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/work/p/zephyr-a, reason: changed}
  preserved: [/tmp/work/repo/.git/p/zephyr-a/f]
