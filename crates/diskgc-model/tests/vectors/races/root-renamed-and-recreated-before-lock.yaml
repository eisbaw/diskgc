# TASK-165. The configured root itself is renamed away (taking the
# candidate with it) and a new, empty directory made at its name before
# the candidate lock: the root path resolves, but to another directory, so
# the candidate is no longer below its root. changed, nothing removed.
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp/work"], "paths": ["p/zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/work/p/zephyr-scratch"]}}
profile: zephyr-tmp-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/work/p/zephyr-a: {f: {size: 4K}}
  events:
    - at: {op: flock, path: /tmp/work/p/zephyr-a, nth: 1, when: before}
      rename: {from: /tmp/work, to: /tmp/old-work}
    - at: {op: flock, path: /tmp/work/p/zephyr-a, nth: 1, when: before}
      mkdir: /tmp/work
expect:
  plan:
    - {candidate: /tmp/work/p/zephyr-a}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/work/p/zephyr-a, reason: changed}
  preserved: [/tmp/old-work/p/zephyr-a/f]
