# `zephyr-tmp-probe`: user profile with the matching set of a built-in withdrawn in TASK-122.
# Linux has no unlink-by-inode: an entry replaced after the identity check
# and before the unlink is deleted in its place (PRD, Limits: not a defence
# against a hostile local user). Pinned so the limit stays visible.
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
profile: zephyr-tmp-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-a: {f: {size: 4K}}
  events:
    - at: {op: unlinkat, path: /tmp/zephyr-a/f, nth: 1, when: before}
      replace: /tmp/zephyr-a/f
expect:
  plan:
    - {candidate: /tmp/zephyr-a}
  reclaim_exit: 1
  actions: [/tmp/zephyr-a]
  removed: [/tmp/zephyr-a]
  skipped: []
  preserved: []
