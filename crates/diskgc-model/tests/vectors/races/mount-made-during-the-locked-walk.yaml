# `zephyr-tmp-probe`: user profile with the matching set of a built-in withdrawn in TASK-122.
# A mount made after the mount table was read under the candidate lock,
# while the walk lists the candidate: only the walk's own per-entry mount
# id check sees it (docs/safety.md, Before the walk: the walk reads the
# table before statting anything, and compares every entry's mount).
# The candidate's second listing in reclaim is the locked walk's.
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp"], "paths": ["zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/zephyr-scratch"]}}
profile: zephyr-tmp-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/zephyr-a: {mnt: {.: {}}, f: {size: 4K}}
  events:
    - at: {op: read_dir, path: /tmp/zephyr-a, nth: 2, when: before}
      mount: {id: 9, at: /tmp/zephyr-a/mnt, fs: tmpfs, dev: "0:77", size: 1G}
expect:
  plan:
    - {candidate: /tmp/zephyr-a}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/zephyr-a, reason: contains_mount}
  preserved: [/tmp/zephyr-a/f, /tmp/zephyr-a/mnt]
