# TASK-165. As ancestor-renamed-under-keep-marker-before-lock, but the
# parent is renamed while the locked eligibility walk lists the candidate
# (its third listing; the synchronous tally's sizing and the candidate's
# tally list it first), after step 4's place and
# keep-marker recheck: the recheck right before the deletion (after the
# in-use check) must find the path changed. Nothing removed.
profile_vector: 1
user_profiles:
  - {"name": "zephyr-tmp-probe", "find": {"roots": ["/tmp/work"], "paths": ["p/zephyr-*"], "type": "dir"}, "action": "delete", "examples": {"match": ["/tmp/work/p/zephyr-scratch"]}}
profile: zephyr-tmp-probe
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /tmp/work/p/zephyr-a: {f: {size: 4K}}
    /tmp/work/keep/.diskgc-keep: {}
  events:
    - at: {op: read_dir, path: /tmp/work/p/zephyr-a, nth: 3, when: after}
      rename: {from: /tmp/work/p, to: /tmp/work/keep/p}
expect:
  plan:
    - {candidate: /tmp/work/p/zephyr-a}
  reclaim_exit: 1
  actions: []
  removed: []
  skipped:
    - {candidate: /tmp/work/p/zephyr-a, reason: changed}
  preserved: [/tmp/work/keep/p/zephyr-a/f, /tmp/work/keep/.diskgc-keep]
