# TASK-367: cmake-build-anchored never takes a build directory inside
# another build system's managed tree. Refused by (a), stamps in the
# parent or up to three directories above it, never above the root:
# Buildroot's .stamp_* (also three up, a package SUBDIR two deep) and
# OpenWrt's .configured_<hash>, .built and .prepared_<hash>. Refused by
# (b), a recognised build root anywhere above: a Buildroot output
