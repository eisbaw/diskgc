# No Cargo lock file is ever deleted (PRD, What bad looks like), whatever
# its depth in a profile directory (TASK-167). A `.cargo-*lock*` name below
# a profile directory's top level, known or unknown, is no lock file the
# protocol takes, so the walk refuses the target (`contains_special`)
# instead of recording and unlinking it. `.cargo-unit-lock` in
# `build/<package>/<hash>/` is hypothetical (no measured Cargo makes it):
# a Cargo with finer-grained locks of this pattern leaves its targets
# whole rather than losing a held lock. The `plain` target, the same shape
# without such a name, is reclaimed. An unknown name directly in the
# profile directory stays `unsupported_layout` (cargo-target-layouts).
profile_vector: 1
profile: cargo-target
roots: [/home/tester/src]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /home/tester/src/unit-lock/Cargo.toml: {}
    /home/tester/src/unit-lock/target:
      CACHEDIR.TAG: {cachedir_tag: true}
      debug:
        .cargo-build-lock: {}
        .cargo-lock: {}
        .cargo-artifact-lock: {}
        build: {app: {abc123: {.cargo-unit-lock: {}, fingerprint: {f: {}}, out: {app: {size: 1M}}}}}
    /home/tester/src/fingerprint-lock/Cargo.toml: {}
    /home/tester/src/fingerprint-lock/target:
      CACHEDIR.TAG: {cachedir_tag: true}
      debug: {.cargo-lock: {}, .fingerprint: {app-1: {.cargo-lock.bak: {}}}, deps: {app: {size: 1M}}}
    /home/tester/src/known-deep/Cargo.toml: {}
    /home/tester/src/known-deep/target:
      CACHEDIR.TAG: {cachedir_tag: true}
      debug: {.cargo-lock: {}, .fingerprint: {app-1: {}}, deps: {.cargo-lock: {}, app: {size: 1M}}}
    /home/tester/src/plain/Cargo.toml: {}
    /home/tester/src/plain/target:
      CACHEDIR.TAG: {cachedir_tag: true}
      debug: {.cargo-lock: {}, .fingerprint: {app-1: {.cargo-ok: {}}}, deps: {app: {size: 1M}}}
expect:
  plan:
    - {candidate: /home/tester/src/fingerprint-lock/target, reason: contains_special}
    - {candidate: /home/tester/src/known-deep/target, reason: contains_special}
    - {candidate: /home/tester/src/plain/target}
    - {candidate: /home/tester/src/unit-lock/target, reason: contains_special}
  reclaim_exit: 1
  actions: [/home/tester/src/plain/target]
  removed: [/home/tester/src/plain/target/debug/deps, /home/tester/src/plain/target/debug/.fingerprint]
  skipped:
    - {candidate: /home/tester/src/fingerprint-lock/target, reason: contains_special}
    - {candidate: /home/tester/src/known-deep/target, reason: contains_special}
    - {candidate: /home/tester/src/unit-lock/target, reason: contains_special}
  preserved:
    - /home/tester/src/unit-lock/target/debug/build/app/abc123/.cargo-unit-lock
    - /home/tester/src/unit-lock/target/debug/build/app/abc123/fingerprint/f
    - /home/tester/src/unit-lock/target/debug/build/app/abc123/out/app
    - /home/tester/src/fingerprint-lock/target/debug/.fingerprint/app-1/.cargo-lock.bak
    - /home/tester/src/fingerprint-lock/target/debug/deps/app
    - /home/tester/src/known-deep/target/debug/deps/.cargo-lock
    - /home/tester/src/known-deep/target/debug/deps/app
    - /home/tester/src/plain/target/debug/.cargo-lock
    - /home/tester/src/plain/target/CACHEDIR.TAG
