# cargo-registry-src (TASK-40, pending Mark's admission): one candidate per
# extracted crate, `.cargo/registry/src/<registry>/<crate>-<version>` below a
# supplied home root, and only one Cargo finished extracting (a regular
# `.cargo-ok`). One per role: match, in use (a rustc reading a source),
# negated, keep marker, fresh (the one-hour floor), and an interrupted
# extraction without `.cargo-ok` (never a candidate). The downloaded
# `.crate` files Cargo extracts again from, the index, installed binaries
# and Cargo's cache lock files are never candidates.
