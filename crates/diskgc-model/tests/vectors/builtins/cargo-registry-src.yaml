user_profiles:
  - {"name": "pin", "find": {"roots": ["/home/tester"], "paths": [".cargo/registry/src/index.crates.io-0123456789abcdef/pinned-1.0.0"], "type": "any"}, "action": "delete", "examples": {"match": ["/home/tester/.cargo/registry/src/index.crates.io-0123456789abcdef/pinned-1.0.0"]}}
select: "profile:cargo-registry-src && !profile:pin"
roots: ["/home/tester"]
path: /home
min_free: 100%
