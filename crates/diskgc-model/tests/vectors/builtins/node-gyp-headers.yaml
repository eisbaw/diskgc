# node-gyp-headers (TASK-40, pending Mark's admission): one candidate per
# Node.js header version that node-gyp finished installing (a regular
# `installVersion`) in its default dev directory below a supplied home
# root. One per role: match, in use (a compiler reading a header), negated,
# keep marker, fresh (the one-hour floor), and a directory without
# `installVersion` (not node-gyp's, or an install in progress), which is
# never a candidate. Nor is a regular file beside the versions.
profile_vector: 1
user_profiles:
  - {"name": "pin", "find": {"roots": ["/home/tester"], "paths": [".cache/node-gyp/18.20.0"], "type": "any"}, "action": "delete", "examples": {"match": ["/home/tester/.cache/node-gyp/18.20.0"]}}
select: "profile:node-gyp-headers && !profile:pin"
roots: ["/home/tester"]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
