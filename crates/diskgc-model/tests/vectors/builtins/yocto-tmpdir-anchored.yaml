        stamps: {.: {mtime: 2026-10-01T00:00:00Z}}
        work: {.: {mtime: 2026-10-01T00:00:00Z}, precious: {size: 8K, mtime: 2026-10-01T00:00:00Z}}
    /home/tester/src/fresh:
