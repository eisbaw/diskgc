    /home/tester/src/inconf:
      conf:
        .: {mtime: 2026-10-01T00:00:00Z}
        local.conf: {content: "MACHINE ??= \"qemux86-64\"\n", mtime: 2026-10-01T00:00:00Z}
        bblayers.conf: {content: "BBLAYERS ?= \"/home/tester/src/poky/meta\"\n", mtime: 2026-10-01T00:00:00Z}
        saved_tmpdir: {content: /home/tester/src/inconf/conf, mtime: 2026-10-01T00:00:00Z}
        abi_version: {content: "15\n", mtime: 2026-10-01T00:00:00Z}
        stamps: {.: {mtime: 2026-10-01T00:00:00Z}}
        work: {.: {mtime: 2026-10-01T00:00:00Z}, precious: {size: 8K, mtime: 2026-10-01T00:00:00Z}}
    /home/tester/src/required:
      conf:
        local.conf: {content: "MACHINE ??= \"qemux86-64\"\n"}
        bblayers.conf: {content: "BBLAYERS ?= \"/home/tester/src/poky/meta\"\nrequire conf/bsp-layers.conf\n"}
        bsp-layers.conf: {content: "BBLAYERS += \"/home/tester/src/meta-private-gone\"\n"}
      tmp:
        .: {mtime: 2026-10-01T00:00:00Z}
        saved_tmpdir: {content: /home/tester/src/required/tmp, mtime: 2026-10-01T00:00:00Z}
