    /home/tester/src/checkout:
      conf:
        local.conf: {content: "MACHINE ??= \"qemux86-64\"\n"}
        bblayers.conf: {content: "BBLAYERS ?= \"/home/tester/src/poky/meta\"\n"}
      tmp:
        .: {mtime: 2026-10-01T00:00:00Z}
        saved_tmpdir: {content: /home/tester/src/checkout/tmp, mtime: 2026-10-01T00:00:00Z}
        abi_version: {content: "15\n", mtime: 2026-10-01T00:00:00Z}
        stamps: {.: {mtime: 2026-10-01T00:00:00Z}}
        work:
          .: {mtime: 2026-10-01T00:00:00Z}
