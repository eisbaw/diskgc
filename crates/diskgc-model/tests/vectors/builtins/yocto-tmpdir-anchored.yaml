    - {candidate: /home/tester/src/fresh/tmp, reason: not_idle, source: /home/tester/src/fresh}
    - {candidate: /home/tester/src/y1/tmp, source: /home/tester/src/y1}
    - {candidate: /home/tester/src/y2/tmp-glibc, source: /home/tester/src/y2}
    - {candidate: /home/tester/src/y3/tmp, reason: in_use, source: /home/tester/src/y3}
    - {candidate: /home/tester/src/y4/tmp, reason: excluded, source: /home/tester/src/y4}
  dry_run_report:
