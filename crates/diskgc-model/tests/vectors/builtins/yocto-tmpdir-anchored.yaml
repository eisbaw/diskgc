      - {candidate: /home/tester/src/y1/tmp, build_evidence: {marker: saved_tmpdir, source: /home/tester/src/y1, idle_age_seconds: 1220400}}
      - {candidate: /home/tester/src/y2/tmp-glibc, build_evidence: {marker: saved_tmpdir, source: /home/tester/src/y2, idle_age_seconds: 1220400}}
