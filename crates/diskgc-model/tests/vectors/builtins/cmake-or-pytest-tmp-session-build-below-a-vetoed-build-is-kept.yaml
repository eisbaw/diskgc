# TASK-367, the sixth review's H1: in `cmake-build-anchored || pytest-tmp`,
# pytest-of-tester is a CMake build in OpenWrt's tree (`.built` in its
# parent): cmake vetoes it and does not enter it. pytest-0 below it is a
# CMake build too, found only by pytest-tmp; before the fix only the
# vetoed identity was kept, so pytest-tmp deleted pytest-0. The guard is
# the selection's: pytest-tmp's discovery asks it of pytest-0, which
# holds a build marker, and its own climb finds the stamp. pytest-1, a
# plain session inside the vetoed build, holds no build: the guard keeps
# builds, so it is pytest-tmp's to judge and is reclaimed, as without the
# guard (docs/safety.md, Not covered).
profile_vector: 1
select: profile:cmake-build-anchored || profile:pytest-tmp
roots: [/tmp]
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /tmp, fs: tmpfs, dev: "0:40", size: 4G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/bash: {}
    /tmp/nix-shell.AB: {.: {mtime: 2026-10-01T00:00:00Z}, .built: {mtime: 2026-10-01T00:00:00Z}, CMakeLists.txt: {mtime: 2026-10-01T00:00:00Z, content: "project(p)\n"}}
    /tmp/nix-shell.AB/pytest-of-tester: {.: {mtime: 2026-10-01T00:00:00Z}, CMakeCache.txt: {mtime: 2026-10-01T00:00:00Z, content: "CMAKE_HOME_DIRECTORY:INTERNAL=/tmp/nix-shell.AB\n"}, CMakeFiles: {.: {mtime: 2026-10-01T00:00:00Z}}, top.o: {mtime: 2026-10-01T00:00:00Z, size: 8K}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-0: {.: {mtime: 2026-10-01T00:00:00Z}, CMakeCache.txt: {mtime: 2026-10-01T00:00:00Z, content: "CMAKE_HOME_DIRECTORY:INTERNAL=/tmp/nix-shell.AB\n"}, CMakeFiles: {.: {mtime: 2026-10-01T00:00:00Z}}, a.o: {mtime: 2026-10-01T00:00:00Z, size: 8K}}
    /tmp/nix-shell.AB/pytest-of-tester/pytest-1: {.: {mtime: 2026-10-01T00:00:00Z}, test_a0: {.: {mtime: 2026-10-01T00:00:00Z}, f: {mtime: 2026-10-01T00:00:00Z}}}
  processes:
    - {pid: 500, exe: /usr/bin/bash, cwd: /, maps: [/usr/bin/bash], environ: [HOME=/home/tester], fds: [{path: /usr/bin/bash}]}
expect:
  plan:
    - {candidate: /tmp/nix-shell.AB/pytest-of-tester/pytest-1}
  reclaim_exit: 1
  actions: [/tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  removed: [/tmp/nix-shell.AB/pytest-of-tester/pytest-1]
  skipped: []
  preserved: [/tmp/nix-shell.AB/pytest-of-tester/top.o, /tmp/nix-shell.AB/pytest-of-tester/pytest-0/a.o]
