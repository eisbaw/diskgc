# Source-anchored Meson output, past the 3-day floor: one deleted, one in
# use, one excluded by a negated profile.
# KNOWN DEFECT (TASK-128): a selection with `!profile:` plans through the
# union path, which drops build_evidence, so these rows carry no source:
# although the docs promise one. Add source: when TASK-128 is fixed.
profile_vector: 1
user_profiles:
  - name: pin
    find: {roots: [/home/tester/src], paths: [p3/out], type: dir}
    action: delete
    examples: {match: [/home/tester/src/p3/out]}
select: profile:meson-build-anchored && !profile:pin
roots: [/home/tester/src]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/tool: {mode: "0755"}
    /home/tester/src/p1/meson.build: {content: "project('p1')\n"}
    /home/tester/src/p1/out: {.: {mtime: 2026-10-01T00:00:00Z}, build.ninja: {mtime: 2026-10-01T00:00:00Z}, meson-private: {.: {mtime: 2026-10-01T00:00:00Z}, coredata.dat: {content: coredata, mtime: 2026-10-01T00:00:00Z}}, meson-info: {.: {mtime: 2026-10-01T00:00:00Z}, meson-info.json: {content: '{"directories":{"source":"/home/tester/src/p1","build":"/home/tester/src/p1/out","info":"/home/tester/src/p1/out/meson-info"},"error":false}', mtime: 2026-10-01T00:00:00Z}}, a.o: {size: 8K, mtime: 2026-10-01T00:00:00Z}}
    /home/tester/src/p2/meson.build: {content: "project('p2')\n"}
    /home/tester/src/p2/out: {.: {mtime: 2026-10-01T00:00:00Z}, build.ninja: {mtime: 2026-10-01T00:00:00Z}, meson-private: {.: {mtime: 2026-10-01T00:00:00Z}, coredata.dat: {content: coredata, mtime: 2026-10-01T00:00:00Z}}, meson-info: {.: {mtime: 2026-10-01T00:00:00Z}, meson-info.json: {content: '{"directories":{"source":"/home/tester/src/p2","build":"/home/tester/src/p2/out","info":"/home/tester/src/p2/out/meson-info"},"error":false}', mtime: 2026-10-01T00:00:00Z}}, a.o: {size: 8K, mtime: 2026-10-01T00:00:00Z}}
    /home/tester/src/p3/meson.build: {content: "project('p3')\n"}
    /home/tester/src/p3/out: {.: {mtime: 2026-10-01T00:00:00Z}, build.ninja: {mtime: 2026-10-01T00:00:00Z}, meson-private: {.: {mtime: 2026-10-01T00:00:00Z}, coredata.dat: {content: coredata, mtime: 2026-10-01T00:00:00Z}}, meson-info: {.: {mtime: 2026-10-01T00:00:00Z}, meson-info.json: {content: '{"directories":{"source":"/home/tester/src/p3","build":"/home/tester/src/p3/out","info":"/home/tester/src/p3/out/meson-info"},"error":false}', mtime: 2026-10-01T00:00:00Z}}, a.o: {size: 8K, mtime: 2026-10-01T00:00:00Z}}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool, /home/tester/src/p2/out/a.o], environ: [HOME=/home/tester], fds: [{path: /usr/bin/tool}]}
expect:
  plan:
    - {candidate: /home/tester/src/p1/out}
    - {candidate: /home/tester/src/p2/out, reason: in_use}
    - {candidate: /home/tester/src/p3/out, reason: excluded}
  reclaim_exit: 1
  actions: [/home/tester/src/p1/out]
  removed: [/home/tester/src/p1/out]
  skipped:
    - {candidate: /home/tester/src/p2/out, reason: in_use, process_blockers: [{pid: 901, evidence: map}]}
    - {candidate: /home/tester/src/p3/out, reason: excluded}
  preserved: [/home/tester/src/p1/meson.build, /home/tester/src/p2/out/a.o, /home/tester/src/p3/out/a.o]
