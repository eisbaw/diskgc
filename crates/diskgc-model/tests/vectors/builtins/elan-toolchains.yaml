    - /home/tester/.elan/toolchains/leanprover--lean4---v4.19.0/bin/lean
    - /home/tester/.elan/toolchains/leanprover--lean4---v4.20.0/bin/lean
    - /home/tester/.elan/toolchains/leanprover--lean4---v4.30.0-rc1/bin/lean
    - /home/tester/.elan/tmp/staging
