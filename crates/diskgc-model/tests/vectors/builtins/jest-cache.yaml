# jest-cache below its fixed root, one candidate per role.
profile_vector: 1
user_profiles:
  - {"name": "pin", "find": {"roots": ["/tmp"], "paths": ["nix-shell.Q/jest_app"], "type": "any"}, "action": "delete", "examples": {"match": ["/tmp/nix-shell.Q/jest_app"]}}
select: "profile:jest-cache && !profile:pin"
path: /tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/pip: {mode: "0755"}
    /usr/bin/uv: {mode: "0755"}
    /usr/bin/env: {mode: "0755"}
    /usr/bin/go: {mode: "0755"}
    /usr/bin/npm: {mode: "0755"}
    /usr/bin/pnpm: {mode: "0755"}
    /usr/bin/yarn: {mode: "0755"}
    /usr/bin/ccache: {mode: "0755"}
    /usr/bin/jest: {mode: "0755"}
    /usr/bin/pio: {mode: "0755"}
    /usr/bin/tool: {mode: "0755"}
    "/var/tmp": {".": {}}
    "/tmp/jest_rs": {"payload": {"size": "8K"}}
    "/tmp/jest_project_abc": {"payload": {"size": "8K"}}
    "/tmp/nix-shell.Q/jest_app": {"payload": {"size": "8K"}}
    "/tmp/jest_x": {"payload": {"size": "8K"}, ".diskgc-keep": {}}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: "/tmp/jest_project_abc/payload"}]}
expect:
  plan:
    - {candidate: "/tmp/jest_rs"}
    - {candidate: "/tmp/jest_project_abc", reason: in_use}
    - {candidate: "/tmp/nix-shell.Q/jest_app", reason: excluded}
    - {candidate: "/tmp/jest_x", reason: keep_marker}
  reclaim_exit: 1
  actions: ["/tmp/jest_rs"]
  removed: []
  skipped:
    - {candidate: "/tmp/jest_project_abc", reason: in_use, process_blockers: [{pid: 901, evidence: fd}]}
    - {candidate: "/tmp/nix-shell.Q/jest_app", reason: excluded}
    - {candidate: "/tmp/jest_x", reason: keep_marker}
  preserved: ["/tmp/jest_project_abc/payload", "/tmp/nix-shell.Q/jest_app/payload", "/tmp/jest_x/payload", "/tmp/jest_rs/payload"]
  commands:
    - {"cwd": "/tmp", "argv": ["/usr/bin/jest", "--config", "{}", "--cacheDirectory", "/tmp/jest_rs", "--clearCache"]}
