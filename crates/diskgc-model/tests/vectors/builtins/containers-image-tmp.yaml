# containers-image-tmp below /var/tmp, past its 3-day floor, one candidate
# per role.
profile_vector: 1
config: |
  version: 1
  profiles:
    - {"name": "pin", "find": {"roots": ["/var/tmp"], "paths": ["container_images_storage333"], "type": "any"}, "action": "delete", "examples": {"match": ["/var/tmp/container_images_storage333"]}}
  protect: [pin]
  groups:
    - name: g
      tiers:
        - {"name": "t", "select": "profile:containers-image-tmp"}
select: "profile:containers-image-tmp"
path: /var/tmp
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /var/tmp, fs: ext4, dev: "254:3", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/pip: {mode: "0755"}
    /usr/bin/uv: {mode: "0755"}
    /usr/bin/env: {mode: "0755"}
    /usr/bin/go: {mode: "0755"}
    /usr/bin/npm: {mode: "0755"}
    /usr/bin/pnpm: {mode: "0755"}
    /usr/bin/yarn: {mode: "0755"}
    /usr/bin/ccache: {mode: "0755"}
    /usr/bin/jest: {mode: "0755"}
    /usr/bin/pio: {mode: "0755"}
    /usr/bin/tool: {mode: "0755"}
    "/var/tmp/buildah111": {"payload": {"size": "8K", "mtime": "2026-08-01T00:00:00Z"}, ".": {"mtime": "2026-08-01T00:00:00Z"}}
    "/var/tmp/buildah222": {"payload": {"size": "8K", "mtime": "2026-08-01T00:00:00Z"}, ".": {"mtime": "2026-08-01T00:00:00Z"}}
    "/var/tmp/container_images_storage333": {"payload": {"size": "8K", "mtime": "2026-08-01T00:00:00Z"}, ".": {"mtime": "2026-08-01T00:00:00Z"}}
    "/var/tmp/container_images_storage444": {"payload": {"size": "8K", "mtime": "2026-08-01T00:00:00Z"}, ".": {"mtime": "2026-08-01T00:00:00Z"}, ".diskgc-keep": {"mtime": "2026-08-01T00:00:00Z"}}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: "/var/tmp/buildah222/payload"}]}
expect:
  plan:
    - {candidate: "/var/tmp/buildah111"}
    - {candidate: "/var/tmp/buildah222", reason: in_use}
    - {candidate: "/var/tmp/container_images_storage333", reason: protected}
    - {candidate: "/var/tmp/container_images_storage444", reason: kept}
  reclaim_exit: 1
  actions: ["/var/tmp/buildah111"]
  removed: ["/var/tmp/buildah111"]
  skipped:
    - {candidate: "/var/tmp/buildah222", reason: in_use, process_blockers: [{pid: 901, evidence: fd}]}
    - {candidate: "/var/tmp/container_images_storage333", reason: protected}
    - {candidate: "/var/tmp/container_images_storage444", reason: kept}
  preserved: ["/var/tmp/buildah222/payload", "/var/tmp/container_images_storage333/payload", "/var/tmp/container_images_storage444/payload"]
