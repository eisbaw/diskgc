# chrome-browser-cache: the default and a numbered profile's caches; the
# browser is not running (its config directory holds no SingletonLock);
# one candidate per role.
profile_vector: 1
config: |
  version: 1
  profiles:
    - {"name": "pin", "find": {"roots": ["/home"], "paths": ["tester/.cache/google-chrome/Profile 1/Cache"], "type": "any"}, "action": "delete", "examples": {"match": ["/home/tester/.cache/google-chrome/Profile 1/Cache"]}}
  protect: [pin]
  groups:
    - name: g
      tiers:
        - {"name": "t", "select": "profile:chrome-browser-cache", "roots": ["/home/tester"]}
select: "profile:chrome-browser-cache"
roots: ["/home/tester"]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/pip: {mode: "0755"}
    /usr/bin/uv: {mode: "0755"}
    /usr/bin/env: {mode: "0755"}
    /usr/bin/go: {mode: "0755"}
    /usr/bin/npm: {mode: "0755"}
    /usr/bin/pnpm: {mode: "0755"}
    /usr/bin/yarn: {mode: "0755"}
    /usr/bin/ccache: {mode: "0755"}
    /usr/bin/jest: {mode: "0755"}
    /usr/bin/pio: {mode: "0755"}
    /usr/bin/tool: {mode: "0755"}
    "/home/tester/.config/google-chrome": {".": {}}
    "/home/tester/.cache/google-chrome/Default/Cache": {"payload": {"size": "8K"}}
    "/home/tester/.cache/google-chrome/Default/Code Cache": {"payload": {"size": "8K"}}
    "/home/tester/.cache/google-chrome/Profile 1/Cache": {"payload": {"size": "8K"}}
    "/home/tester/.cache/google-chrome/Profile 1/Code Cache": {"payload": {"size": "8K"}, ".diskgc-keep": {}}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: "/home/tester/.cache/google-chrome/Default/Code Cache/payload"}]}
expect:
  plan:
    - {candidate: "/home/tester/.cache/google-chrome/Default/Cache"}
    - {candidate: "/home/tester/.cache/google-chrome/Default/Code Cache", reason: in_use}
    - {candidate: "/home/tester/.cache/google-chrome/Profile 1/Cache", reason: protected}
    - {candidate: "/home/tester/.cache/google-chrome/Profile 1/Code Cache", reason: keep_marker}
  reclaim_exit: 1
  actions: ["/home/tester/.cache/google-chrome/Default/Cache"]
  removed: ["/home/tester/.cache/google-chrome/Default/Cache"]
  skipped:
    - {candidate: "/home/tester/.cache/google-chrome/Default/Code Cache", reason: in_use, process_blockers: [{pid: 901, evidence: fd}]}
    - {candidate: "/home/tester/.cache/google-chrome/Profile 1/Cache", reason: protected}
    - {candidate: "/home/tester/.cache/google-chrome/Profile 1/Code Cache", reason: keep_marker}
  preserved: ["/home/tester/.cache/google-chrome/Default/Code Cache/payload", "/home/tester/.cache/google-chrome/Profile 1/Cache/payload", "/home/tester/.cache/google-chrome/Profile 1/Code Cache/payload"]
