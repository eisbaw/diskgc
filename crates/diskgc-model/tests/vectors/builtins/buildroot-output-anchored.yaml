      - {candidate: /home/tester/src/b1/output, build_evidence: {marker: .br2-external.mk, source: /home/tester/src/b1, idle_age_seconds: 1220400}}
      - {candidate: /home/tester/src/b3/output, build_evidence: {marker: .br2-external.mk, source: /home/tester/src/b3, idle_age_seconds: null}}
      - {candidate: /home/tester/src/b4/output, build_evidence: {marker: .br2-external.mk, source: /home/tester/src/b4, idle_age_seconds: null}}
      - {candidate: /home/tester/src/checkout/output, build_evidence: {marker: .br2-external.mk, source: /home/tester/src/checkout, idle_age_seconds: null}}
