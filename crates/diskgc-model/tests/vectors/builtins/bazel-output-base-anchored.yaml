    - /home/tester/.cache/bazel/_bazel_tester/22222222222222222222222222222222
  skipped:
    - {candidate: /home/tester/.cache/bazel/_bazel_tester/33333333333333333333333333333333, reason: in_use, process_blockers: [{pid: 901, evidence: fd}]}
    - {candidate: /home/tester/.cache/bazel/_bazel_tester/44444444444444444444444444444444, reason: excluded}
    - {candidate: /home/tester/.cache/bazel/_bazel_tester/88888888888888888888888888888888, reason: contains_checkout}
    - {candidate: /home/tester/.cache/bazel/_bazel_tester/99999999999999999999999999999999, reason: not_idle}
  preserved:
