    - /home/tester/.cache/bazel/_bazel_tester/cache/repos/v1/content_addressable/blob
    - /home/tester/.cache/bazel/_bazel_tester/install/0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a/A-server.jar
