# xdg-cache-entry-v2's top-level entries, past 30 days; huggingface is
# excluded by the profile.
profile_vector: 1
user_profiles:
  - {"name": "pin", "find": {"roots": ["/home"], "paths": ["tester/.cache/fontconfig"], "type": "any"}, "action": "delete", "examples": {"match": ["/home/tester/.cache/fontconfig"]}}
select: "profile:xdg-cache-entry-v2 && !profile:pin"
roots: ["/home/tester/.cache"]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/pip: {mode: "0755"}
    /usr/bin/uv: {mode: "0755"}
    /usr/bin/env: {mode: "0755"}
    /usr/bin/go: {mode: "0755"}
    /usr/bin/npm: {mode: "0755"}
    /usr/bin/pnpm: {mode: "0755"}
    /usr/bin/yarn: {mode: "0755"}
    /usr/bin/ccache: {mode: "0755"}
    /usr/bin/jest: {mode: "0755"}
    /usr/bin/pio: {mode: "0755"}
    /usr/bin/tool: {mode: "0755"}
    "/home/tester/.cache/huggingface": {"model": {"size": "8K", "mtime": "2026-08-01T00:00:00Z"}, ".": {"mtime": "2026-08-01T00:00:00Z"}}
    "/home/tester/.cache/nix-index": {"payload": {"size": "8K", "mtime": "2026-08-01T00:00:00Z"}, ".": {"mtime": "2026-08-01T00:00:00Z"}}
    "/home/tester/.cache/thumbnails": {"payload": {"size": "8K", "mtime": "2026-08-01T00:00:00Z"}, ".": {"mtime": "2026-08-01T00:00:00Z"}}
    "/home/tester/.cache/fontconfig": {"payload": {"size": "8K", "mtime": "2026-08-01T00:00:00Z"}, ".": {"mtime": "2026-08-01T00:00:00Z"}}
    "/home/tester/.cache/vim": {"payload": {"size": "8K", "mtime": "2026-08-01T00:00:00Z"}, ".": {"mtime": "2026-08-01T00:00:00Z"}, ".git": {"HEAD": {"mtime": "2026-08-01T00:00:00Z"}, ".": {"mtime": "2026-08-01T00:00:00Z"}}}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: "/home/tester/.cache/thumbnails/payload"}]}
expect:
  plan:
    - {candidate: "/home/tester/.cache/nix-index"}
    - {candidate: "/home/tester/.cache/thumbnails", reason: in_use}
    - {candidate: "/home/tester/.cache/fontconfig", reason: excluded}
    - {candidate: "/home/tester/.cache/vim", reason: contains_checkout}
  reclaim_exit: 1
  actions: ["/home/tester/.cache/nix-index"]
  removed: ["/home/tester/.cache/nix-index"]
  skipped:
    - {candidate: "/home/tester/.cache/thumbnails", reason: in_use, process_blockers: [{pid: 901, evidence: fd}]}
    - {candidate: "/home/tester/.cache/fontconfig", reason: excluded}
    - {candidate: "/home/tester/.cache/vim", reason: contains_checkout}
  preserved: ["/home/tester/.cache/thumbnails/payload", "/home/tester/.cache/fontconfig/payload", "/home/tester/.cache/vim/payload", "/home/tester/.cache/huggingface/model"]
