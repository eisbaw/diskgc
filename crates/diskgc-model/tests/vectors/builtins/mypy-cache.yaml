# mypy-cache (tagged with CACHEDIR.TAG) in a project tree, one candidate
# per role.
profile_vector: 1
user_profiles:
  - {"name": "pin", "find": {"roots": ["/home"], "paths": ["tester/src/app/pkg/.mypy_cache"], "type": "any"}, "action": "delete", "examples": {"match": ["/home/tester/src/app/pkg/.mypy_cache"]}}
select: "profile:mypy-cache && !profile:pin"
roots: ["/home/tester/src"]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/pip: {mode: "0755"}
    /usr/bin/uv: {mode: "0755"}
    /usr/bin/env: {mode: "0755"}
    /usr/bin/go: {mode: "0755"}
    /usr/bin/npm: {mode: "0755"}
    /usr/bin/pnpm: {mode: "0755"}
    /usr/bin/yarn: {mode: "0755"}
    /usr/bin/ccache: {mode: "0755"}
    /usr/bin/jest: {mode: "0755"}
    /usr/bin/pio: {mode: "0755"}
    /usr/bin/tool: {mode: "0755"}
    "/home/tester/src/app/.mypy_cache": {"payload": {"size": "8K"}, "CACHEDIR.TAG": {"cachedir_tag": true}}
    "/home/tester/src/lib/.mypy_cache": {"payload": {"size": "8K"}, "CACHEDIR.TAG": {"cachedir_tag": true}}
    "/home/tester/src/app/pkg/.mypy_cache": {"payload": {"size": "8K"}, "CACHEDIR.TAG": {"cachedir_tag": true}}
    "/home/tester/src/lib/pkg/.mypy_cache": {"payload": {"size": "8K"}, "CACHEDIR.TAG": {"cachedir_tag": true}, ".diskgc-keep": {}}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: "/home/tester/src/lib/.mypy_cache/payload"}]}
expect:
  plan:
    - {candidate: "/home/tester/src/app/.mypy_cache"}
    - {candidate: "/home/tester/src/lib/.mypy_cache", reason: in_use}
    - {candidate: "/home/tester/src/app/pkg/.mypy_cache", reason: excluded}
    - {candidate: "/home/tester/src/lib/pkg/.mypy_cache", reason: keep_marker}
  reclaim_exit: 1
  actions: ["/home/tester/src/app/.mypy_cache"]
  removed: ["/home/tester/src/app/.mypy_cache"]
  skipped:
    - {candidate: "/home/tester/src/lib/.mypy_cache", reason: in_use, process_blockers: [{pid: 901, evidence: fd}]}
    - {candidate: "/home/tester/src/app/pkg/.mypy_cache", reason: excluded}
    - {candidate: "/home/tester/src/lib/pkg/.mypy_cache", reason: keep_marker}
  preserved: ["/home/tester/src/lib/.mypy_cache/payload", "/home/tester/src/app/pkg/.mypy_cache/payload", "/home/tester/src/lib/pkg/.mypy_cache/payload"]
