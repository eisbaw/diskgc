# The Cargo process heuristics (docs/safety.md, cargo-target, In use): a
# cargo working in a target's project blocks it (project_cargo); a
# process Cargo started for a package of the project blocks it
# (CARGO_MANIFEST_DIR); a detached target (no Cargo.toml beside it) is
# blocked by any visible cargo (detached_cargo). An attached target in a
# project no cargo works in is reclaimed.
profile_vector: 1
profile: cargo-target
roots: [/home/tester/src]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/cargo: {mode: "0755"}
    /usr/bin/tool: {mode: "0755"}
    /home/tester/src/building/Cargo.toml: {}
    /home/tester/src/building/target:
      CACHEDIR.TAG: {cachedir_tag: true}
      debug: {.cargo-lock: {}, deps: {a-1: {size: 1M}}}
    /home/tester/src/testing/Cargo.toml: {}
    /home/tester/src/testing/crate: {.: {}}
    /home/tester/src/testing/target:
      CACHEDIR.TAG: {cachedir_tag: true}
      debug: {.cargo-lock: {}, deps: {b-1: {size: 1M}}}
    /home/tester/src/elsewhere/shared-target:
      CACHEDIR.TAG: {cachedir_tag: true}
      debug: {.cargo-lock: {}, deps: {c-1: {size: 1M}}}
    /home/tester/src/quiet/Cargo.toml: {}
    /home/tester/src/quiet/target:
      CACHEDIR.TAG: {cachedir_tag: true}
      debug: {.cargo-lock: {}, deps: {d-1: {size: 1M}}}
  processes:
    - {pid: 901, exe: /usr/bin/cargo, cwd: /home/tester/src/building, maps: [/usr/bin/cargo], environ: [HOME=/home/tester], fds: [{path: /usr/bin/cargo}]}
    - {pid: 902, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [CARGO_MANIFEST_DIR=/home/tester/src/testing/crate], fds: [{path: /usr/bin/tool}]}
expect:
  plan:
    - {candidate: /home/tester/src/building/target, reason: in_use}
    - {candidate: /home/tester/src/testing/target, reason: in_use}
    - {candidate: /home/tester/src/elsewhere/shared-target, reason: in_use}
    - {candidate: /home/tester/src/quiet/target}
  reclaim_exit: 1
  actions: [/home/tester/src/quiet/target]
  removed: [/home/tester/src/quiet/target/debug/deps]
  skipped:
    - {candidate: /home/tester/src/building/target, reason: in_use, process_blockers: [{pid: 901, evidence: project_cargo}]}
    - {candidate: /home/tester/src/testing/target, reason: in_use, process_blockers: [{pid: 902, evidence: cargo_manifest_dir}]}
    - {candidate: /home/tester/src/elsewhere/shared-target, reason: in_use, process_blockers: [{pid: 901, evidence: detached_cargo}]}
  preserved:
    - /home/tester/src/building/target/debug/deps/a-1
    - /home/tester/src/testing/target/debug/deps/b-1
    - /home/tester/src/elsewhere/shared-target/debug/deps/c-1
    - /home/tester/src/quiet/target/debug/.cargo-lock
