# nix-user-cache's four entry families in one home; fetcher-cache-v1 is
# not one of them.
profile_vector: 1
config: |
  version: 1
  profiles:
    - {"name": "pin", "find": {"roots": ["/home"], "paths": ["tester/.cache/nix/tarball-cache-v2"], "type": "any"}, "action": "delete", "examples": {"match": ["/home/tester/.cache/nix/tarball-cache-v2"]}}
  protect: [pin]
  groups:
    - name: g
      tiers:
        - {"name": "t", "select": "profile:nix-user-cache", "roots": ["/home/tester"]}
select: "profile:nix-user-cache"
roots: ["/home/tester"]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/pip: {mode: "0755"}
    /usr/bin/uv: {mode: "0755"}
    /usr/bin/env: {mode: "0755"}
    /usr/bin/go: {mode: "0755"}
    /usr/bin/npm: {mode: "0755"}
    /usr/bin/pnpm: {mode: "0755"}
    /usr/bin/yarn: {mode: "0755"}
    /usr/bin/ccache: {mode: "0755"}
    /usr/bin/jest: {mode: "0755"}
    /usr/bin/pio: {mode: "0755"}
    /usr/bin/tool: {mode: "0755"}
    "/home/tester/.cache/nix/fetcher-cache-v1": {"db": {"size": "8K"}}
    "/home/tester/.cache/nix/gitv3": {"payload": {"size": "8K"}}
    "/home/tester/.cache/nix/tarball-cache": {"payload": {"size": "8K"}}
    "/home/tester/.cache/nix/tarball-cache-v2": {"payload": {"size": "8K"}}
    "/home/tester/.cache/nix/eval-cache-v6": {"payload": {"size": "8K"}, ".diskgc-keep": {}}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: "/home/tester/.cache/nix/tarball-cache/payload"}]}
expect:
  plan:
    - {candidate: "/home/tester/.cache/nix/gitv3"}
    - {candidate: "/home/tester/.cache/nix/tarball-cache", reason: in_use}
    - {candidate: "/home/tester/.cache/nix/tarball-cache-v2", reason: protected}
    - {candidate: "/home/tester/.cache/nix/eval-cache-v6", reason: kept}
  reclaim_exit: 1
  actions: ["/home/tester/.cache/nix/gitv3"]
  removed: ["/home/tester/.cache/nix/gitv3"]
  skipped:
    - {candidate: "/home/tester/.cache/nix/tarball-cache", reason: in_use, process_blockers: [{pid: 901, evidence: fd}]}
    - {candidate: "/home/tester/.cache/nix/tarball-cache-v2", reason: protected}
    - {candidate: "/home/tester/.cache/nix/eval-cache-v6", reason: kept}
  preserved: ["/home/tester/.cache/nix/tarball-cache/payload", "/home/tester/.cache/nix/tarball-cache-v2/payload", "/home/tester/.cache/nix/eval-cache-v6/payload", "/home/tester/.cache/nix/fetcher-cache-v1/db"]
