# claude-code-versions matches version *files*. In home a, of five
# versions the two newest stay; one older is deleted, one is open by a
# running process, one is protected. File candidates hold nothing, so the
# nested guard is a keep marker on the way: in home b it keeps every
# version below it, the newest too (the marker is checked first).
profile_vector: 1
config: |
  version: 1
  profiles:
    - name: pin
      find: {roots: [/home/a], paths: [.local/share/claude/versions/2.1.3], type: file}
      action: delete
      examples: {match: [/home/a/.local/share/claude/versions/2.1.3]}
  protect: [pin]
  groups:
    - name: g
      tiers:
        - {name: t, select: profile:claude-code-versions, roots: [/home/a, /home/b]}
select: profile:claude-code-versions
roots: [/home/a, /home/b]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/tool: {mode: "0755"}
    /home/a/.local/share/claude/versions:
      .: {mtime: 2026-10-05T00:00:00Z}
      2.1.1: {size: 8K, mtime: 2026-10-01T00:00:00Z}
      2.1.2: {size: 8K, mtime: 2026-10-02T00:00:00Z}
      2.1.3: {size: 8K, mtime: 2026-10-03T00:00:00Z}
      2.1.4: {size: 8K, mtime: 2026-10-04T00:00:00Z}
      2.1.5: {size: 8K, mtime: 2026-10-05T00:00:00Z}
    /home/b/.local/share/claude:
      .diskgc-keep: {}
      versions:
        1.0.1: {size: 8K, mtime: 2026-10-01T00:00:00Z}
        1.0.2: {size: 8K, mtime: 2026-10-02T00:00:00Z}
        1.0.3: {size: 8K, mtime: 2026-10-03T00:00:00Z}
  processes:
    - {pid: 901, exe: /usr/bin/tool, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/a], fds: [{path: /home/a/.local/share/claude/versions/2.1.2}]}
expect:
  plan:
    - {candidate: /home/a/.local/share/claude/versions/2.1.1}
    - {candidate: /home/a/.local/share/claude/versions/2.1.2, reason: in_use}
    - {candidate: /home/a/.local/share/claude/versions/2.1.3, reason: protected}
    - {candidate: /home/a/.local/share/claude/versions/2.1.4, reason: newest_version}
    - {candidate: /home/a/.local/share/claude/versions/2.1.5, reason: newest_version}
    - {candidate: /home/b/.local/share/claude/versions/1.0.1, reason: kept}
    - {candidate: /home/b/.local/share/claude/versions/1.0.2, reason: kept}
    - {candidate: /home/b/.local/share/claude/versions/1.0.3, reason: kept}
  reclaim_exit: 1
  actions: [/home/a/.local/share/claude/versions/2.1.1]
  removed: [/home/a/.local/share/claude/versions/2.1.1]
  skipped:
    - {candidate: /home/a/.local/share/claude/versions/2.1.2, reason: in_use, process_blockers: [{pid: 901, evidence: fd}]}
    - {candidate: /home/a/.local/share/claude/versions/2.1.3, reason: protected}
    - {candidate: /home/a/.local/share/claude/versions/2.1.4, reason: newest_version}
    - {candidate: /home/a/.local/share/claude/versions/2.1.5, reason: newest_version}
    - {candidate: /home/b/.local/share/claude/versions/1.0.1, reason: kept}
    - {candidate: /home/b/.local/share/claude/versions/1.0.2, reason: kept}
    - {candidate: /home/b/.local/share/claude/versions/1.0.3, reason: kept}
  preserved:
    - /home/a/.local/share/claude/versions/2.1.2
    - /home/a/.local/share/claude/versions/2.1.3
    - /home/b/.local/share/claude/versions/1.0.1
    - /home/b/.local/share/claude/versions/1.0.3
