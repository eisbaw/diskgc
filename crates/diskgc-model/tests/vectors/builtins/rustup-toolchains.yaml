# rustup-toolchains (TASK-94) keeps every toolchain rustup could select
# from what diskgc can read: the default and the directory overrides of
# settings.toml, the channels of rust-toolchain(.toml) files under the
# bound root, and a Kani installation's `toolchain` link. Names compare
# exactly: the default `nightly` keeps nightly-<triple>, not a dated
# nightly; the pin `1.90.0` keeps 1.90.0-<triple>, not 1.90-<triple>. A
# toolchain a process runs from is in use. A linked toolchain (a symlink)
# and rustup's own siblings (update-hashes, downloads, tmp) are never
# candidates; a removed toolchain's update hash stays (rustup removes a
# stray hash on its next install of that name). A keep marker and a
# negated profile keep two more.
profile_vector: 1
user_profiles:
  - name: pin
    find: {roots: [/home/tester], paths: [.rustup/toolchains/1.75.0-x86_64-unknown-linux-gnu], type: dir}
    action: delete
    examples: {match: [/home/tester/.rustup/toolchains/1.75.0-x86_64-unknown-linux-gnu]}
select: profile:rustup-toolchains && !profile:pin
roots: [/home/tester]
path: /home
min_free: 100%
host:
  host_model: 1
  clock: 2026-10-15T03:00:00Z
  mounts:
    - {id: 1, at: /, fs: ext4, dev: "254:1", size: 10G}
    - {id: 2, at: /home, fs: ext4, dev: "254:2", size: 10G, parent: 1}
  tree:
    /run/diskgc/lock: {uid: 0, gid: 0}
    /usr/bin/tool: {mode: "0755"}
    /home/tester/.rustup/settings.toml:
      content: |
        version = "12"
        default_toolchain = "nightly-x86_64-unknown-linux-gnu"
        profile = "default"

        [overrides]
        "/home/tester/elsewhere" = "1.85.0-x86_64-unknown-linux-gnu"
    /home/tester/.rustup/update-hashes:
      1.90-x86_64-unknown-linux-gnu: {content: "abc\n", mtime: 2026-09-01T00:00:00Z}
    /home/tester/.rustup/downloads/partial: {size: 8K, mtime: 2026-09-01T00:00:00Z}
    /home/tester/.rustup/tmp/staging: {size: 8K, mtime: 2026-09-01T00:00:00Z}
    /home/tester/.rustup/toolchains:
      1.70.0-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, .diskgc-keep: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      1.75.0-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      1.80.0-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      1.85.0-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      1.90-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      1.90.0-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      custom: {symlink: /home/tester/src/rust/build/host/stage1}
      nightly-2024-06-01-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      nightly-2025-01-01-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      nightly-2025-11-21-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
      nightly-x86_64-unknown-linux-gnu: {.: {mtime: 2026-09-01T00:00:00Z}, bin: {.: {mtime: 2026-09-01T00:00:00Z}, rustc: {size: 8K, mode: "0755", mtime: 2026-09-01T00:00:00Z}}}
    /home/tester/.kani/kani-0.67.0:
      bin: {kani-compiler: {size: 8K, mode: "0755"}}
      toolchain: {symlink: /home/tester/.rustup/toolchains/nightly-2025-11-21-x86_64-unknown-linux-gnu}
    /home/tester/src/app/rust-toolchain.toml:
      content: |
        [toolchain]
        channel = "1.90.0"
        components = ["rustfmt", "clippy"]
    /home/tester/src/legacy/rust-toolchain: {content: "nightly-2024-06-01\n"}
    /home/tester/src/rust/build/host/stage1/bin/rustc: {size: 8K, mode: "0755"}
  processes:
    - {pid: 901, exe: /home/tester/.rustup/toolchains/1.80.0-x86_64-unknown-linux-gnu/bin/rustc, cwd: /, maps: [/usr/bin/tool], environ: [HOME=/home/tester], fds: [{path: /usr/bin/tool}]}
expect:
  plan:
    - {candidate: /home/tester/.rustup/toolchains/1.70.0-x86_64-unknown-linux-gnu, reason: keep_marker}
    - {candidate: /home/tester/.rustup/toolchains/1.75.0-x86_64-unknown-linux-gnu, reason: excluded}
    - {candidate: /home/tester/.rustup/toolchains/1.80.0-x86_64-unknown-linux-gnu, reason: in_use}
    - {candidate: /home/tester/.rustup/toolchains/1.85.0-x86_64-unknown-linux-gnu, reason: pinned_toolchain}
    - {candidate: /home/tester/.rustup/toolchains/1.90-x86_64-unknown-linux-gnu}
    - {candidate: /home/tester/.rustup/toolchains/1.90.0-x86_64-unknown-linux-gnu, reason: pinned_toolchain}
    - {candidate: /home/tester/.rustup/toolchains/nightly-2024-06-01-x86_64-unknown-linux-gnu, reason: pinned_toolchain}
    - {candidate: /home/tester/.rustup/toolchains/nightly-2025-01-01-x86_64-unknown-linux-gnu}
    - {candidate: /home/tester/.rustup/toolchains/nightly-2025-11-21-x86_64-unknown-linux-gnu, reason: linked_current}
    - {candidate: /home/tester/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu, reason: pinned_toolchain}
  reclaim_exit: 1
  actions:
    - /home/tester/.rustup/toolchains/1.90-x86_64-unknown-linux-gnu
    - /home/tester/.rustup/toolchains/nightly-2025-01-01-x86_64-unknown-linux-gnu
  removed:
    - /home/tester/.rustup/toolchains/1.90-x86_64-unknown-linux-gnu
    - /home/tester/.rustup/toolchains/nightly-2025-01-01-x86_64-unknown-linux-gnu
  skipped:
    - {candidate: /home/tester/.rustup/toolchains/1.70.0-x86_64-unknown-linux-gnu, reason: keep_marker}
    - {candidate: /home/tester/.rustup/toolchains/1.75.0-x86_64-unknown-linux-gnu, reason: excluded}
    - {candidate: /home/tester/.rustup/toolchains/1.80.0-x86_64-unknown-linux-gnu, reason: in_use, process_blockers: [{pid: 901, evidence: exe}]}
    - {candidate: /home/tester/.rustup/toolchains/1.85.0-x86_64-unknown-linux-gnu, reason: pinned_toolchain}
    - {candidate: /home/tester/.rustup/toolchains/1.90.0-x86_64-unknown-linux-gnu, reason: pinned_toolchain}
    - {candidate: /home/tester/.rustup/toolchains/nightly-2024-06-01-x86_64-unknown-linux-gnu, reason: pinned_toolchain}
    - {candidate: /home/tester/.rustup/toolchains/nightly-2025-11-21-x86_64-unknown-linux-gnu, reason: linked_current}
    - {candidate: /home/tester/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu, reason: pinned_toolchain}
  preserved:
    - /home/tester/.rustup/toolchains/1.70.0-x86_64-unknown-linux-gnu/bin/rustc
    - /home/tester/.rustup/toolchains/1.75.0-x86_64-unknown-linux-gnu/bin/rustc
    - /home/tester/.rustup/toolchains/1.80.0-x86_64-unknown-linux-gnu/bin/rustc
    - /home/tester/.rustup/toolchains/1.85.0-x86_64-unknown-linux-gnu/bin/rustc
    - /home/tester/.rustup/toolchains/1.90.0-x86_64-unknown-linux-gnu/bin/rustc
    - /home/tester/.rustup/toolchains/custom
    - /home/tester/.rustup/toolchains/nightly-2024-06-01-x86_64-unknown-linux-gnu/bin/rustc
    - /home/tester/.rustup/toolchains/nightly-2025-11-21-x86_64-unknown-linux-gnu/bin/rustc
    - /home/tester/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu/bin/rustc
    - /home/tester/.rustup/update-hashes/1.90-x86_64-unknown-linux-gnu
    - /home/tester/.rustup/downloads/partial
    - /home/tester/.rustup/tmp/staging
    - /home/tester/.rustup/settings.toml
    - /home/tester/src/rust/build/host/stage1/bin/rustc
