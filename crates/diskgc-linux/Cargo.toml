[package]
name = "diskgc-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Removes the pre-release sandbox gate (docs/safety.md): deleting primitives
# then act outside diskgc test containers. Only release packages (0.1 onwards) may
# enable it, in one place (the release task); a test
# (sandbox_gate_flag_is_enabled_nowhere) fails if any manifest, the flake or
# the justfile names it, or if it becomes a default feature.
release-without-sandbox-gate = []
# For the e2e harness's builds only (TASK-263): inside a marked test
# container, the in-use scan assumes its own PID namespace complete
# (docs/safety.md, In use: Visibility). The flake's e2e builds of diskgc and
# diskgc-e2e's manifest enable it; a test
# (sandbox_flags_are_enabled_only_where_expected) fails if anything else
# names it, if it becomes a default feature, or with the release feature.
e2e-test-container-pid-namespace = []

[dependencies]
diskgc-core.workspace = true
rustix.workspace = true
libc.workspace = true

[dev-dependencies]
# unshare(CLONE_FILES | CLONE_FS) and many mappings in test helper processes;
# mount for the /proc of a test's own pid namespace.
rustix = { workspace = true, features = ["mm", "mount", "thread"] }
