[package]
name = "diskgc-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
diskgc-core.workspace = true
rustix.workspace = true

[dev-dependencies]
# unshare(CLONE_FILES | CLONE_FS) and many mappings in test helper processes;
# mount for the /proc of a test's own pid namespace.
rustix = { workspace = true, features = ["mm", "mount", "thread"] }
