# The built-in profile library (docs/reference.md, Built-in profile library),
# compiled into the binary. The schema is docs/reference.md, Profiles.
#
# A built-in profile's matching set never changes under its name: any change
# to what one matches, narrower or broader, ships under a new name.
#
# diskgc-core's tests load this file (profile::tests), so a broken entry
# fails `just check` and the flake's workspace-tests check.

- name: docker-build-cache
  category: containers
  description: BuildKit cache of the local system Docker Engine
  kind: docker-build-cache
  find: {roots: daemon}
  action: docker-builder-prune
  verified_with: Docker Engine 29.8.2 and Buildx 0.37.2 in digest-pinned dind, 2026-10-20

- name: docker-dangling
  category: containers
  description: Dangling images in the local system Docker daemon
  kind: docker-images
  find: {roots: daemon}
  action: docker-image-prune
  verified_with: Docker Engine 29.8.2 in digest-pinned dind, 2026-10-20

- name: docker-unreferenced
  category: containers
  description: Images not referenced by any container in the local system Docker daemon
  kind: docker-images
  find: {roots: daemon}
  action: docker-image-prune-all
  verified_with: Docker Engine 29.8.2 in digest-pinned dind, 2026-10-20

- name: cargo-target
  category: rust
  description: >-
    Cargo target directories: a CACHEDIR.TAG and a profile directory holding
    a known Cargo lock file
  kind: cargo-target
  find: {roots: required}
  checkouts: allow  # why: docs/reference.md, Built-in profile library (cargo-target)
  verified_with: cargo 1.90.0, 1.99.1 and nightly-2026-10-16 (lock files, docs/safety.md)

- name: pytest-cache
  category: test
  description: pytest cache directories up to three levels below a supplied root
  find:
    roots: required
    paths: [".pytest_cache", "*/.pytest_cache", "*/*/.pytest_cache", "*/*/*/.pytest_cache"]
    type: dir
  action: delete
  examples:
    match: [/home/mark/src/app/.pytest_cache, /home/mark/src/a/b/c/.pytest_cache]
    no_match: [/home/mark/src/app/.pytest_cache/v]
  verified_with: pytest 9.0.3

- name: nix-user-cache
  category: nix
  description: Nix user git, tarball and evaluation cache entries below a supplied home root
  find:
    roots: required
    paths: [.cache/nix/gitv3, .cache/nix/tarball-cache, .cache/nix/tarball-cache-v2, ".cache/nix/eval-cache-v*"]
    type: dir
  action: delete
  examples:
    match: [/home/mark/.cache/nix/gitv3, /home/mark/.cache/nix/tarball-cache-v2, /home/mark/.cache/nix/eval-cache-v6]
    no_match: [/home/mark/.cache/nix, /home/mark/.cache/nix/gitv2, /home/mark/.cache/nix/fetcher-cache-v1, /home/mark/.cache/nix/eval-cache]
  verified_with: Nix 2.34.8, observed user cache layout 2026-10-19

- name: bun-cache
  category: python / js
  description: Bun install caches at the default and a configured alternate location below a supplied home root
  find:
    roots: required
    paths: [.bun/install/cache, .cache/.bun/install/cache]
    type: dir
  action: delete
  examples:
    match: [/home/mark/.bun/install/cache, /home/mark/.cache/.bun/install/cache]
    no_match: [/home/mark/.cache/.bun/install, /home/mark/.bun/install, /home/mark/.cache/.bun/install/cache/pkg]
  verified_with: Bun 1.3.3 default and BUN_INSTALL_CACHE_DIR, 2026-10-20

- name: go-mod-cache
  category: caches
  description: Go downloaded module cache below a supplied home root
  find:
    roots: required
    paths: [go/pkg/mod]
    type: dir
  action: {delete: {make_writable: true}}
  examples:
    match: [/home/mark/go/pkg/mod]
    no_match: [/home/mark/go/pkg, /home/mark/go/pkg/mod/cache]
  verified_with: Go 1.26.7, go env GOMODCACHE on 2026-10-20

- name: cmake-build
  category: c / c++
  description: Out-of-source CMake build directories through depth five below a supplied root
  find:
    roots: required
    # Explicit depths keep discovery finite; a matching outer build owns
    # nested FetchContent builds. More depths require a new profile name.
    paths: ["*", "*/*", "*/*/*", "*/*/*/*", "*/*/*/*/*"]
    type: dir
  where: {has: CMakeCache.txt, lacks_entry: CMakeLists.txt}
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/build, /home/mark/src/a/b/c/d/build]
    no_match: [/home/mark/src/a/b/c/d/e/build]
  verified_with: CMake 3.30.5 (host CMakeCache.txt in retimer out-of-source builds, read-only survey 2026-10-20)

# Project roots are supplied by policy. Explicit depths avoid an unbounded
# recursive walk and let a matching outer cache own any nested cache.
- name: python-pycache
  category: python / js
  description: Python bytecode cache directories through depth five below a supplied project root
  find:
    roots: required
    paths: [__pycache__, "*/__pycache__", "*/*/__pycache__", "*/*/*/__pycache__", "*/*/*/*/__pycache__"]
    type: dir
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/app/__pycache__, /home/mark/src/app/pkg/sub/__pycache__]
    no_match: [/home/mark/src/app/__pycache__/nested, /home/mark/src/app/a/b/c/d/__pycache__]
  verified_with: CPython 3.13.15 and observed CPython 3.12 .pyc layout in a project tree, 2026-10-20

- name: mypy-cache
  category: python / js
  description: Mypy tagged project caches through depth five below a supplied project root
  find:
    roots: required
    paths: [.mypy_cache, "*/.mypy_cache", "*/*/.mypy_cache", "*/*/*/.mypy_cache", "*/*/*/*/.mypy_cache"]
    type: dir
  where: {has: CACHEDIR.TAG}
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/app/.mypy_cache, /home/mark/src/app/pkg/.mypy_cache]
    no_match: [/home/mark/src/app/.mypy_cache/3.13, /home/mark/src/app/a/b/c/d/.mypy_cache]
  verified_with: mypy 1.11.2 (version_id in an observed cache metadata file), tagged project cache layout 2026-10-20

# A narrower source-anchored recognizer for build output of any directory
# name. It requires the cache's recorded source to be an ancestor outside
# the candidate; a missing source cannot be rebuilt and is retained.
- name: cmake-build-anchored
  category: c / c++
  description: Source-anchored CMake output of any name through depth five
  find:
    roots: required
    paths: ["*", "*/*", "*/*/*", "*/*/*/*", "*/*/*/*/*"]
    type: dir
  where: {has: CMakeCache.txt, has_dir: CMakeFiles, lacks_entry: CMakeLists.txt, source_anchor: cmake}
  min_idle_for: 3d
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/app/output, /home/mark/src/app/sub/other-name]
    no_match: [/home/mark/src/app/sub/a/b/c/deeper]
  verified_with: CMake 3.30.5, recorded CMAKE_HOME_DIRECTORY and surviving CMakeLists.txt in host tracy builds, 2026-10-20

# Meson's generated metadata records both source and build paths. Only an
# output nested beneath its source is accepted; a copied output is refused.
- name: meson-build-anchored
  category: c / c++
  description: Source-anchored Meson Ninja output of any name through depth five
  find:
    roots: required
    paths: ["*", "*/*", "*/*/*", "*/*/*/*", "*/*/*/*/*"]
    type: dir
  where: {has: build.ninja, has_dir: meson-private, lacks_entry: meson.build, source_anchor: meson}
  min_idle_for: 3d
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/app/output, /home/mark/src/app/sub/other-name]
    no_match: [/home/mark/src/app/sub/a/b/c/deeper]
  verified_with: Meson 1.7.0 generated meson-info.json and coredata.dat in disposable Debian 13 container, 2026-10-20

# GNU Autoconf's generated config.status binds its build path to a source
# ancestor. Only out-of-source Makefile builds with surviving configure.ac
# are accepted; copied or moved output retains its old ac_pwd and is refused.
- name: autotools-build-anchored
  category: c / c++
  description: Source-anchored Autoconf Makefile output of any name through depth five
  find:
    roots: required
    paths: ["*", "*/*", "*/*/*", "*/*/*/*", "*/*/*/*/*"]
    type: dir
  where: {has: config.status, lacks_entry: configure.ac, source_anchor: autotools}
  min_idle_for: 3d
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/app/output, /home/mark/src/app/sub/other-name]
    no_match: [/home/mark/src/app/sub/a/b/c/deeper]
  verified_with: GNU Autoconf 2.73 generated config.status and Makefile in a disposable Nix test container, 2026-10-20

# Each command receives the exact candidate diskgc measured. Keep each
# program's own cache protocol: deleting a whole store can destroy metadata
# or package state that its cleaner intentionally preserves.
- name: pip-cache
  category: caches
  description: pip's HTTP and wheel cache below a supplied home root
  find: {roots: required, paths: [.cache/pip], type: dir}
  action: {command: [pip, --cache-dir, "{path}", cache, purge]}
  examples:
    match: [/home/mark/.cache/pip]
    no_match: [/home/mark/.cache/pip/http-v2, /home/mark/.cache/uv]
  verified_with: pip 26.1.2, host dry-run and Nix container cleaner 2026-10-20

- name: uv-cache
  category: python / js
  description: uv's package and archive cache below a supplied home root
  find: {roots: required, paths: [.cache/uv], type: dir}
  action: {command: [uv, cache, clean, --cache-dir, "{path}"], cwd: parent}
  examples:
    match: [/home/mark/.cache/uv]
    no_match: [/home/mark/.cache/uv/archive-v0, /home/mark/.cache/pip]
  verified_with: uv 0.13.0, host dry-run and Nix container cleaner 2026-10-20

- name: go-build-cache
  category: caches
  description: Go's build cache below a supplied home root
  find: {roots: required, paths: [.cache/go-build], type: dir}
  action: {command: [env, "GOCACHE={path}", go, clean, -cache]}
  examples:
    match: [/home/mark/.cache/go-build]
    no_match: [/home/mark/.cache/go-build/00, /home/mark/go/pkg/mod]
  verified_with: Go 1.26.8, host dry-run and Nix container cleaner 2026-10-20

- name: npm-cache
  category: caches
  description: npm's cache below a supplied home root
  find: {roots: required, paths: [.npm], type: dir}
  action: {command: [npm, cache, clean, --force, --cache, "{path}"]}
  examples:
    match: [/home/mark/.npm]
    no_match: [/home/mark/.npm/_cacache, /home/mark/.cache/npm]
  verified_with: npm 11.19.0 (Node.js 24.21.0), host dry-run and Nix container cleaner 2026-10-20

- name: pnpm-store
  category: python / js
  description: pnpm's content-addressable package store below a supplied home root
  find: {roots: required, paths: [.local/share/pnpm/store], type: dir}
  action: {command: [pnpm, store, prune, --store-dir, "{path}"]}
  examples:
    match: [/home/mark/.local/share/pnpm/store]
    no_match: [/home/mark/.local/share/pnpm/store/v10, /home/mark/.local/share/pnpm]
  verified_with: pnpm 12.9.0, host dry-run and Nix container cleaner 2026-10-20

- name: yarn-cache
  category: python / js
  description: Yarn Classic's package cache below a supplied home root
  find: {roots: required, paths: [.cache/yarn], type: dir}
  action: {command: [env, "YARN_CACHE_FOLDER={path}", yarn, cache, clean], cwd: parent}
  examples:
    match: [/home/mark/.cache/yarn]
    no_match: [/home/mark/.cache/yarn/v6, /home/mark/.yarn]
  verified_with: Yarn Classic 1.22.22, host dry-run and Nix container cleaner 2026-10-20

- name: ccache
  category: caches
  description: ccache's compiler cache at either standard home location
  find: {roots: required, paths: [.cache/ccache, .ccache], type: dir}
  action: {command: [env, "CCACHE_DIR={path}", ccache, --clear]}
  examples:
    match: [/home/mark/.cache/ccache, /home/mark/.ccache]
    no_match: [/home/mark/.cache/ccache/tmp, /home/mark/.cache/sccache]
  verified_with: ccache 4.14.1, host dry-run and Nix container cleaner 2026-10-20

- name: jest-cache
  category: python / js
  description: Jest's default caches below the frozen temp-prefix v1 roots
  find: {roots: [/tmp, /var/tmp], paths: ["jest_*"], type: dir}
  # An empty CLI config avoids loading an arbitrary project's JS config.
  # Jest removes the entire cache directory, so it starts from its parent.
  action: {command: [jest, --config, "{}", --cacheDirectory, "{path}", --clearCache], cwd: parent}
  examples:
    match: [/tmp/jest_rs, /var/tmp/jest_project_abc, /tmp/nix-shell.Ab1/jest_app_hash]
    no_match: [/tmp/jest, /tmp/subdir/jest_app_hash, /tmp/jest_app_hash/file]
  verified_with: Jest npm package 30.2.0 (pinned lockfile and Nix container cleaner, 2026-10-20)

- name: west-build
  category: embedded
  description: Zephyr west build directories through depth five below a supplied root
  find:
    roots: required
    # A different depth bound needs a new built-in name.
    paths: [build, "*/build", "*/*/build", "*/*/*/build", "*/*/*/*/build"]
    type: dir
  where: {has: CMakeCache.txt, has_dir: zephyr, lacks_entry: CMakeLists.txt}
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/app/build, /home/mark/src/a/b/c/d/build]
    no_match: [/home/mark/src/a/b/c/d/e/build, /home/mark/src/app/build/zephyr]
  verified_with: Zephyr west build directory layout in Zephyr 4.3 documentation; host layout survey 2026-10-20

- name: platformio-cache
  category: embedded
  description: PlatformIO's default downloaded-package and API cache below a supplied home root
  find:
    roots: required
    paths: [.platformio/.cache]
    type: dir
  # PIO removes the cache directory itself, so it must start from the
  # parent rather than inside the candidate. Its path is re-resolved by PIO.
  action: {command: [env, "PLATFORMIO_CACHE_DIR=.cache", pio, system, prune, --cache, --force], cwd: parent}
  examples:
    root: /home/mark
    match: [/home/mark/.platformio/.cache]
    no_match: [/home/mark/.platformio/packages, /home/mark/.platformio/cache, /home/mark/project/.pio/build]
  verified_with: PlatformIO Core 6.1.19 (isolated Nix-pinned prune probe, 2026-10-20)
# Each fs source below removes only its own matched entries. The selecting
# tier sets idle policy unless the source declares a mandatory minimum.
- name: pytest-tmp
  category: test
  description: pytest test directories under the frozen temp-prefix v1 roots
  find:
    roots: [/tmp, /var/tmp]
    # The built-in loader expands this base through temp-prefix v1; `profiles
    # show` prints every effective pattern. See docs/reference.md.
    paths: ["pytest-of-*/pytest-*/*"]
    type: dir
  checkouts: allow
  action: delete
  examples:
    match: [/tmp/pytest-of-mark/pytest-3/test_x0, /tmp/nix-shell.AbC123/pytest-of-mark/pytest-0/test_y0, /var/tmp/tmp.x1/pytest-of-ci/pytest-12/test_z0, /tmp/claude-1000/nix-shell.Ab1/pytest-of-ci/pytest-4/test_c0, /tmp/nix-shell.Ab1/nix-shell.B2/pytest-of-ci/pytest-5/test_n0]
    no_match: [/tmp/pytest-of-mark, /tmp/pytest-of-mark/pytest-3, /tmp/pytest-of-mark/garbage-1a2b, /home/mark/pytest-of-mark/pytest-3/test_x0]
  verified_with: pytest 8.3 (read-only survey 2026-10-19)

- name: claude-code-tmp
  category: ai agents
  description: Claude Code numbered session directories under its per-user temp root
  find: {roots: [/tmp], paths: ["claude-{uid}/-*/*"], type: dir}
  action: delete
  examples:
    match: [/tmp/claude-1000/-home-mark-src-app/7cc7f78e-2a90-4962-9538-3cc833eda22a]
    no_match: [/tmp/claude-1000/-home-mark-src-app, /tmp/claude-1000/nix-shell.Ab1/pytest-of-mark, /tmp/claude-1001x/-a/b]
  verified_with: Claude Code 2.1.280 (host layout 2026-10-20; read-only survey 2026-10-18)

- name: chromium-tmp
  category: browsers
  description: Chromium and Brave scratch files and directories in /tmp
  find: {roots: [/tmp], paths: [".org.chromium.Chromium.*", "org.chromium.Chromium.*"], type: any}
  action: delete
  examples:
    match: [/tmp/.org.chromium.Chromium.aB3dEf, /tmp/org.chromium.Chromium.BraveComponentUpdater_chrome_url_fetcher_.x1Y2z3]
    no_match: [/tmp/org.mozilla.firefox.x, /tmp/sub/org.chromium.Chromium.x]
  verified_with: Brave Browser 154.1.96.61 (host layout 2026-10-20; read-only survey 2026-10-18)

- name: node-compile-cache
  category: python / js
  description: Node compile cache under temp-prefix v1 roots in /tmp
  find: {roots: [/tmp], paths: ["node-compile-cache"], type: dir}
  action: delete
  examples:
    match: [/tmp/node-compile-cache, /tmp/nix-shell.AbC/node-compile-cache, /tmp/claude-1000/nix-shell.Ab1/node-compile-cache]
    no_match: [/tmp/node-compile-cache/v22, /tmp/x/node-compile-cache]
  verified_with: Node.js 24.21.0 (host layout 2026-10-20; read-only survey 2026-10-18)

- name: playwright-tmp
  category: python / js
  description: Playwright scratch directories under temp-prefix v1 roots in /tmp
  find: {roots: [/tmp], paths: ["playwright*"], type: dir}
  action: delete
  examples:
    match: [/tmp/playwright-artifacts-0a3aQN, /tmp/nix-shell.x1/playwright_chromiumdev_profile-Sw4zrD, /tmp/nix-develop-1-2/playwright_abc, /tmp/claude-1000/nix-shell.Ab1/playwright-artifacts]
    no_match: [/tmp/a/playwright-x, /tmp/playwright-artifacts-0a3aQN/log.txt]
  verified_with: Playwright 1.56.1 (controlled browser TMPDIR probe 2026-10-20)

- name: zephyr-tmp
  category: embedded
  description: Zephyr scratch and run directories directly under /tmp
  find: {roots: [/tmp], paths: ["zephyr-*"], type: dir}
  action: delete
  examples:
    match: [/tmp/zephyr-h5e5-run.jTm9zGlH, /tmp/zephyr-scratch]
    no_match: [/tmp/zephyr, /tmp/a/zephyr-x]
  verified_with: Zephyr 4.5.0-rc1 (host run log 2026-10-19; read-only survey 2026-10-18)

- name: renode-tmp
  category: embedded
  description: Renode temp directories under temp-prefix v1 roots in /tmp
  find: {roots: [/tmp], paths: ["renode-*"], type: dir}
  action: delete
  examples:
    match: [/tmp/renode-1045514-crash, /tmp/nix-shell.Ab1/renode-1000523, /tmp/zephyr-h5e5-run.jTm9zGlH/renode-1]
    no_match: [/tmp/renode, /tmp/a/renode-1]
  verified_with: Renode 1.17.0 (installed TemporaryFilesManager source; host dry-run 2026-10-18)

- name: containers-image-tmp
  category: containers
  description: Podman and Buildah temporary image storage left in /var/tmp
  find:
    roots: [/var/tmp]
    paths: ["buildah*", "container_images_storage*"]
    type: any
  min_idle_for: 3d
  action: delete
  examples:
    match: [/var/tmp/buildah3558241755, /var/tmp/container_images_storage528829445]
    no_match: [/tmp/buildah3558241755, /var/tmp/buildah3558241755/content, /var/tmp/containers/storage]
  verified_with: Podman 5.8.7 observed temporary directories 2026-10-20

- name: xdg-cache-entry
  category: generic
  description: Top-level entries of a supplied XDG_CACHE_HOME, excluding known state and dedicated caches
  find:
    roots: required
    paths: ["*"]
    # These are exact names relative to XDG_CACHE_HOME. Keep user data,
    # credentials, repository caches and entries owned by dedicated profiles.
    exclude: [.bun, borg, ccache, claude, containers, cursor_api_sessions, dconf, gh, ghidra, go-build, gpauth, huggingface, Microsoft, nix, opencode, "Palo Alto Networks", pip, pre-commit, sdkmanager, sessions, teleport-device, torch, uv, wine]
    type: any
  min_idle_for: 30d
  checkouts: refuse
  action: delete
  examples:
    match: [/home/mark/.cache/nix-index, /home/mark/.cache/microsoft-edge, /home/mark/.cache/icon-cache.kcache]
    no_match: [/home/mark/.cache/huggingface, /home/mark/.cache/borg, /home/mark/.cache/nix, /home/mark/.cache/pre-commit, /home/mark/.cache/uv]
  verified_with: XDG Base Directory Specification 0.8; host XDG_CACHE_HOME layout surveyed 2026-10-20

# Browser cache paths are below the supplied home root. Each application
# needs its own source because app_not_running checks one SingletonLock.
# Never match the profile directory, WebStorage or Service Worker data.
- name: brave-browser-cache
  category: browsers
  description: Brave disk and compiled code caches in standard browser profiles
  find:
    roots: required
    paths: [.cache/BraveSoftware/Brave-Browser/Default/Cache, .cache/BraveSoftware/Brave-Browser/Default/Code Cache, ".cache/BraveSoftware/Brave-Browser/Profile */Cache", ".cache/BraveSoftware/Brave-Browser/Profile */Code Cache"]
    type: dir
  where: {app_not_running: .config/BraveSoftware/Brave-Browser/SingletonLock}
  action: delete
  examples:
    match: [/home/mark/.cache/BraveSoftware/Brave-Browser/Default/Cache, /home/mark/.cache/BraveSoftware/Brave-Browser/Profile 1/Code Cache]
    no_match: [/home/mark/.cache/BraveSoftware/Brave-Browser/Default, /home/mark/.config/BraveSoftware/Brave-Browser/Default/WebStorage, /home/mark/.config/BraveSoftware/Brave-Browser/Default/Service Worker/CacheStorage]
  verified_with: Brave Browser 154.1.96.61 read-only host layout 2026-10-20

- name: chrome-browser-cache
