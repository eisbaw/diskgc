# Rustup and elan toolchains (TASK-94; docs/safety.md, Toolchain pins).
# A plain delete under diskgc's own keep rule, not the managers'
# uninstall: neither keeps a default or a project pin, and neither is on
# PATH on a Nix machine. A verified heuristic pending Mark's admission
# (docs/reference.md, Liveness contracts), so in no release catalog.
# Never released, so its definition may still change under its name.
- name: rustup-toolchains
  category: rust
  description: >-
    Rustup toolchains below a supplied home root that no default, override,
    rust-toolchain file under the root or Kani link selects
  find:
    roots: required
    paths: [.rustup/toolchains/*]
    type: dir
  where:
    protect_toolchains: rustup
    # A `rustup toolchain link` alias, and Kani's link to the nightly it
    # pins (`.kani/<version>/toolchain`), keep what they lead to.
    protect_link_dirs: [.rustup/toolchains, .kani/*]
  min_idle_for: 1h
  action: delete
  examples:
    root: /home/mark
    match: [/home/mark/.rustup/toolchains/1.90.0-x86_64-unknown-linux-gnu, /home/mark/.rustup/toolchains/nightly-2025-11-21-x86_64-unknown-linux-gnu, /home/mark/.rustup/toolchains/stable-x86_64-unknown-linux-gnu]
    no_match: [/home/mark/.rustup/toolchains, /home/mark/.rustup/settings.toml, /home/mark/.rustup/update-hashes/1.90.0-x86_64-unknown-linux-gnu, /home/mark/.rustup/downloads/0a1b2c, /home/mark/.rustup/tmp/0a1b2c, /home/mark/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin, /home/mark/src/.rustup/toolchains/stable-x86_64-unknown-linux-gnu]
  verified_with: rustup 1.29.1 source (toolchain names, settings.toml version 12, stray update hash) and host layout (1.90.0, nightly, dated nightly linked by Kani 0.67.0), 2026-11-02
  liveness_class: verified-heuristic

- name: elan-toolchains
