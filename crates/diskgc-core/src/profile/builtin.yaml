  action: delete
  examples:
    match: [/home/mark/.cache/chromium/Default/Cache, /home/mark/.cache/chromium/Profile 1/Code Cache]
    no_match: [/home/mark/.config/chromium/Default, /home/mark/.config/chromium/Default/Service Worker/CacheStorage, /home/mark/.config/chromium/Default/WebStorage]
  verified_with: Chromium 145.0.7632.159 (host Last Version; 2026-10-20 dry run found no cache candidates)

- name: edge-browser-cache
  category: browsers
  description: Microsoft Edge disk and compiled code caches in standard browser profiles
  find:
    roots: required
    paths: [.cache/microsoft-edge/Default/Cache, .cache/microsoft-edge/Default/Code Cache, ".cache/microsoft-edge/Profile */Cache", ".cache/microsoft-edge/Profile */Code Cache"]
