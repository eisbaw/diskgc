    match: [/home/mark/.elan/toolchains/leanprover--lean4---v4.16.0, /home/mark/.elan/toolchains/leanprover--lean4-nightly---nightly-2025-01-01]
    no_match: [/home/mark/.elan/toolchains, /home/mark/.elan/settings.toml, /home/mark/.elan/known-projects, /home/mark/.elan/tmp/0a1b2c, /home/mark/.elan/toolchains/leanprover--lean4---v4.16.0/bin, /home/mark/src/.elan/toolchains/leanprover--lean4---v4.16.0]
