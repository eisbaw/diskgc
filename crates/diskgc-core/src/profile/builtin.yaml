  find:
    roots: required
    paths: [.cursor/extensions/*]
    type: dir
  where:
    keep_newest: 2
    newest_group: cursor_extension
    protect_cursor_extensions: .cursor/extensions/extensions.json
    protect_link_dirs: [.local/bin, bin]
  action: delete
  examples:
    match: [/home/mark/.cursor/extensions/ms-python.python-2025.6.1-linux-x64]
    no_match: [/home/mark/.cursor/extensions, /home/mark/.cursor/extensions/ms-python.python/2025.6.1]
  verified_with: Cursor 3.1.15 extension manifest and directory names, host survey 2026-10-20
  liveness_class: verified-heuristic

