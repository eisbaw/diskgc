# The built-in profile library (docs/reference.md, Built-in profile library),
# compiled into the binary. The schema is docs/reference.md, Profiles.
#
# A built-in profile's matching set never changes under its name: any change
# to what one matches, narrower or broader, ships under a new name.
#
# diskgc-core's tests load this file (profile::tests), so a broken entry
# fails `just check` and the flake's workspace-tests check.
#
# `liveness_class` (every source) is the admission class of docs/safety.md,
# Producer liveness; its evidence, residuals and verdict are the source's row
# in docs/reference.md, Liveness contracts, which a test keeps in sync.
# `releases: ["0.1"]` puts a built-in in the 0.1 catalog, which a release
# row of crates/diskgc-core/src/releases.json names (Library::release_catalog):
# explicit membership per catalog, not a
# "since"; the loader refuses it on class none.

- name: docker-build-cache
  category: containers
  description: BuildKit cache of the local system Docker Engine
  kind: docker-build-cache
  find: {roots: daemon}
  action: docker-builder-prune
  verified_with: Docker Engine 29.8.2 and Buildx 0.37.2 in digest-pinned dind, 2026-10-20
  liveness_class: delegated

- name: docker-dangling
  category: containers
  description: Dangling images in the local system Docker daemon
  kind: docker-images
  find: {roots: daemon}
  action: docker-image-prune
  verified_with: Docker Engine 29.8.2 in digest-pinned dind, 2026-10-20
  liveness_class: delegated

- name: docker-unreferenced
  category: containers
  description: Images not referenced by any container in the local system Docker daemon
  kind: docker-images
  find: {roots: daemon}
  action: docker-image-prune-all
  verified_with: Docker Engine 29.8.2 in digest-pinned dind, 2026-10-20
  liveness_class: delegated

# TASK-93, development library only, pending Mark's admission: the caller's
# rootless Podman store, pruned by Podman itself (docs/safety.md, Podman
# images). Never by deleting storage files: they belong to subuids, and
# container storage is refused as a delete target (TASK-242).
- name: podman-dangling
  category: containers
  description: Dangling images in the caller's local rootless Podman store
  kind: podman-images
  find: {roots: daemon}
  action: podman-image-prune
  verified_with: Podman 5.8.7 (prune in an isolated store, 2026-10-20; read-only on the development machine, 2026-11-03)
  liveness_class: delegated

- name: podman-unreferenced
  category: containers
  description: >-
    Images no container (running or stopped) uses in the caller's local
    rootless Podman store, tagged ones included, and (as Podman's --all
    does) its persistent RUN --mount=type=cache build caches
  kind: podman-images
  find: {roots: daemon}
  action: podman-image-prune-all
  verified_with: Podman 5.8.7 read-only on the development machine (what --all would prune), 2026-11-03; the --all prune itself not yet run in a container
  liveness_class: delegated

- name: cargo-target
  category: rust
  description: >-
    Cargo target directories: a CACHEDIR.TAG and a profile directory holding
    a known Cargo lock file
  kind: cargo-target
  find: {roots: required}
  checkouts: allow  # why: docs/reference.md, Built-in profile library (cargo-target)
  verified_with: cargo 1.90.0, 1.99.1 and nightly-2026-10-16 (lock files, docs/safety.md)
  liveness_class: delegated
  releases: ["0.1"]

- name: pytest-cache
  category: test
  description: pytest cache directories up to three levels below a supplied root
  find:
    roots: required
    paths: [".pytest_cache", "*/.pytest_cache", "*/*/.pytest_cache", "*/*/*/.pytest_cache"]
    type: dir
  action: delete
  examples:
    match: [/home/mark/src/app/.pytest_cache, /home/mark/src/a/b/c/.pytest_cache]
    no_match: [/home/mark/src/app/.pytest_cache/v]
  verified_with: pytest 9.0.3
  liveness_class: tolerant

- name: nix-user-cache
