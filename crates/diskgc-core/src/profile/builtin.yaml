  action: delete
  examples:
    match: [/home/mark/.cache/nix/gitv3, /home/mark/.cache/nix/tarball-cache-v2, /home/mark/.cache/nix/eval-cache-v6]
    no_match: [/home/mark/.cache/nix, /home/mark/.cache/nix/gitv2, /home/mark/.cache/nix/fetcher-cache-v1, /home/mark/.cache/nix/eval-cache]
  verified_with: Nix 2.34.8, observed user cache layout 2026-10-19
  liveness_class: verified-heuristic

- name: bun-cache
  category: python / js
  description: Bun install caches at the default and a configured alternate location below a supplied home root
  find:
    roots: required
    paths: [.bun/install/cache, .cache/.bun/install/cache]
    type: dir
  action: delete
  examples:
    match: [/home/mark/.bun/install/cache, /home/mark/.cache/.bun/install/cache]
    no_match: [/home/mark/.cache/.bun/install, /home/mark/.bun/install, /home/mark/.cache/.bun/install/cache/pkg]
  verified_with: Bun 1.3.3 default and BUN_INSTALL_CACHE_DIR, 2026-10-20
  liveness_class: verified-heuristic

- name: go-mod-cache
  category: caches
  description: Go downloaded module cache below a supplied home root
  find:
    roots: required
    paths: [go/pkg/mod]
    type: dir
  action: {delete: {make_writable: true}}
  examples:
    match: [/home/mark/go/pkg/mod]
    no_match: [/home/mark/go/pkg, /home/mark/go/pkg/mod/cache]
  verified_with: Go 1.26.7, go env GOMODCACHE on 2026-10-20
  liveness_class: verified-heuristic

# TASK-40 language and package caches below a supplied home root. Verified
# heuristics pending Mark's admission (docs/reference.md, Liveness
# contracts), so in no release catalog; never released, so a definition may
# still change under its name. Plain deletes: none of these tools has a
# cleaner that takes the measured directory. One candidate per entry the
# tool fetches as a unit, so idle tiers can reclaim the stale ones; the
# one-hour floor keeps entries a run is fetching or unpacking.
- name: huggingface-hub-repos
  category: caches
  description: Hugging Face hub cache repositories (models, datasets, spaces) below a supplied home root
  find:
    roots: required
    paths: [".cache/huggingface/hub/models--*", ".cache/huggingface/hub/datasets--*", ".cache/huggingface/hub/spaces--*"]
    type: dir
  min_idle_for: 1h
  action: delete
  examples:
    root: /home/mark
    match: [/home/mark/.cache/huggingface/hub/models--desklib--ai-text-detector-v1.01, /home/mark/.cache/huggingface/hub/datasets--org--set, /home/mark/.cache/huggingface/hub/spaces--org--demo]
    no_match: [/home/mark/.cache/huggingface/hub, /home/mark/.cache/huggingface/hub/.locks, /home/mark/.cache/huggingface/hub/.locks/models--org--m, /home/mark/.cache/huggingface/hub/models--org--m/blobs, /home/mark/.cache/huggingface/token, /home/mark/.cache/huggingface/xet, /home/mark/.cache/huggingface/datasets, /home/mark/src/.cache/huggingface/hub/models--org--m]
  verified_with: huggingface_hub 1.9.1 source (HF_HUB_CACHE default, repo_folder_name, cached pointer returned without a lock, download locks under .locks) and host hub layout, 2026-11-02
  liveness_class: verified-heuristic

- name: cargo-registry-src
  category: rust
  description: Crate sources Cargo extracted from its registry cache below a supplied home root
  find:
    roots: required
    paths: [".cargo/registry/src/*/*"]
    type: dir
  # Cargo writes .cargo-ok when an extraction completes; without it the
  # directory is an interrupted extraction or not Cargo's.
  where: {has: .cargo-ok}
  min_idle_for: 1h
  action: delete
  examples:
    root: /home/mark
    match: [/home/mark/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/serde-1.0.228, /home/mark/.cargo/registry/src/github.com-1ecc6299db9ec823/libc-0.2.150]
    no_match: [/home/mark/.cargo/registry/src, /home/mark/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f, /home/mark/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/serde-1.0.228/src, /home/mark/.cargo/registry/cache/index.crates.io-1949cf8c6b5b557f/serde-1.0.228, /home/mark/.cargo/registry/index/index.crates.io-1949cf8c6b5b557f, /home/mark/.cargo/git/checkouts/repo-0123456789abcdef/abc1234, /home/mark/.cargo/bin, /home/mark/src/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/serde-1.0.228]
  verified_with: Cargo source at commit 6238f6fd61bf, 2026-11-02 (unpack_package and .cargo-ok, CacheLockMode, global cache tracker sync of removed entries) and host registry layout
  liveness_class: verified-heuristic

- name: node-gyp-headers
  category: python / js
  description: Node.js headers node-gyp installed in its default dev directory below a supplied home root
  find:
    roots: required
    paths: [".cache/node-gyp/*"]
    type: dir
  # node-gyp copies installVersion in with the headers and installs a
  # version again when its directory is missing. A delete stopped part-way
  # leaves installVersion (docs/reference.md, Liveness contracts).
  where: {has: installVersion}
  min_idle_for: 1h
  action: delete
  examples:
    root: /home/mark
    match: [/home/mark/.cache/node-gyp/20.18.1, /home/mark/.cache/node-gyp/23.6.0]
    no_match: [/home/mark/.cache/node-gyp, /home/mark/.cache/node-gyp/20.18.1/include, /home/mark/.node-gyp/20.18.1, /home/mark/.electron-gyp/33.4.5, /home/mark/src/.cache/node-gyp/20.18.1]
  verified_with: node-gyp 11.5.0 source bundled with npm of Node.js 22.23.3 (env-paths cache dev dir, installVersion check, install of a missing version) and host layout, 2026-11-02
  liveness_class: verified-heuristic

- name: electron-download-cache
  category: python / js
  description: Electron release downloads in @electron/get's default cache below a supplied home root
  find:
    roots: required
    paths: [".cache/electron/*"]
    type: dir
  min_idle_for: 1h
  action: delete
  examples:
    root: /home/mark
    match: [/home/mark/.cache/electron/c5bfbb83a9a00da9cf9633863c02cca5138e6c2f7c9dbd11a10a5fb33041457f]
    no_match: [/home/mark/.cache/electron, /home/mark/.cache/electron/c5bfbb83a9a00da9cf9633863c02cca5138e6c2f7c9dbd11a10a5fb33041457f/electron-v33.4.5-linux-x64.zip, /home/mark/.cache/electron-builder/winCodeSign, /home/mark/.config/Electron, /home/mark/src/.cache/electron/c5bfbb83a9a00da9cf9633863c02cca5138e6c2f7c9dbd11a10a5fb33041457f]
  verified_with: "@electron/get 5.1.0 source (env-paths cache root, SHA-256 URL directory, cache-hit path returned to the caller) and host layout (an Electron 33.4.5 zip from @electron/get 2.x), 2026-11-02"
  liveness_class: verified-heuristic

# Project roots are supplied by policy. Explicit depths avoid an unbounded
# recursive walk and let a matching outer cache own any nested cache.
- name: python-pycache
  category: python / js
  description: Python bytecode cache directories through depth five below a supplied project root
  find:
    roots: required
    paths: [__pycache__, "*/__pycache__", "*/*/__pycache__", "*/*/*/__pycache__", "*/*/*/*/__pycache__"]
    type: dir
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/app/__pycache__, /home/mark/src/app/pkg/sub/__pycache__]
    no_match: [/home/mark/src/app/__pycache__/nested, /home/mark/src/app/a/b/c/d/__pycache__]
  verified_with: CPython 3.13.15 and observed CPython 3.12 .pyc layout in a project tree, 2026-10-20
  liveness_class: tolerant

- name: mypy-cache
  category: python / js
  description: Mypy tagged project caches through depth five below a supplied project root
  find:
    roots: required
    paths: [.mypy_cache, "*/.mypy_cache", "*/*/.mypy_cache", "*/*/*/.mypy_cache", "*/*/*/*/.mypy_cache"]
    type: dir
  where: {has: CACHEDIR.TAG}
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/app/.mypy_cache, /home/mark/src/app/pkg/.mypy_cache]
    no_match: [/home/mark/src/app/.mypy_cache/3.13, /home/mark/src/app/a/b/c/d/.mypy_cache]
  verified_with: mypy 1.11.2 (version_id in an observed cache metadata file), tagged project cache layout 2026-10-20
  liveness_class: verified-heuristic

# Project dependency directories (TASK-79): judged by their whole
# project's activity, not their own (a reader changes neither mtime nor
# ctime), with a 30-day floor (docs/safety.md, Project dependency
# directories; docs/reference.md, Liveness contracts). Nested dependency
# directories and symlinks are never candidates; checkouts stay refused (an
# editable install can put a real checkout under .venv/src). Nothing below a
# hidden directory under the root is a candidate (`exclude`): those are
# tool-managed installs (~/.npm/_npx, editor extensions, ~/.cache), not the
# user's projects, which a root of ~ would otherwise reach.
- name: node-modules
  category: python / js
  description: Node project dependency directories (node_modules beside a package.json) through depth five below a supplied project or workspace root, outside hidden directories, once their project shows no change, read or visible use for 30 days
  find:
    roots: required
    paths: [node_modules, "*/node_modules", "*/*/node_modules", "*/*/*/node_modules", "*/*/*/*/node_modules"]
    exclude: [".*/node_modules", ".*/*/node_modules", "*/.*/node_modules", ".*/*/*/node_modules", "*/.*/*/node_modules", "*/*/.*/node_modules", ".*/*/*/*/node_modules", "*/.*/*/*/node_modules", "*/*/.*/*/node_modules", "*/*/*/.*/node_modules"]
    type: dir
  where: {liveness_contract: node-project}
  min_idle_for: 30d
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/node_modules, /home/mark/src/app/node_modules, /home/mark/src/mono/packages/a/node_modules]
    no_match: [/home/mark/src/app/node_modules/left-pad, /home/mark/src/a/b/c/d/e/node_modules, /home/mark/src/app/node_modules.old, /home/mark/other/app/node_modules, /home/mark/src/.npm/_npx/f00d/node_modules, /home/mark/src/app/.cache/tool/node_modules]
  verified_with: npm 11.19.0 and Node.js 24.21.0 install layout on the development host (read-only dry run 2026-11-02) and the ModelHost vectors; container tests pending (TASK-79)
  liveness_class: verified-heuristic

- name: python-venv
  category: python / js
  description: Python virtual environments named .venv (holding pyvenv.cfg, beside a Python project manifest) through depth five below a supplied project or workspace root, outside hidden directories, once their project shows no change, read or visible use for 30 days
  find:
    roots: required
    paths: [.venv, "*/.venv", "*/*/.venv", "*/*/*/.venv", "*/*/*/*/.venv"]
    exclude: [".*/.venv", ".*/*/.venv", "*/.*/.venv", ".*/*/*/.venv", "*/.*/*/.venv", "*/*/.*/.venv", ".*/*/*/*/.venv", "*/.*/*/*/.venv", "*/*/.*/*/.venv", "*/*/*/.*/.venv"]
    type: dir
  where: {liveness_contract: python-project}
  min_idle_for: 30d
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/.venv, /home/mark/src/app/.venv, /home/mark/src/mono/tools/x/.venv]
    no_match: [/home/mark/src/app/.venv/lib, /home/mark/src/app/venv, /home/mark/src/app/.venv-3a9f, /home/mark/src/a/b/c/d/e/.venv, /home/mark/src/.local/share/tool/.venv]
  verified_with: CPython 3.13.15 venv layout (pyvenv.cfg) on the development host (read-only dry run 2026-11-02) and the ModelHost vectors; container tests pending (TASK-79)
  liveness_class: verified-heuristic

# A narrower source-anchored recognizer for build output of any directory
# name. It requires the cache's recorded source to be an ancestor outside
# the candidate; a missing source cannot be rebuilt and is retained.
- name: cmake-build-anchored
  category: c / c++
  description: Source-anchored CMake output of any name through depth five
  find:
    roots: required
    paths: ["*", "*/*", "*/*/*", "*/*/*/*", "*/*/*/*/*"]
    type: dir
  where: {has: CMakeCache.txt, has_dir: CMakeFiles, lacks_entry: CMakeLists.txt, source_anchor: cmake}
  min_idle_for: 3d
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/app/output, /home/mark/src/app/sub/other-name]
    no_match: [/home/mark/src/app/sub/a/b/c/deeper]
  verified_with: CMake 3.30.5, recorded CMAKE_HOME_DIRECTORY and surviving CMakeLists.txt in host tracy builds, 2026-10-20
  liveness_class: verified-heuristic

# Meson's generated metadata records both source and build paths. Only an
# output nested beneath its source is accepted; a copied output is refused.
- name: meson-build-anchored
  category: c / c++
  description: Source-anchored Meson Ninja output of any name through depth five
  find:
    roots: required
    paths: ["*", "*/*", "*/*/*", "*/*/*/*", "*/*/*/*/*"]
    type: dir
  where: {has: build.ninja, has_dir: meson-private, lacks_entry: meson.build, source_anchor: meson}
  min_idle_for: 3d
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/app/output, /home/mark/src/app/sub/other-name]
    no_match: [/home/mark/src/app/sub/a/b/c/deeper]
  verified_with: Meson 1.7.0 generated meson-info.json and coredata.dat in disposable Debian 13 container, 2026-10-20
  liveness_class: verified-heuristic

# GNU Autoconf's generated config.status binds its build path to a source
# ancestor. Only out-of-source Makefile builds with surviving configure.ac
# are accepted; copied or moved output retains its old ac_pwd and is refused.
- name: autotools-build-anchored
  category: c / c++
  description: Source-anchored Autoconf Makefile output of any name through depth five
  find:
    roots: required
    paths: ["*", "*/*", "*/*/*", "*/*/*/*", "*/*/*/*/*"]
    type: dir
  where: {has: config.status, lacks_entry: configure.ac, source_anchor: autotools}
  min_idle_for: 3d
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/app/output, /home/mark/src/app/sub/other-name]
    no_match: [/home/mark/src/app/sub/a/b/c/deeper]
  verified_with: GNU Autoconf 2.73 generated config.status and Makefile in a disposable Nix test container, 2026-10-20
  liveness_class: verified-heuristic

# ---- TASK-101: build trees anchored to a whole source tree (pending
# Mark's admission; development library only, in no release catalog).
# Each output is taken only when its marker, the tree it would be rebuilt
# from and the trees that build also reads all survive (docs/safety.md,
# Source-anchored build trees). Never released, so a definition may still
# change under its name.
- name: buildroot-output-anchored
  category: embedded
  description: Buildroot's in-tree output/ beside its source and .config, through depth five
  find:
    roots: required
    paths: [output, "*/output", "*/*/output", "*/*/*/output", "*/*/*/*/output"]
    type: dir
  where: {has: .br2-external.mk, has_dir: build, lacks_entry: .config, source_anchor: buildroot}
  min_idle_for: 3d
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/buildroot/output, /home/mark/src/a/b/c/buildroot/output]
    no_match: [/home/mark/src/buildroot/output/images, /home/mark/src/a/b/c/d/buildroot/output, /home/mark/src/buildroot/dl]
  verified_with: Buildroot master Makefile (CONFIG_DIR for O=output) and support/scripts/br2-external (generated .br2-external.mk), sources read 2026-11-03
  liveness_class: verified-heuristic

- name: yocto-tmpdir-anchored
  category: embedded
  description: Yocto TMPDIR of any name whose saved_tmpdir names it, beside a build directory with conf/ and surviving layers, through depth five
  find:
    roots: required
    paths: ["*", "*/*", "*/*/*", "*/*/*/*", "*/*/*/*/*"]
    type: dir
  where: {has: saved_tmpdir, has_dir: stamps, source_anchor: yocto}
  min_idle_for: 3d
  action: delete
  examples:
    root: /home/mark/src
    match: [/home/mark/src/poky/build/tmp, /home/mark/src/a/b/c/build/tmp-glibc]
    no_match: [/home/mark/src/a/b/c/d/build/tmp]
  verified_with: OpenEmbedded-Core master meta/lib/oe/sanity.py (saved_tmpdir, abi_version) and bblayers.conf.sample, sources read 2026-11-03
  liveness_class: verified-heuristic

- name: bazel-output-base-anchored
  category: build
  description: Bazel output bases below a supplied output user root whose recorded workspace survives
  find:
    roots: required
    paths: ["_bazel_*/*"]
    # The repository cache and the install base are never output bases.
    exclude: ["_bazel_*/cache", "_bazel_*/install"]
    type: dir
  where: {has: DO_NOT_BUILD_HERE, has_dir: execroot, source_anchor: bazel}
  min_idle_for: 3d
  action: delete
  examples:
    root: /home/mark/.cache/bazel
    match: [/home/mark/.cache/bazel/_bazel_mark/8f14e45fceea167a5a36dedd4bea2543]
    no_match: [/home/mark/.cache/bazel/_bazel_mark, /home/mark/.cache/bazel/_bazel_mark/cache, /home/mark/.cache/bazel/_bazel_mark/install, /home/mark/.cache/bazel/_bazel_mark/8f14e45fceea167a5a36dedd4bea2543/execroot, /home/mark/.cache/bazel/other/8f14e45fceea167a5a36dedd4bea2543]
  verified_with: Bazel master BlazeWorkspace.java (DO_NOT_BUILD_HERE holds the workspace path), source read 2026-11-03
  liveness_class: verified-heuristic
# ---- end TASK-101

# Each command receives the exact candidate diskgc measured. Keep each
# program's own cache protocol: deleting a whole store can destroy metadata
# or package state that its cleaner intentionally preserves.
- name: pip-cache
  category: caches
  description: pip's HTTP and wheel cache below a supplied home root
  find: {roots: required, paths: [.cache/pip], type: dir}
  action: {command: [pip, --cache-dir, "{path}", cache, purge]}
  examples:
    match: [/home/mark/.cache/pip]
    no_match: [/home/mark/.cache/pip/http-v2, /home/mark/.cache/uv]
  verified_with: pip 26.1.2, host dry-run and Nix container cleaner 2026-10-20
  liveness_class: delegated

- name: uv-cache
  category: python / js
  description: uv's package and archive cache below a supplied home root
  find: {roots: required, paths: [.cache/uv], type: dir}
  action: {command: [uv, cache, clean, --cache-dir, "{path}"], cwd: parent}
  examples:
    match: [/home/mark/.cache/uv]
    no_match: [/home/mark/.cache/uv/archive-v0, /home/mark/.cache/pip]
  verified_with: uv 0.13.0, host dry-run and Nix container cleaner 2026-10-20
  liveness_class: delegated

- name: go-build-cache
  category: caches
  description: Go's build cache below a supplied home root
  find: {roots: required, paths: [.cache/go-build], type: dir}
  action: {command: [env, "GOCACHE={path}", go, clean, -cache]}
  examples:
    match: [/home/mark/.cache/go-build]
    no_match: [/home/mark/.cache/go-build/00, /home/mark/go/pkg/mod]
  verified_with: Go 1.26.8, host dry-run and Nix container cleaner 2026-10-20
  liveness_class: delegated

- name: npm-cache
  category: caches
  description: npm's cache below a supplied home root
  find: {roots: required, paths: [.npm], type: dir}
  action: {command: [npm, cache, clean, --force, --cache, "{path}"]}
