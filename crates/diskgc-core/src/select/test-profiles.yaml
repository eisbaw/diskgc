# Test profiles for diskgc-core's select tests (select/tests.rs), loaded
# with the real loader as user profiles: the abstract `a`, `b`, `f` of the
# grammar's prose (docs/reference.md: `a`, `b` of kind fs with action delete,
# `f` with idle_for), the example config's `zephyr-run` and `claude-sessions`
# (the withdrawn claude-code-tmp's matching set as a user profile), and STAND-INS for
# rows of the built-in library table that are not built in yet (wave 4).
# When the real one ships, its name collides with the stand-in here and the
# test catalog fails to load: delete the stand-in then.
- name: a
  find: {roots: [/tmp], paths: ["a-*"], type: any}
  action: delete
  examples: {match: [/tmp/a-1]}
- name: b
  find: {roots: [/tmp], paths: ["b-*"], type: any}
  action: delete
  examples: {match: [/tmp/b-1]}
- name: f
  where: {idle_for: 1d}
- name: zephyr-run
  find: {roots: [/tmp], paths: ["zephyr-*-run.*"], type: dir}
  action: delete
  examples: {match: [/tmp/zephyr-h5e5-run.jTm9zGlH]}
- name: claude-sessions
  find: {roots: [/tmp], paths: ["claude-{uid}/-*/*"], type: dir}
  action: delete
  examples: {match: [/tmp/claude-1000/-home-mark-src/7cc7f78e]}

# Stand-ins, not built in yet.
- name: nix-shell-tmpdir
  find: {roots: [/tmp], paths: ["nix-shell.*"], type: dir}
  action: delete
  examples: {match: [/tmp/nix-shell.8raHjU]}
- name: tmp-entry
  find: {roots: [/tmp, /var/tmp], paths: ["*"], type: any}
  action: delete
  examples: {match: [/tmp/anything]}
- name: has-cachedir-tag
  where: {has: CACHEDIR.TAG}
- name: retention-newest
  where: {keep_newest: 1}
- name: retention-links
  where: {protect_links: [bin/current]}
- name: retention-link-dirs
  where: {protect_link_dirs: [bin]}
- name: retention-current
  where: {protect_parent_link: current}
- name: retention-installed
  where: {protect_cursor_extensions: extensions.json}
- name: retention-mixed
  where: {has: CACHEDIR.TAG, keep_newest: 1}
