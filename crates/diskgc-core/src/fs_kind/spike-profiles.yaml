# task-68 (profile spike): the library rows of docs/reference.md (Built-in
# profile library) written as USER profiles, as the spike dry-ran them on a
# real laptop (2026-10-18). Evidence, not a shipped library: built-ins land
# with task-65 / task-39 after verification. fs_kind::tests loads this file
# as a configuration and checks every example with the matcher, so it stays
# loadable and its examples stay true. When a built-in of the same name
# ships, loading this file fails (a user profile may not shadow a built-in
# without `override: true`, task-17): delete the row then.
#
# Comments starting with "DOC:" say where a profile deviates from its
# reference.md row and why (the spike's findings, task-68 notes).
version: 1
profiles:
  # ---- the /tmp group -------------------------------------------------

  - name: nix-shell-tmpdir
    category: nix
    description: a nix-shell's TMPDIR in /tmp (unshipped probe)
    find:
      roots: [/tmp]
      paths: ["nix-shell.*"]
      type: dir
    action: delete
    examples:
      match: [/tmp/nix-shell.8raHjU]
      no_match: [/tmp/nix-shell-1-2, /tmp/claude-1000/nix-shell.8raHjU]

  - name: tmp-entry
    category: generic
    description: any top-level entry of /tmp and /var/tmp (unshipped probe)
    find:
      roots: [/tmp, /var/tmp]
      paths: ["*"]
      type: any
    action: delete
    examples:
      match: [/tmp/anything, /var/tmp/.hidden, /tmp/claude-1000]
      no_match: [/tmp/a/b, /home/mark/x]

  - name: claude-code-tmp-star
    category: probes
    description: the earlier claude-code-tmp row, /tmp/claude-{uid}/*/*
    find:
      roots: [/tmp]
      paths: ["claude-{uid}/*/*"]
      type: dir
    action: delete
    examples:
      match: [/tmp/claude-1000/nix-shell.Ab1/pytest-of-mark]

  # ---- plain deletes that need roots ------------------------------------

  - name: gradle-caches
    category: jvm
    description: ~/.gradle/caches
    find:
      roots: required
      paths: [".gradle/caches"]
      type: dir
    action: delete
    examples:
      match: [/home/mark/.gradle/caches]
      no_match: [/home/mark/.gradle]

  - name: maven-repo
    category: jvm
    description: ~/.m2/repository
    find:
      roots: required
      paths: [".m2/repository"]
      type: dir
    action: delete
    examples:
      match: [/home/mark/.m2/repository]
      no_match: [/home/mark/.m2]

  # ---- probes for the findings ------------------------------------------

  - name: has-cachedir-tag
    category: filters
    description: holds a CACHEDIR.TAG (as a term filter, refused until task-16)
    where: {has: CACHEDIR.TAG}

  - name: cachedir-tagged
    category: probes
    description: any directory up to three levels down holding a CACHEDIR.TAG
    find:
      roots: required
      paths: ["*", "*/*", "*/*/*"]
      type: dir
    where: {has: CACHEDIR.TAG}
    action: delete
    examples:
      match: [/home/mark/.cache/x]
