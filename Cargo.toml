[workspace]
resolver = "3"
members = [
    "crates/diskgc",
    "crates/diskgc-core",
    "crates/diskgc-linux",
    "crates/diskgc-model",
    "crates/diskgc-modelgen",
]
# Destructive container tests live in a separate Cargo project so that no
# cargo command run in this workspace compiles them (docs/testing.md, Safety
# interlock, layer 1).
exclude = ["diskgc-e2e"]

[workspace.package]
# Single source of the product version; the flake reads it from here.
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
diskgc-core = { path = "crates/diskgc-core" }
diskgc-linux = { path = "crates/diskgc-linux" }
diskgc-model = { path = "crates/diskgc-model" }
diskgc-modelgen = { path = "crates/diskgc-modelgen" }
# Raw Linux syscalls without libc wrappers (linux_raw backend): openat2,
# statx, statvfs, flock, uname, clock_gettime, pidfd_open and poll. Pure
# Rust, so the static musl build needs no C toolchain.
rustix = { version = "1.1.5", features = ["event", "fs", "process", "system", "time"] }
# Test-only crates (diskgc-model, diskgc-modelgen) so far: the host-model
# format (YAML through serde, a JSON Schema for editors), its timestamps and
# the property-test strategies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
schemars = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
proptest = "1"

# Line tables are enough for backtraces and keep incremental builds and
# target/ small; dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
