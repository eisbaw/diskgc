[workspace]
resolver = "3"
members = [
    "crates/diskgc",
    "crates/diskgc-core",
    "crates/diskgc-linux",
    "crates/diskgc-model",
    "crates/diskgc-modelgen",
]
# Destructive container tests live in a separate Cargo project so that no
# cargo command run in this workspace compiles them (docs/testing.md, Safety
# interlock, layer 1).
exclude = ["diskgc-e2e"]

[workspace.package]
# Single source of the product version; the flake reads it from here.
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
libc = "0.2"
diskgc-core = { path = "crates/diskgc-core" }
diskgc-linux = { path = "crates/diskgc-linux" }
diskgc-model = { path = "crates/diskgc-model" }
diskgc-modelgen = { path = "crates/diskgc-modelgen" }
# Raw Linux syscalls without libc wrappers (linux_raw backend): openat2,
# statx, statvfs, flock, uname, clock_gettime, pidfd_open and poll. Pure
# Rust, so the static musl build needs no C toolchain.
rustix = { version = "1.1.5", features = ["event", "fs", "net", "process", "system", "time"] }
# YAML through serde: the profile schema in diskgc-core (built-in profiles,
# later the config file) and the test-only host-model format. serde-saphyr
# is pinned exactly (2.0.0 and its parser granit-parser 2.0.0 were published
# on 2026-10-13; task-61) and built without its serializer and comment
# support; crates that serialise add the `serialize` feature.
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
# Test-only crates (diskgc-model, diskgc-modelgen) so far: a JSON Schema for
# the host model, its timestamps and the property-test strategies.
serde_json = "1"
schemars = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
# TOML reading only (no writer): rustup's and elan's settings.toml and the
# rust-toolchain.toml pin files the `protect_toolchains` guard reads
# (TASK-94). Already in the lock through proc-macro-crate.
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"] }
proptest = "1"
getrandom = "0.4"

# Disk over rebuild speed and debuggers (TASK-371; docs/testing.md,
# Development scratch): no incremental state and no debug info, and the linker
# strips std's prebuilt debug info from every test and binary. Panic
# messages keep file:line (compiled in, not debug info); backtraces keep
# function names but lose file:line. Environment overrides: an edit-heavy
# session, CARGO_INCREMENTAL=1; a debugger, CARGO_PROFILE_DEV_DEBUG=true
# CARGO_PROFILE_DEV_STRIP=none. diskgc-e2e/Cargo.toml and fuzz/Cargo.toml
# repeat this section: separate workspaces sharing tmp/target.
[profile.dev]
debug = false
strip = "debuginfo"
incremental = false

# The flake builds the shipped binary and runs workspace tests with the
# release profile. A deletion tool must detect integer overflow there too.
[profile.release]
overflow-checks = true
